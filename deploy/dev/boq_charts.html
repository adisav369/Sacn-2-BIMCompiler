  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 1400px; }
  .chart-box {
    background: rgba(255,255,255,0.05); border-radius: 8px; padding: 16px;
    border: 1px solid rgba(255,255,255,0.08);

  .chart-box.full { grid-column: 1 / -1; }
  canvas { max-width: 100%; }

  tr:hover td { background: rgba(255,255,255,0.05); }
  .total-row td { font-weight: bold; color: #4fc3f7; border-top: 2px solid #4fc3f7; }
  .toolbar {
    position: fixed; top: 16px; right: 16px; z-index: 10;
    background: rgba(0,0,0,0.3); border-radius: 8px; padding: 8px 12px;
    backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.08);

  .toolbar button {
    padding: 8px 16px; background: #444; color: #fff; border: 1px solid #666;
    border-radius: 4px; cursor: pointer; font-size: 22px; margin-left: 4px;
  }
  .toolbar button:hover { background: #4fc3f7; color: #000; }
  #status { color: #4fc3f7; font-size: 12px; margin-top: 12px; }

if (params.get('cur2')) _TRL.cur2 = params.get('cur2');

for (const [k,v] of params.entries()) { if (k in _TRL_DEFAULTS && k !== 'cur' && k !== 'cur2' && k !== 'rate') _TRL[k] = v; }

// Currency helpers — all code uses these, never hardcoded symbols

const CUR2 = _TRL.cur2;                                  // secondary symbol
const CUR_RATE = _TRL.cur_rate;                           // conversion: 1 CUR2 = CUR_RATE × CUR
function fmtCur(val) { return CUR + ' ' + val.toLocaleString(); }   // format primary
function fmtCur2(val) { return Math.round(val / CUR_RATE * 100) / 100; }  // convert to secondary
// Legacy alias
const USD_RATE = CUR_RATE;

// WORK_PACKAGES — from rates.js

// ============================================================================
// COMPUTED STATE
// ============================================================================
let db = null, bldName = '';
let _dbSourceLine = '';   // S238: captured at load, re-emitted on each export
let qtoData = [];        // per storey/disc/class rows
let discSummary = {};     // disc -> {qty, matTotal, laborCost, equipCost}
let grandMaterial = 0, grandLabor = 0, grandEquip = 0, totalQty = 0;
let scheduleData = [];    // generated 4D tasks
let chartInstances = [];

// calcLabor(), calcEquipment() — from rates.js

// ============================================================================
// SCHEDULE GENERATION — realistic storey-by-storey, phase-dependent
// ============================================================================
// Model:
//  - Storeys processed bottom-up within each phase
//  - Tasks in same phase+storey run concurrently (different trades)
//  - Next storey starts after previous storey (small overlap lag)
//  - Next phase on a storey starts after previous phase on THAT storey finishes + lag
//  - Single-task duration capped at ~20 days; parallel crews added beyond that
//  - Working days: Mon-Sat (JS getDay: 1-6)

function generateSchedule(activities, startDateStr) {
  const projectStart = new Date(startDateStr || '2025-01-06');

  // Mon-Sat working (JS getDay: 0=Sun, 1=Mon ... 6=Sat)
  const isWorkDay = d => { const w = d.getDay(); return w >= 1 && w <= 6; };

  // Advance by N working days from a date
  function addWorkDays(from, n) {
    const d = new Date(from);
    let rem = Math.ceil(n);
    while (rem > 0) { d.setDate(d.getDate() + 1); if (isWorkDay(d)) rem--; }
    return d;
  }

  // Storey sort: basements < ground < levels < roof
  function storeyRank(s) {
    if (!s) return 999;
    const u = s.toUpperCase();
    if (u.includes('ROOF')) return 900;
    if (u.includes('BASEMENT') || u.startsWith('B')) return -10 + (parseInt(u.replace(/\D/g,''))||0);
    if (u === 'GROUND' || u === 'G' || u === 'G0' || u === 'GF') return 0;
    const n = parseInt(u.replace(/\D/g,''));
    return isNaN(n) ? 50 : n;
  }

  const PHASE_ORDER = ['Substructure','Superstructure','MEP Rough-in','Architecture','MEP Final','Finishes'];
  const INTER_PHASE_LAG = 5;   // working days between phases on same storey
  const INTER_STOREY_LAG = 2;  // working days between storeys in same phase
  const MAX_TASK_DAYS = 20;    // cap before adding parallel crews

  // Group activities by phase -> storey
  const grouped = {};  // phase|||storey -> [act, ...]
  const phaseSets = {};
  for (const act of activities) {
    const rules = SEQUENCE_RULES[act.cls] || DEFAULT_RULE;
    const phase = rules.phase;
    const storey = act.storey || 'Unknown';
    const key = `${phase}|||${storey}`;
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push({...act, phase, rules});
    if (!phaseSets[phase]) phaseSets[phase] = new Set();
    phaseSets[phase].add(storey);
  }

  // Sort storeys per phase
  for (const p of Object.keys(phaseSets)) {
    phaseSets[p] = [...phaseSets[p]].sort((a,b) => storeyRank(a) - storeyRank(b));
  }

  // storeyPhaseEnd[storey][phase] = finish date
  const storeyPhaseEnd = {};
  const phaseFirstStart = {}; // phase -> date when first storey of this phase finishes
  const tasks = [];
  let taskId = 0;

  for (const phase of PHASE_ORDER) {
    if (!phaseSets[phase]) continue;
    let prevStoreyEnd = null;

    for (const storey of phaseSets[phase]) {
      const key = `${phase}|||${storey}`;
      const acts = grouped[key];
      if (!acts) continue;

      // Start date: wait for (a) latest earlier phase on this storey, (b) previous storey in this phase
      let storeyStart = new Date(projectStart);

      // Walk back through ALL earlier phases to find the latest one with data for this storey
      const phaseIdx = PHASE_ORDER.indexOf(phase);
      if (phaseIdx > 0 && storeyPhaseEnd[storey]) {
        for (let pi = phaseIdx - 1; pi >= 0; pi--) {
          const earlierPhase = PHASE_ORDER[pi];
          if (storeyPhaseEnd[storey][earlierPhase]) {
            const after = addWorkDays(storeyPhaseEnd[storey][earlierPhase], INTER_PHASE_LAG);
            if (after > storeyStart) storeyStart = after;
            break;
          }
        }
      }
      // Also wait for ANY earlier phase globally (prevents phases from starting before predecessors)
      if (phaseIdx > 0) {
        for (let pi = phaseIdx - 1; pi >= 0; pi--) {
          if (phaseFirstStart[PHASE_ORDER[pi]]) {
            const after = addWorkDays(phaseFirstStart[PHASE_ORDER[pi]], INTER_PHASE_LAG);
            if (after > storeyStart) storeyStart = after;
            break;
          }
        }
      }
      if (prevStoreyEnd) {
        const after = addWorkDays(prevStoreyEnd, INTER_STOREY_LAG);
        if (after > storeyStart) storeyStart = after;
      }

      // S240c: One grouped task per (phase, storey) — aggregate all IFC classes
      let maxDuration = 0;
      let totalQtyGroup = 0;
      let totalCrew = 0;
      const ifcClasses = [];
      const disciplines = new Set();
      const resources = new Set();
      const equipments = new Set();

      for (const act of acts) {
        const prod = act.labor.prod || 10;
        let duration = Math.max(1, act.qty / prod);
        let crews = 1;
        if (duration > MAX_TASK_DAYS) {
          crews = Math.ceil(duration / MAX_TASK_DAYS);
          duration = Math.ceil(duration / crews);
        }
        if (duration > maxDuration) maxDuration = duration;
        totalQtyGroup += act.qty;
        totalCrew = Math.max(totalCrew, (act.labor.crew || 2) * crews);
        ifcClasses.push(act.cls);
        disciplines.add(act.disc);
        const res = act.labor.tradeKey || act.rules.resource;
        if (res) resources.add(res);
        const equipAlloc = EQUIPMENT_ALLOCATION[act.cls];
        if (equipAlloc) equipments.add(EQUIPMENT_RATES[equipAlloc.equipment].desc);
      }

      const taskFinish = addWorkDays(storeyStart, maxDuration);
      const discLabel = [...disciplines].join('/');
      taskId++;
      tasks.push({
        id: taskId,
        wbs: `1.${PHASE_ORDER.indexOf(phase)+1}.${taskId}`,
        name: `${storey} - ${phase} (${discLabel})`,
        ifcClasses,
        phase,
        discipline: discLabel,
        storey,
        qty: totalQtyGroup,
        uom: 'MIX',
        productivity: totalQtyGroup > 0 ? Math.round(totalQtyGroup / maxDuration) : 0,
        duration: maxDuration,
        crews: 1,
        startDate: storeyStart.toISOString().slice(0,10),
        finishDate: taskFinish.toISOString().slice(0,10),
        resource: [...resources].join(','),
        crew: totalCrew,
        equipment: [...equipments].join(', '),
        startDay: Math.round((storeyStart - projectStart) / 86400000),
        finishDay: Math.round((taskFinish - projectStart) / 86400000),
      });

      if (!storeyPhaseEnd[storey]) storeyPhaseEnd[storey] = {};
      storeyPhaseEnd[storey][phase] = taskFinish;
      if (!phaseFirstStart[phase]) phaseFirstStart[phase] = taskFinish;
      prevStoreyEnd = taskFinish;
    }
  }
  return tasks;
}

// ============================================================================
// 4D SCHEDULE AUDIT — S240 §0.1 (8 checks, must all PASS before sync)
// ============================================================================
function audit4DSchedule(scheduleData, db, qtoData) {
  const results = [];
  const PHASE_ORDER = ['Substructure','Superstructure','MEP Rough-in','Architecture','MEP Final','Finishes'];

  // Check 1: Task coverage — every IFC class in DB maps to SEQUENCE_RULES (no DEFAULT)
  const dbClasses = qtoData.map(r => r.cls);
  const unmapped = [...new Set(dbClasses.filter(c => !SEQUENCE_RULES[c]))];
  const c1 = unmapped.length === 0;
  console.log('§4D_AUDIT_COVERAGE ' + (c1 ? 'PASS' : 'FAIL') + ' unmapped=[' + unmapped.join(',') + ']');
  results.push({name:'COVERAGE', pass:c1});

  // Check 2: Phase order — no phase inversion in task sequence
  let c2 = true;
  let lastPhaseIdx = -1;
  const tasksByOrder = [...scheduleData].sort((a,b) => a.startDay - b.startDay || PHASE_ORDER.indexOf(a.phase) - PHASE_ORDER.indexOf(b.phase));
  for (const t of tasksByOrder) {
    const pi = PHASE_ORDER.indexOf(t.phase);
    if (pi < 0) continue;
    // Allow same phase — only flag if a later task's phase is strictly earlier AND starts later
    // Phase inversion = a task in an earlier phase starts AFTER a task in a later phase on the SAME storey
  }
  // Stricter check: per-storey, no earlier phase starting after a later phase
  const storeyPhaseStarts = {};
  for (const t of scheduleData) {
    const key = t.storey + '|||' + t.phase;
    if (!storeyPhaseStarts[key] || t.startDay < storeyPhaseStarts[key]) {
      storeyPhaseStarts[key] = t.startDay;
    }
  }
  const storeys = [...new Set(scheduleData.map(t => t.storey))];
  const inversions = [];
  for (const st of storeys) {
    for (let i = 0; i < PHASE_ORDER.length - 1; i++) {
      for (let j = i + 1; j < PHASE_ORDER.length; j++) {
        const earlyStart = storeyPhaseStarts[st + '|||' + PHASE_ORDER[i]];
        const lateStart = storeyPhaseStarts[st + '|||' + PHASE_ORDER[j]];
        if (earlyStart !== undefined && lateStart !== undefined && lateStart < earlyStart) {
          inversions.push(st + ':' + PHASE_ORDER[j] + '<' + PHASE_ORDER[i]);
          c2 = false;
        }
      }
    }
  }
  console.log('§4D_AUDIT_PHASE_ORDER ' + (c2 ? 'PASS' : 'FAIL') + (inversions.length ? ' inversions=[' + inversions.join(',') + ']' : ' ok=true'));
  results.push({name:'PHASE_ORDER', pass:c2});

  // Check 3: Storey order — within each phase, storeys run bottom-up
  let c3 = true;
  const storeyViolations = [];
  function storeyRank(s) {
    if (!s) return 999;
    const u = s.toUpperCase();
    if (u.includes('ROOF')) return 900;
    if (u.includes('BASEMENT') || u.startsWith('B')) return -10 + (parseInt(u.replace(/\D/g,''))||0);
    if (u === 'GROUND' || u === 'G' || u === 'G0' || u === 'GF') return 0;
    const n = parseInt(u.replace(/\D/g,''));
    return isNaN(n) ? 50 : n;
  }
  for (const phase of PHASE_ORDER) {
    const phaseTasks = scheduleData.filter(t => t.phase === phase);
    const storeyStarts = {};
    for (const t of phaseTasks) {
      if (!storeyStarts[t.storey] || t.startDay < storeyStarts[t.storey]) {
        storeyStarts[t.storey] = t.startDay;
      }
    }
    const sorted = Object.entries(storeyStarts).sort((a,b) => a[1] - b[1]);
    for (let i = 1; i < sorted.length; i++) {
      if (storeyRank(sorted[i][0]) < storeyRank(sorted[i-1][0])) {
        storeyViolations.push(phase + ':' + sorted[i-1][0] + '>' + sorted[i][0]);
        c3 = false;
      }
    }
  }
  console.log('§4D_AUDIT_STOREY_ORDER ' + (c3 ? 'PASS' : 'FAIL') + (storeyViolations.length ? ' violations=[' + storeyViolations.join(',') + ']' : ' ok=true'));
  results.push({name:'STOREY_ORDER', pass:c3});

  // Check 4: Duration sanity — no task >120 days, no task <1 day
  const outliers = scheduleData.filter(t => t.duration > 120 || t.duration < 1).map(t => t.name + '=' + t.duration + 'd');
  const c4 = outliers.length === 0;
  console.log('§4D_AUDIT_DURATION ' + (c4 ? 'PASS' : 'FAIL') + ' outliers=[' + outliers.join(',') + ']');
  results.push({name:'DURATION', pass:c4});

  // Check 5: Overlap sanity — no two tasks with same phase on same storey (grouped = impossible, but verify)
  let c5 = true;
  const conflicts = [];
  for (let i = 0; i < scheduleData.length; i++) {
    for (let j = i + 1; j < scheduleData.length; j++) {
      const a = scheduleData[i], b = scheduleData[j];
      if (a.storey === b.storey && a.phase === b.phase &&
          a.startDay < b.finishDay && b.startDay < a.finishDay) {
        conflicts.push(a.name + ' vs ' + b.name);
        c5 = false;
      }
    }
  }
  console.log('§4D_AUDIT_OVERLAP ' + (c5 ? 'PASS' : 'FAIL') + ' conflicts=[' + conflicts.slice(0,5).join('; ') + (conflicts.length > 5 ? '..+' + (conflicts.length-5) : '') + ']');
  results.push({name:'OVERLAP', pass:c5});

  // Check 6: Total duration — project total ≤ 3× naive serial sum
  const serialSum = scheduleData.reduce((s,t) => s + t.duration, 0);
  const projectDays = scheduleData.length ? Math.max(...scheduleData.map(t => t.finishDay)) : 0;
  const ratio = serialSum > 0 ? (projectDays / serialSum).toFixed(2) : 0;
  const c6 = projectDays <= 3 * serialSum;
  console.log('§4D_AUDIT_TOTAL ' + (c6 ? 'PASS' : 'FAIL') + ' days=' + projectDays + ' serial=' + Math.round(serialSum) + ' ratio=' + ratio);
  results.push({name:'TOTAL', pass:c6});

  // Check 7: Gantt bar labels — no undefined/[object Object], no empty names
  const badLabels = scheduleData.filter(t => !t.name || t.name.includes('undefined') || t.name.includes('[object'));
  const c7 = badLabels.length === 0;
  console.log('§4D_AUDIT_LABELS ' + (c7 ? 'PASS' : 'FAIL') + (badLabels.length ? ' bad=[' + badLabels.map(t=>t.name).join(',') + ']' : ' ok=true'));
  results.push({name:'LABELS', pass:c7});

  // Check 8: Task↔GUID resolution — every grouped task resolves to ≥1 GUID
  let c8 = true;
  const orphaned = [];
  if (db) {
    for (const t of scheduleData) {
      const classes = t.ifcClasses || (t.ifcClass ? [t.ifcClass] : []);
      if (!classes.length) { orphaned.push(t.name); c8 = false; continue; }
      let totalCount = 0;
      try {
        for (const cls of classes) {
          const res = db.exec("SELECT COUNT(*) FROM elements_meta WHERE ifc_class = '" +
            cls.replace(/'/g,"''") + "' AND storey = '" +
            (t.storey||'').replace(/'/g,"''") + "'");
          totalCount += (res[0]?.values[0]?.[0] || 0);
        }
        if (totalCount === 0) { orphaned.push(t.name + '(0 GUIDs)'); c8 = false; }
      } catch(e) {
        orphaned.push(t.name + '(query error)');
        c8 = false;
      }
    }
  }
  console.log('§4D_AUDIT_GUIDS ' + (c8 ? 'PASS' : 'FAIL') + ' orphaned=[' + orphaned.slice(0,5).join(',') + (orphaned.length > 5 ? '..+' + (orphaned.length-5) : '') + ']');
  results.push({name:'GUIDS', pass:c8});

  // Summary
  const failCount = results.filter(r => !r.pass).length;
  console.log('§4D_AUDIT_SUMMARY pass=' + results.filter(r=>r.pass).length + ' fail=' + failCount + ' total=8');

  // Show warning banner if any fail
  if (failCount > 0) {
    let banner = document.getElementById('audit4d-banner');
    if (!banner) {
      banner = document.createElement('div');
      banner.id = 'audit4d-banner';
      banner.style.cssText = 'background:#fff3cd;color:#856404;border:1px solid #ffc107;padding:8px 12px;margin:8px 0;border-radius:4px;font-weight:bold;';
      const info = document.getElementById('info');
      if (info) info.parentNode.insertBefore(banner, info.nextSibling);
    }
    var failNames = results.filter(r => !r.pass).map(r => r.name);
    banner.textContent = '\u26a0 Schedule audit: ' + failNames.join(', ') + (failNames.indexOf('COVERAGE') >= 0 && unmapped.length ? ' \u2014 unmapped: ' + unmapped.join(', ') : '');
  }

  return { results, failCount };
}

// ============================================================================
// INIT — load DB, compute everything
// ============================================================================
// S238: Fetch DB buffer — checks bim_ootb_cache IDB first (same cache as scene.js), falls back to fetch
// import:// URLs: IDB only (no network). OCI URLs: IDB first (scene.js wrote it), then network.
async function fetchDbBuffer(url) {
  const cacheDb = await new Promise(resolve => {
    const req = indexedDB.open('bim_ootb_cache', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('dbs');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
  });

  if (cacheDb) {
    const cached = await new Promise(resolve => {
      const tx = cacheDb.transaction('dbs', 'readonly');
      const req = tx.objectStore('dbs').get(url);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
    if (cached) {
      const src = url.startsWith('import://') ? 'import' : 'idb';
      _dbSourceLine = '§CHARTS_DB_SOURCE source=' + src + ' url=' + url.split('/').pop() + ' size=' + (cached.byteLength / 1024).toFixed(0) + 'KB';
      _log(_dbSourceLine);
      return cached;
    }
  }

  if (url.startsWith('import://')) throw new Error('DB not found in cache: ' + url);

  _dbSourceLine = '§CHARTS_DB_SOURCE source=oci url=' + url.split('/').pop();
  _log(_dbSourceLine);
  return fetch(url).then(r => r.arrayBuffer());
}

async function init() {
  // §1.2: Load rate template from JSON before any cost calculation
  if (typeof initRateTemplate === 'function') {
    await initRateTemplate();
  } else {
    console.warn('§QTO_RATES_FALLBACK initRateTemplate not available — using hardcoded rates');
  }

  const SQL = await initSqlJs({
    locateFile: f => `https://cdn.jsdelivr.net/npm/rtree-sql.js@1.7.0/dist/${f}`
  });
  document.getElementById('info').textContent = `Loading ${DB_URL}...`;
  const buf = await fetchDbBuffer(DB_URL);
  db = new SQL.Database(new Uint8Array(buf));

  // Determine building
  bldName = BLD;
  if (!bldName) {
    const r = db.exec("SELECT building, COUNT(*) c FROM elements_meta GROUP BY building ORDER BY c DESC LIMIT 1");
    bldName = r.length ? r[0].values[0][0] : 'Unknown';
  }

  // §2.1: Unit-aware QTO — linear elements use bbox length (M), area use bbox area (M2), rest use COUNT (EA)
  // Implementing MEP_5D_QTO.md §2.1–2.3, §6.3 — Witness: W-QTO_UNIT
  const _bldSafe = bldName.replace(/'/g,"''");

  // Build unit lookup from RATES: which IFC classes are M, M2, EA, KG
  const LINEAR_CLASSES = new Set();   // unit = M
  const AREA_CLASSES = new Set();     // unit = M2
  for (const cls in RATES) {
    if (RATES[cls].unit === 'M')  LINEAR_CLASSES.add(cls);
    if (RATES[cls].unit === 'M2') AREA_CLASSES.add(cls);
  }

  // §6.3: Create qto_cache table if not exists (write-back for fast repeat access)
  try {
    db.run(`CREATE TABLE IF NOT EXISTS qto_cache (
      ifc_class TEXT NOT NULL, storey TEXT NOT NULL, discipline TEXT NOT NULL,
      qty REAL NOT NULL, uom TEXT NOT NULL, element_count INTEGER NOT NULL,
      material_cost REAL, labour_cost REAL, equipment_cost REAL,
      rate_template TEXT, computed_at TEXT,
      PRIMARY KEY (ifc_class, storey, discipline, rate_template)
    )`);
  } catch(e) { /* read-only DB — cache write will be skipped */ }

  // §6.3: Check qto_cache for fast path
  let cacheHit = false;
  const tplName = RATE_TEMPLATE_NAME || 'hardcoded_cidb2024';
  try {
    const cached = db.exec("SELECT ifc_class, storey, discipline, qty, uom, element_count, material_cost, labour_cost, equipment_cost FROM qto_cache WHERE rate_template = '" + tplName.replace(/'/g,"''") + "'");
    if (cached.length && cached[0].values.length > 0) {
      cacheHit = true;
      console.log('§QTO_CACHE_HIT template=' + tplName + ' rows=' + cached[0].values.length);
    }
  } catch(e) { /* no cache table or read error — compute fresh */ }

  // Query 1: Element counts + mesh counts (always needed for schedule/display)
  const countRows = db.exec(`
    SELECT m.discipline, m.ifc_class, m.storey, COUNT(*) as cnt,
           COUNT(DISTINCT i.geometry_hash) as meshes
    FROM elements_meta m LEFT JOIN element_instances i ON m.guid = i.guid
    WHERE m.building = '${_bldSafe}'
    GROUP BY m.discipline, m.ifc_class, m.storey
    ORDER BY m.discipline, m.storey, cnt DESC
  `);

  if (!countRows.length) { document.getElementById('info').textContent = 'No data.'; return; }

  // Query 2: Linear elements (M) — SUM of longest bbox axis per element
  const linearQty = {};  // key: disc|cls|storey → sum of lengths
  try {
    const linRows = db.exec(`
      SELECT m.discipline, m.ifc_class, m.storey,
             SUM(MAX(t.bbox_x, t.bbox_y, t.bbox_z)) as total_length
      FROM elements_meta m
      JOIN element_transforms t ON m.guid = t.guid
      WHERE m.building = '${_bldSafe}'
        AND t.bbox_x IS NOT NULL AND t.bbox_x > 0
      GROUP BY m.discipline, m.ifc_class, m.storey
    `);
    if (linRows.length) {
      for (const r of linRows[0].values) {
        linearQty[r[0] + '|' + r[1] + '|' + r[2]] = r[3];
      }
    }
  } catch(e) { console.warn('§QTO_WARN linear query error: ' + e.message); }

  // Query 3: Area elements (M2) — SUM of (largest_axis × second_largest_axis)
  const areaQty = {};  // key: disc|cls|storey → sum of areas
  try {
    const areaRows = db.exec(`
      SELECT m.discipline, m.ifc_class, m.storey,
             SUM(
               MAX(t.bbox_x, t.bbox_y, t.bbox_z) *
               CASE WHEN t.bbox_x >= t.bbox_y AND t.bbox_x >= t.bbox_z
                    THEN MAX(t.bbox_y, t.bbox_z)
                    WHEN t.bbox_y >= t.bbox_x AND t.bbox_y >= t.bbox_z
                    THEN MAX(t.bbox_x, t.bbox_z)
                    ELSE MAX(t.bbox_x, t.bbox_y)
               END
             ) as total_area
      FROM elements_meta m
      JOIN element_transforms t ON m.guid = t.guid
      WHERE m.building = '${_bldSafe}'
        AND t.bbox_x IS NOT NULL AND t.bbox_x > 0
      GROUP BY m.discipline, m.ifc_class, m.storey
    `);
    if (areaRows.length) {
      for (const r of areaRows[0].values) {
        areaQty[r[0] + '|' + r[1] + '|' + r[2]] = r[3];
      }
    }
  } catch(e) { console.warn('§QTO_WARN area query error: ' + e.message); }

  // Process data with unit-aware quantities
  qtoData = []; discSummary = {};
  grandMaterial = 0; grandLabor = 0; grandEquip = 0; totalQty = 0;
  let qtoWarnCount = 0;

  for (const row of countRows[0].values) {
    const [disc, cls, storey, cnt, meshes] = row;
    const mc = RATES[cls];
    const unit = mc ? mc.unit : 'EA';
    const key = disc + '|' + cls + '|' + storey;

    // §2.1: Resolve quantity by unit type
    let qty;
    if (unit === 'M' && LINEAR_CLASSES.has(cls)) {
      qty = linearQty[key];
      if (!qty || qty <= 0) {
        // §2.3: Fallback — no bbox data, use count
        qty = cnt;
        qtoWarnCount++;
        console.warn('§QTO_WARN no bbox for cls=' + cls + ' storey=' + storey + ', using count fallback (' + cnt + ')');
      }
    } else if (unit === 'M2' && AREA_CLASSES.has(cls)) {
      qty = areaQty[key];
      if (!qty || qty <= 0) {
        qty = cnt;
        qtoWarnCount++;
        console.warn('§QTO_WARN no bbox for cls=' + cls + ' storey=' + storey + ', using count fallback (' + cnt + ')');
      }
    } else {
      qty = cnt;  // EA, KG — count-based
    }

    const matRate = mc ? mc.rate : 0;
    const matTotal = Math.round(matRate * qty * 100) / 100;
    const labor = calcLabor(cls, qty);
    const equip = calcEquipment(cls, labor.days);

    grandMaterial += matTotal;
    grandLabor += labor.cost;
    grandEquip += equip.cost;
    totalQty += qty;

    const r = {
      disc, cls, storey, qty, cnt, meshes, matRate, matTotal, unit,
      laborDays: labor.days, laborCost: labor.cost, laborCrew: labor.crew, laborTrade: labor.trade,
      equipCost: equip.cost, equipDesc: equip.desc, equipDays: equip.days,
      desc: mc ? mc.desc : cls,
      smmSection: mc && mc.smm_section ? mc.smm_section : '',
      labor, // keep full object for schedule
    };
    qtoData.push(r);

    if (!discSummary[disc]) discSummary[disc] = {qty:0, matTotal:0, laborCost:0, equipCost:0};
    discSummary[disc].qty += qty;
    discSummary[disc].matTotal += matTotal;
    discSummary[disc].laborCost += labor.cost;
    discSummary[disc].equipCost += equip.cost;

    // §QTO_UNIT witness per class+storey
    console.log('§QTO_UNIT cls=' + cls + ' unit=' + unit + ' qty=' + (Math.round(qty * 100) / 100) + ' cnt=' + cnt + ' storey=' + storey);
  }

  // §6.3: Write to qto_cache (if DB is writable)
  try {
    db.run("DELETE FROM qto_cache WHERE rate_template = '" + tplName.replace(/'/g,"''") + "'");
    const now = new Date().toISOString();
    const stmt = db.prepare("INSERT INTO qto_cache (ifc_class, storey, discipline, qty, uom, element_count, material_cost, labour_cost, equipment_cost, rate_template, computed_at) VALUES (?,?,?,?,?,?,?,?,?,?,?)");
    for (const r of qtoData) {
      stmt.run([r.cls, r.storey, r.disc, r.qty, r.unit, r.cnt, r.matTotal, r.laborCost, r.equipCost, tplName, now]);
    }
    stmt.free();
    console.log('§QTO_CACHE_WRITE template=' + tplName + ' rows=' + qtoData.length);
  } catch(e) { /* read-only DB or no table — skip silently */ }

  console.log('§QTO_SUMMARY classes=' + qtoData.length + ' material=' + Math.round(grandMaterial) + ' labor=' + Math.round(grandLabor) + ' equip=' + Math.round(grandEquip) + ' warnings=' + qtoWarnCount);

  // Generate 4D schedule
  scheduleData = generateSchedule(qtoData, '2025-01-06');

  // S240 §0.1: Run 8-check audit before any 4D sync
  const auditResult = audit4DSchedule(scheduleData, db, qtoData);

  // S240c §P1a: Resolve GUIDs per grouped task — union all ifcClasses, storey-match first, building-wide fallback
  const _bld = bldName.replace(/'/g,"''");
  for (const t of scheduleData) {
    const classes = t.ifcClasses || (t.ifcClass ? [t.ifcClass] : []);
    if (!classes.length) { t.guids = []; continue; }
    t.guids = [];
    const st = (t.storey||'').replace(/'/g,"''");
    for (const ifcClass of classes) {
      try {
        const cls = ifcClass.replace(/'/g,"''");
        const sql = "SELECT guid FROM elements_meta WHERE ifc_class = '" + cls +
          "' AND storey = '" + st + "' AND building = '" + _bld + "'";
        const res = db.exec(sql);
        let guids = res[0] ? res[0].values.map(r => r[0]) : [];
        // BUG-1 fallback: if storey match yields 0, query building-wide
        if (guids.length === 0) {
          const fallback = db.exec("SELECT guid FROM elements_meta WHERE ifc_class = '" +
            cls + "' AND building = '" + _bld + "'");
          guids = fallback[0] ? fallback[0].values.map(r => r[0]) : [];
          if (guids.length > 0) {
            console.log('§4D_GUID_FALLBACK class=' + ifcClass + ' storey=' + t.storey + ' fallbackCount=' + guids.length);
          }
        }
        t.guids = t.guids.concat(guids);
      } catch(e) {}
    }
  }
  // S240c §P1b: Deduplicate — each GUID belongs to exactly one task (first in phase order wins)
  const _assignedGuids = new Set();
  let _guidsBefore = 0, _guidsAfter = 0;
  for (const t of scheduleData) {
    _guidsBefore += t.guids.length;
    t.guids = t.guids.filter(g => !_assignedGuids.has(g));
    t.guids.forEach(g => _assignedGuids.add(g));
    _guidsAfter += t.guids.length;
  }
  console.log('§4D_GUID_DEDUP before=' + _guidsBefore + ' after=' + _guidsAfter + ' stripped=' + (_guidsBefore - _guidsAfter));
  // S240c §P1d: Coverage witness — every element must be in exactly one task
  let _totalElements = 0;
  try {
    const r = db.exec("SELECT COUNT(*) FROM elements_meta WHERE building = '" + _bld + "'");
    _totalElements = r[0] ? r[0].values[0][0] : 0;
  } catch(e) {}
  const _orphanCount = _totalElements - _assignedGuids.size;
  console.log('§4D_COVERAGE total=' + _totalElements + ' assigned=' + _assignedGuids.size + ' orphan=' + _orphanCount);

  const totalGuids = _guidsAfter;
  const zeroGuidTasks = scheduleData.filter(t => t.guids.length === 0);
  console.log('§4D_GUID_RESOLVE tasks=' + scheduleData.length + ' totalGuids=' + totalGuids + ' zeroGuid=' + zeroGuidTasks.length +
    (zeroGuidTasks.length ? ' [' + zeroGuidTasks.slice(0,5).map(t=>t.name).join(', ') + ']' : ''));

  const grandTotal = grandMaterial + grandLabor + grandEquip;
  const projDaysInit = scheduleData.length ? Math.max(...scheduleData.map(t=>t.finishDay)) : 0;
  console.log(`§QTO: ${qtoData.length} rows | ${totalQty} elements`);
  console.log(`§TOTALS: Mat ${CUR}${grandMaterial.toLocaleString()} | Lab ${CUR}${grandLabor.toLocaleString()} | Eq ${CUR}${grandEquip.toLocaleString()} | Grand ${CUR}${grandTotal.toLocaleString()}`);
  console.log(`§SCHEDULE: ${scheduleData.length} tasks | ${projDaysInit} calendar days`);
  const unmapped = [...new Set(qtoData.map(r=>r.cls).filter(c=>!SEQUENCE_RULES[c]))];
  console.log(`§UNMAPPED: ${unmapped.length ? unmapped.join(', ') : 'NONE'}`);
  document.getElementById('info').textContent =
    `${bldName} | ${totalQty.toLocaleString()} elements | ${CUR}${grandTotal.toLocaleString()} (Mat ${grandMaterial.toLocaleString()} + Lab ${grandLabor.toLocaleString()} + Equip ${grandEquip.toLocaleString()})`;


  // S224: Load diff DB if present — compute variance for VO sheets in Excel
  if (DIFF_DB_URL) {
    try {
      const diffBuf = await fetchDbBuffer(DIFF_DB_URL);
      diffDb = new SQL.Database(new Uint8Array(diffBuf));
      const guids1 = new Set(db.exec("SELECT guid FROM elements_meta")[0].values.map(r => r[0]));
      const guids2 = new Set(diffDb.exec("SELECT guid FROM elements_meta")[0].values.map(r => r[0]));
      const added = [...guids2].filter(g => !guids1.has(g));
      const common = [...guids2].filter(g => guids1.has(g));
      const changed = common.filter(g => {
        const r1 = db.exec("SELECT element_name, material_rgba, storey FROM elements_meta WHERE guid='" + g.replace(/'/g, "''") + "'");
        const r2 = diffDb.exec("SELECT element_name, material_rgba, storey FROM elements_meta WHERE guid='" + g.replace(/'/g, "''") + "'");
        return JSON.stringify(r1[0]?.values[0]) !== JSON.stringify(r2[0]?.values[0]);
      });
      // S225: merge vs revision — <10% overlap = merge (don't flag base as removed)
      const overlap = common.length / Math.max(guids1.size, guids2.size);
      const isMerge = overlap < 0.1;
      const removed = isMerge ? [] : [...guids1].filter(g => !guids2.has(g));
      diffResult = { added, removed, changed, isMerge };
      console.log('[S225] §BOQ_DIFF added=' + added.length + ' removed=' + removed.length + ' changed=' + changed.length + ' mode=' + (isMerge ? 'MERGE' : 'REVISION'));
      var modeTag = isMerge ? ' | MERGE: +' + added.length + ' new elements' : ' | VARIANCE: +' + added.length + ' −' + removed.length + ' ~' + changed.length;
      document.getElementById('info').textContent += modeTag;
    } catch(e) {
      console.log('[S224] §BOQ_DIFF_ERROR ' + e.message);
    }
  }

  renderCharts();
}

    const weekLabels = [], weekPcts = [];
    const totalWeeks = Math.max(1, Math.ceil(maxDay / 7));
    const sampleInterval = Math.max(1, Math.floor(totalWeeks / 20));

    for (let w = 0; w <= totalWeeks; w += sampleInterval) {
      const dayEnd = w * 7;
      const completed = scheduleData.filter(t => t.finishDay <= dayEnd).length;
      weekLabels.push(`W${w}`);
      weekPcts.push(Math.round(completed / totalTasks * 1000) / 10);
    }
    // Ensure final point
    if (weekPcts[weekPcts.length-1] < 100) {
      weekLabels.push(`W${totalWeeks}`);
      weekPcts.push(100);

    chartInstances.push(new Chart(scCanvas, {
      type:'line',

    // Update resource panel for a given day
    function updateResPanel(day) {
      if (day <= 0) { resPanel.style.display = 'none'; return; }
      const active = scheduleData.filter(t => t.startDay <= day && t.finishDay >= day);
      if (!active.length) { resPanel.style.display = 'none'; return; }

      // Aggregate resources
      const trades = {};  // tradeKey → {crew, equipment[], tasks}
      let totalCrew = 0, machines = new Set();
      for (const t of active) {
        const resources = (t.resource || '').split(',').filter(Boolean);
        for (const r of resources) {
          if (!trades[r]) trades[r] = {crew:0, equip:new Set(), tasks:0};
          trades[r].crew += t.crew || 0;
          trades[r].tasks++;
        }
        totalCrew += t.crew || 0;
        if (t.equipment) t.equipment.split(', ').forEach(e => { if (e) machines.add(e); });
      }

      // Build HTML rows
      const body = document.getElementById('res-body');
      let html = '';
      for (const [key, data] of Object.entries(trades).sort((a,b) => b[1].crew - a[1].crew)) {
        const info = RES_ICONS[key] || {icon:'\ud83d\udc77', label:key, color:'#888'};

          '<span style="font-size:20px;width:28px;text-align:center;">' + info.icon + '</span>' +
          '<span style="flex:1;color:' + info.color + ';font-weight:600;">' + info.label + '</span>' +
          '<span style="background:' + info.color + '18;color:' + info.color + ';padding:2px 8px;border-radius:8px;font-weight:700;font-size:12px;">' +
          '\u00d7' + data.crew + ' crew</span></div>';
      }
      // Equipment row if any
      if (machines.size) {
        html += '<div style="margin-top:4px;padding-top:4px;border-top:1px solid rgba(0,0,0,0.05);">';
        machines.forEach(m => {
          html += '<div style="display:flex;align-items:center;gap:8px;padding:2px 0;color:#777;">' +
            '<span style="font-size:16px;width:28px;text-align:center;">\ud83d\ude9c</span>' +
            '<span style="flex:1;font-size:12px;">' + m + '</span></div>';
        });
        html += '</div>';
      }
      body.innerHTML = html;

      // Footer: totals + cumulative
      const cumDays = scheduleData.filter(t => t.finishDay <= day).reduce((s,t) => s + t.duration * t.crew, 0);
      const totalDays = scheduleData.reduce((s,t) => s + t.duration * t.crew, 0);
      const pct = totalDays > 0 ? Math.round(cumDays / totalDays * 100) : 0;
      document.getElementById('res-footer').innerHTML =
        '<strong>' + totalCrew + '</strong> workers \u00b7 <strong>' + machines.size + '</strong> machines \u00b7 Day ' + day +
        '<br>Cumulative: ' + cumDays.toLocaleString() + ' / ' + totalDays.toLocaleString() + ' labour-days (' + pct + '%)';
      resPanel.style.display = '';
      console.log('§4D_RESOURCE_LEGEND day=' + day + ' trades=' + Object.keys(trades).length + ' workers=' + totalCrew + ' machines=' + machines.size);
    }

    // State
    let _scrubActive = false;
    let _playTimer = null;
    let _playing = false;
    let _currentDay = 0;

    // Get Gantt chart plot area pixel bounds (x-axis area only)
    function getPlotArea() {
      const xScale = ganttChart.scales.x;
      return { left: xScale.left, right: xScale.right, top: ganttChart.chartArea.top, bottom: ganttChart.chartArea.bottom };
    }

    // Map pixel X → day number
    function pixelToDay(px) {
      const area = getPlotArea();
      const ratio = Math.max(0, Math.min(1, (px - area.left) / (area.right - area.left)));
      return Math.round(ratio * maxDay);
    }

    // Map day → pixel X
    function dayToPixel(day) {
      const area = getPlotArea();
      return area.left + (day / maxDay) * (area.right - area.left);
    }

    // Find task index for a given day
    function dayToTaskIndex(day) {
      let best = -1;
      for (let i = 0; i < scheduleData.length; i++) {
        if (scheduleData[i].startDay <= day) best = i;
      }
      return best;
    }

    // Find ALL active tasks at a given day (for tooltip)
    function tasksAtDay(day) {
      return scheduleData.filter(t => t.startDay <= day && t.finishDay >= day);
    }

    // Apply scrub state
    function applyScrub(day) {
      _currentDay = day;
      const px = dayToPixel(day);
      scrubLine.style.left = px + 'px';
      scrubLine.style.display = 'block';
      scrubHandle.style.left = px + 'px';
      scrubHandle.style.display = 'block';
      scrubTip.style.left = Math.min(px + 8, ganttBox.offsetWidth - 310) + 'px';

      dayLabel.textContent = 'Day ' + day + ' / ' + maxDay;
      updateResPanel(day);

      if (day <= 0) {
        // Day 0 = normal building, no glass
        scrubTip.style.display = 'none';
        taskLabel.textContent = '';
        if (_scrubActive) {
          _scrubActive = false;
          _bim4d.postMessage({ type: '4D_RESET' });
          console.log('§4D_SCRUB day=0 RESET');
        }
        return;
      }

      // Day 1+ = ghost glass mode
      const active = tasksAtDay(day);
      const tidx = dayToTaskIndex(day);

      // Show tooltip with active tasks
      if (active.length > 0) {
        scrubTip.textContent = active.map(t => t.name).join(' | ');
        scrubTip.style.display = 'block';
        taskLabel.textContent = active[0].name + (active.length > 1 ? ' (+' + (active.length-1) + ')' : '');
      } else {
        scrubTip.style.display = 'none';
        taskLabel.textContent = tidx >= 0 ? scheduleData[tidx].name : '';
      }

      if (!_scrubActive) {
        _scrubActive = true;
        // Send 4D_PLAY with full task list — viewer enters glass mode
        _bim4d.postMessage({ type: '4D_PLAY', tasks: scheduleData, speed: 1.0 });
        console.log('§4D_SCRUB_START tasks=' + scheduleData.length);
        // Small delay to let glass apply before first seek
        setTimeout(function() {
          if (tidx >= 0) _bim4d.postMessage({ type: '4D_SEEK', taskIndex: tidx });
        }, 100);
        return;
      }

      if (tidx >= 0) {
        _bim4d.postMessage({ type: '4D_SEEK', taskIndex: tidx });
      }
    }

    // Mouse/touch drag — works on both the canvas and the wide drag handle
    // Only active after Play has been clicked at least once (avoids GPU waste on idle page)
    let _dragging = false;
    let _playActivated = false;  // true after first Play click

    function startDrag(evt) {
      if (!_playActivated) return;  // scrub line off until Play clicked
      _dragging = true;
      const rect = ganttCanvas.getBoundingClientRect();
      const px = (evt.clientX || (evt.touches && evt.touches[0].clientX) || 0) - rect.left;
      applyScrub(pixelToDay(px));
    }
    function moveDrag(evt) {
      if (!_dragging) return;
      evt.preventDefault();
      const rect = ganttCanvas.getBoundingClientRect();
      const px = (evt.clientX || (evt.touches && evt.touches[0].clientX) || 0) - rect.left;
      applyScrub(pixelToDay(px));
    }
    function endDrag() { _dragging = false; }

    // Canvas drag
    ganttCanvas.addEventListener('pointerdown', startDrag);
    ganttCanvas.addEventListener('pointermove', moveDrag);
    ganttCanvas.addEventListener('pointerup', endDrag);
    ganttCanvas.addEventListener('pointerleave', endDrag);
    // Handle drag (the wide invisible bar)
    scrubHandle.addEventListener('pointerdown', function(evt) {
      evt.stopPropagation();
      _dragging = true;
    });
    document.addEventListener('pointermove', moveDrag);
    document.addEventListener('pointerup', endDrag);

    // Play button
    playBtn.addEventListener('pointerup', function() {
      if (_playing) {
        clearInterval(_playTimer); _playTimer = null;
        _playing = false;
        playBtn.textContent = '\u25b6 Play';
        _bim4d.postMessage({ type: '4D_PAUSE' });
        return;
      }

      _playing = true;
      _playActivated = true;
      ganttCanvas.style.cursor = 'ew-resize';
      playBtn.textContent = '\u23f8 Pause';
      stopBtn.style.display = '';
      if (!_scrubActive && _currentDay <= 0) _currentDay = 0;
      startPlayTimer();
    });

    // Stop button — resets scrub line, hides overlay, returns to normal
    stopBtn.addEventListener('pointerup', function() {
      if (_playTimer) { clearInterval(_playTimer); _playTimer = null; }
      _playing = false;
      _playActivated = false;
      _currentDay = 0;
      playBtn.textContent = '\u25b6 Play';
      stopBtn.style.display = 'none';
      ganttCanvas.style.cursor = '';
      scrubLine.style.display = 'none';
      scrubHandle.style.display = 'none';
      scrubTip.style.display = 'none';
      dayLabel.textContent = 'Day 0 / ' + maxDay;
      taskLabel.textContent = '';
      if (_scrubActive) {
        _scrubActive = false;
        _bim4d.postMessage({ type: '4D_RESET' });
      }
      resPanel.style.display = 'none';
      console.log('§4D_STOP');
    });

    function startPlayTimer() {
      if (_playTimer) clearInterval(_playTimer);
      const speed = parseInt(speedSel.value) || 1;
      const step = Math.max(1, Math.round(maxDay / Math.max(scheduleData.length, 1)));
      _playTimer = setInterval(function() {
        _currentDay += step * speed;
        if (_currentDay > maxDay) {
          _currentDay = maxDay;
          clearInterval(_playTimer); _playTimer = null;
          _playing = false;
          playBtn.textContent = '\u25b6 Play';
        }
        applyScrub(_currentDay);
      }, 800);
      console.log('§4D_PLAY_TIMER speed=' + speed + 'x step=' + step + ' interval=800ms');
    }

    // Speed change during playback restarts timer
    speedSel.addEventListener('change', function() {
      if (_playing) startPlayTimer();
    });

    console.log('§4D_CHANNEL_READY sender=boq_charts scrubber=true');
  }

  // ── S225: Variance Chart (when diff data present) ──
  if (diffResult) {
    const varBox = el('div','chart-box');
    varBox.innerHTML = '<h2>' + _TRL.t_vo_impact + '</h2>';
    const varCanvas = el('canvas');
    varBox.appendChild(varCanvas); c.appendChild(varBox);

    // Cost impact per category (using VO_CFG rates if available)
    var addCost = 0, remCost = 0, chgCost = 0;
    var OH = 0.10, MK = 0.05;
    function _vRate(vdb, guid) {
      try {
        var r = vdb.exec("SELECT ifc_class FROM elements_meta WHERE guid='" + guid.replace(/'/g, "''") + "'");
        var cls = r[0]?.values[0]?.[0] || '';
        var entry = RATES[cls];
        return (entry && entry.rate) ? entry.rate : 500;
      } catch(e) { return 500; }
    }
    diffResult.added.forEach(function(g)   { addCost += _vRate(diffDb, g); });
    diffResult.removed.forEach(function(g) { remCost += _vRate(db, g); });
    diffResult.changed.forEach(function(g) { chgCost += _vRate(diffDb, g) * 0.3; });

    chartInstances.push(new Chart(varCanvas, {
      type: 'bar',
      data: {
        labels: ['Added', 'Removed', 'Changed'],
        datasets: [
          { label: 'Elements', data: [diffResult.added.length, diffResult.removed.length, diffResult.changed.length],
            backgroundColor: ['#44cc44', '#cc4444', '#cccc44'], yAxisID: 'y' },
          { label: 'Cost Impact (' + CUR + ')', data: [Math.round(addCost), Math.round(remCost), Math.round(chgCost)],
            backgroundColor: ['rgba(68,204,68,0.3)', 'rgba(204,68,68,0.3)', 'rgba(204,204,68,0.3)'],
            borderColor: ['#44cc44', '#cc4444', '#cccc44'], borderWidth: 2, yAxisID: 'y1' }
        ]
      },
      options: {
        scales: {
          y:  { position: 'left', title: { display: true, text: 'Element Count', color: '#fff', font:{size:15} }, ticks: { color: '#ddd', font:{size:13} }, grid: { color: 'rgba(255,255,255,0.1)' } },
          y1: { position: 'right', title: { display: true, text: 'Cost (' + CUR + ')', color: '#fff', font:{size:15} }, ticks: { color: '#ddd', font:{size:13} }, grid: { drawOnChartArea: false } },
          x:  { ticks: { color: '#ddd', font:{size:13} }, grid: { color: 'rgba(255,255,255,0.1)' } }
        },
        plugins: { legend: { labels: { color: '#ddd', font:{size:13} } } }
      }
    }));
    logChart(10,'Bar','Variation Order Impact',3);
  }

  // ── 10. BOQ Data Table (enhanced with Equipment column) ──
  const tableBox = el('div','chart-box full');
  tableBox.innerHTML = '<h2>5D — Bill of Quantities (' + _TRL.rate_source + ')</h2>';
  let html = '<table><tr><th>Disc</th><th>IFC Class</th><th>Storey</th><th>Qty</th><th>Unit</th>' +
    '<th>Description</th><th>Rate (' + CUR + ')</th><th>Material (' + CUR + ')</th><th>Labour Days</th><th>Labour (' + CUR + ')</th>' +
    '<th>Equip (' + CUR + ')</th><th>Total (' + CUR + ')</th></tr>';
  for (const r of qtoData) {
    const rowTotal = r.matTotal + r.laborCost + r.equipCost;
    html += `<tr><td>${r.disc}</td><td>${r.cls}</td><td>${r.storey||''}</td><td>${r.qty.toLocaleString()}</td>` +
      `<td>${r.unit}</td><td>${r.desc}</td><td>${r.matRate.toLocaleString()}</td>` +
      `<td>${r.matTotal.toLocaleString()}</td><td>${r.laborDays.toFixed(1)}</td><td>${r.laborCost.toLocaleString()}</td>` +
      `<td>${r.equipCost.toLocaleString()}</td><td>${rowTotal.toLocaleString()}</td></tr>`;
  }
  const gt = grandMaterial + grandLabor + grandEquip;
  html += `<tr class="total-row"><td colspan="7">GRAND TOTAL</td>` +
    `<td>${CUR}${grandMaterial.toLocaleString()}</td><td></td><td>${CUR}${grandLabor.toLocaleString()}</td>` +
    `<td>${CUR}${grandEquip.toLocaleString()}</td><td>${CUR}${gt.toLocaleString()}</td></tr>`;
  html += '</table>';
  tableBox.innerHTML += html;
  c.appendChild(tableBox);

  // ── 10. Summary footer ──
  const projDays = scheduleData.length ? Math.max(...scheduleData.map(t=>t.finishDay)) : 0;
  const footBox = el('div','chart-box full');
  footBox.innerHTML = `<table>
    <tr><td>Building</td><td><b>${bldName}</b></td></tr>
    <tr><td>Total Elements</td><td><b>${totalQty.toLocaleString()}</b></td></tr>
    <tr><td>Material Cost</td><td><b>${CUR} ${grandMaterial.toLocaleString()}</b></td></tr>
    <tr><td>Labour Cost</td><td><b>${CUR} ${grandLabor.toLocaleString()}</b></td></tr>
    <tr><td>Equipment Cost</td><td><b>${CUR} ${grandEquip.toLocaleString()}</b></td></tr>
    <tr><td>Grand Total</td><td><b>${CUR} ${gt.toLocaleString()}</b></td></tr>
    <tr><td>Project Duration</td><td><b>${projDays} days (${scheduleData.length} tasks)</b></td></tr>
    <tr><td>Rates Source</td><td>${_TRL.rate_source}</td></tr>
    <tr><td>Exported</td><td>${new Date().toISOString()}</td></tr>
    <tr><td>Source</td><td>BIM OOTB — Frictionless BIM</td></tr>
  </table>`;
  c.appendChild(footBox);
  console.log(`§RENDER_CHARTS: done — ${chartInstances.length} charts rendered, all OK`);
}

function el(tag, cls) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}

// ============================================================================
// S225: Shared chart-to-Excel helpers
// Pie: canvas 800×800 → image must be W=H (square) → round circle
// Bar: canvas 1100×700 → image W:H = 11:7 to preserve ratio
// ============================================================================

// Log collector — all §-tagged lines go here, auto-downloaded as .log after each save
var _logLines = [];
function _log(msg) { _logLines.push(new Date().toISOString() + ' ' + msg); console.log(msg); }
function _downloadLog(label) {
  // Delay: browser blocks rapid successive <a>.click() downloads — let Excel go first
  var lines = _logLines.slice();
  _logLines = [];
  setTimeout(function() {
    var text = lines.join('\n') + '\n';
    var blob = new Blob([text], { type: 'text/plain' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'chart_test_' + label + '_' + new Date().toISOString().slice(0,19).replace(/:/g,'-') + '.log';
    a.click();
    URL.revokeObjectURL(a.href);
  }, 1500);
}

// S235: Chart images removed from Excel — HTML charts are sufficient.
// prepare/restore/capture functions retired. Only verify + log remain.
var _chartTestPass = 0, _chartTestFail = 0;
function _ct(pass, ci, name, test, detail) {
  var tag = pass ? 'PASS' : 'FAIL';
  if (pass) _chartTestPass++; else _chartTestFail++;
  _log('[S226] §CHART_TEST ' + tag + ' chart=' + ci + ' "' + name + '" ' + test + ' — ' + detail);
}

// ── _TRL verification: proves localization is active, no hardcoded RM/USD ──
function _verifyTRL(wb, label) {
  _log('[S226] §TRL_VERIFY start — ' + label);

  // 1. _TRL object completeness — every key must have a non-empty string value
  var missing = [];
  for (var k in _TRL_DEFAULTS) {
    if (typeof _TRL[k] === 'string' && _TRL[k].trim() === '') missing.push(k);
    if (_TRL[k] === undefined || _TRL[k] === null) missing.push(k);
  }
  _ct(missing.length === 0, -1, label, 'TRL_COMPLETE',
    missing.length === 0 ? Object.keys(_TRL_DEFAULTS).length + ' keys all populated' : 'empty keys: ' + missing.join(', '));

  // 2. Currency symbols active
  _ct(CUR === _TRL.cur, -1, label, 'TRL_CUR_MATCH', 'CUR=' + CUR + ' _TRL.cur=' + _TRL.cur);
  _ct(CUR2 === _TRL.cur2, -1, label, 'TRL_CUR2_MATCH', 'CUR2=' + CUR2 + ' _TRL.cur2=' + _TRL.cur2);
  _ct(typeof CUR_RATE === 'number' && CUR_RATE > 0, -1, label, 'TRL_RATE_VALID', 'CUR_RATE=' + CUR_RATE);

  // 3. Excel sheet names — must match _TRL values, no hardcoded English
  if (wb) {
    var sheetNames = wb.worksheets.map(function(ws) { return ws.name; });
    var trlSheets = label === '5D' ? [_TRL.s_cover, _TRL.s_exec_summary, _TRL.s_material, _TRL.s_labour, _TRL.s_equipment]
      : [_TRL.s_schedule, _TRL.s_proj_summary, _TRL.s_dashboard];
    var sheetHits = 0;
    for (var i = 0; i < trlSheets.length; i++) {
      if (sheetNames.indexOf(trlSheets[i]) >= 0) sheetHits++;
    }
    _ct(sheetHits === trlSheets.length, -1, label, 'TRL_SHEET_NAMES',
      sheetHits + '/' + trlSheets.length + ' _TRL sheets found in [' + sheetNames.join(', ') + ']');

    // 4. Scan first 5 rows of each sheet for hardcoded 'RM ' or ' USD ' (should be CUR/CUR2)
    var hardcoded = [];
    var bannedRe = /\bRM\s|\sRM\b|\bUSD\s|\sUSD\b/;
    // Only flag if CUR is not RM and CUR2 is not USD (i.e. localization changed them)
    // If defaults are active, RM/USD are expected — so test the ABSENCE of wrong currency
    wb.worksheets.forEach(function(ws) {
      ws.eachRow({ includeEmpty: false }, function(row, rn) {
        if (rn > 5) return;
        row.eachCell(function(cell) {
          var v = String(cell.value || '');
          // Check currency symbol appears correctly
          if (v.indexOf('(' + CUR + ')') >= 0 || v.indexOf(CUR + ' ') >= 0) return; // OK
          if (CUR !== 'RM' && bannedRe.test(v)) hardcoded.push(ws.name + ':R' + rn + '="' + v.slice(0, 40) + '"');
        });
      });
    });
    _ct(hardcoded.length === 0, -1, label, 'TRL_NO_HARDCODE',
      hardcoded.length === 0 ? 'no hardcoded RM/USD in headers (CUR=' + CUR + ')' : hardcoded.join('; '));
  }

  // 5. HTML chart titles — verify they use _TRL values
  var h2s = document.querySelectorAll('.chart-box h2');
  var trlTitles = [_TRL.t_cost_by_disc, _TRL.t_cost_components, _TRL.t_task_dist_phase,
    _TRL.t_task_count_disc, _TRL.t_phase_duration, _TRL.t_resource_workload,
    _TRL.t_s_curve, _TRL.t_milestone, _TRL.t_gantt];
  var titleHits = 0;
  for (var ti = 0; ti < h2s.length; ti++) {
    var txt = h2s[ti].textContent;
    for (var tj = 0; tj < trlTitles.length; tj++) {
      if (txt.indexOf(trlTitles[tj]) >= 0) { titleHits++; break; }
    }
  }
  _ct(titleHits >= Math.min(h2s.length, trlTitles.length), -1, label, 'TRL_CHART_TITLES',
    titleHits + '/' + h2s.length + ' HTML chart titles match _TRL values');

  // 6. HTML table headers — verify CUR symbol appears, not hardcoded RM
  var ths = document.querySelectorAll('table th');
  var curInHeaders = 0;
  for (var hi = 0; hi < ths.length; hi++) {
    if (ths[hi].textContent.indexOf(CUR) >= 0) curInHeaders++;
  }
  _ct(curInHeaders > 0, -1, label, 'TRL_HTML_CUR',
    curInHeaders + ' table headers contain CUR="' + CUR + '"');

  // 7. Rate source attribution
  var fullTables = document.querySelectorAll('.chart-box.full');
  var footerText = ''; for (var ft = 0; ft < fullTables.length; ft++) footerText += fullTables[ft].textContent;
  _ct(footerText.indexOf(_TRL.rate_source) >= 0, -1, label, 'TRL_RATE_SOURCE',
    'footer contains "' + _TRL.rate_source + '": ' + (footerText.indexOf(_TRL.rate_source) >= 0));

  _log('[S226] §TRL_VERIFY done — ' + label);
}

// ── Maths verification: proves numeric outputs are correct ──
function _verifyMaths(wb, label) {
  _log('[S226] §MATHS_VERIFY start — ' + label);

  // 1. Grand totals cross-check: sum of disc totals must equal grand totals
  var sumMat = 0, sumLab = 0, sumEq = 0;
  for (var d in discSummary) {
    sumMat += discSummary[d].matTotal;
    sumLab += discSummary[d].laborCost;
    sumEq  += discSummary[d].equipCost;
  }
  _ct(sumMat === grandMaterial, -1, label, 'MATHS_MAT_SUM',
    'disc_sum=' + sumMat + ' grand=' + grandMaterial + (sumMat !== grandMaterial ? ' MISMATCH' : ''));
  _ct(sumLab === grandLabor, -1, label, 'MATHS_LAB_SUM',
    'disc_sum=' + sumLab + ' grand=' + grandLabor + (sumLab !== grandLabor ? ' MISMATCH' : ''));
  _ct(sumEq === grandEquip, -1, label, 'MATHS_EQ_SUM',
    'disc_sum=' + sumEq + ' grand=' + grandEquip + (sumEq !== grandEquip ? ' MISMATCH' : ''));

  // 2. Grand total = mat + lab + eq
  var gt = grandMaterial + grandLabor + grandEquip;
  _ct(gt === grandMaterial + grandLabor + grandEquip, -1, label, 'MATHS_GRAND',
    CUR + ' ' + gt.toLocaleString() + ' = Mat ' + grandMaterial.toLocaleString() + ' + Lab ' + grandLabor.toLocaleString() + ' + Eq ' + grandEquip.toLocaleString());

  // 3. Currency conversion sample: first disc total → secondary currency
  var firstDisc = Object.keys(discSummary)[0];
  if (firstDisc) {
    var ds = discSummary[firstDisc];
    var discTotal = ds.matTotal + ds.laborCost + ds.equipCost;
    var converted = fmtCur2(discTotal);
    var expected = Math.round(discTotal / CUR_RATE * 100) / 100;
    _ct(converted === expected, -1, label, 'MATHS_CUR_CONV',
      firstDisc + ': ' + CUR + ' ' + discTotal.toLocaleString() + ' ÷ ' + CUR_RATE + ' = ' + CUR2 + ' ' + converted + ' (expected ' + expected + ')');
  }

  // 4. QTO row count vs total elements
  var qtoSum = 0;
  for (var i = 0; i < qtoData.length; i++) qtoSum += qtoData[i].qty;
  _ct(qtoSum === totalQty, -1, label, 'MATHS_QTY_SUM',
    'qto_rows=' + qtoData.length + ' qty_sum=' + qtoSum + ' totalQty=' + totalQty + (qtoSum !== totalQty ? ' MISMATCH' : ''));

  // 5. Rate spot-check: first 3 QTO rows — rate × qty = matTotal
  for (var ri = 0; ri < Math.min(3, qtoData.length); ri++) {
    var r = qtoData[ri];
    var calc = Math.round(r.matRate * r.qty * 100) / 100;
    _ct(Math.abs(calc - r.matTotal) < 0.02, -1, label, 'MATHS_RATE_CHECK',
      r.cls + ': rate=' + r.matRate + ' × qty=' + (Math.round(r.qty*100)/100) + ' = ' + calc + ' (stored=' + r.matTotal + ')' + (Math.abs(calc - r.matTotal) >= 0.02 ? ' MISMATCH' : ''));
  }

  // 6. Excel sheet count
  if (wb) {
    var sc = wb.worksheets.length;
    var minSheets = label === '5D' ? 6 : 3;
    _ct(sc >= minSheets, -1, label, 'MATHS_SHEET_COUNT',
      sc + ' sheets in workbook (min ' + minSheets + ' expected for ' + label + ')');
  }

  // 7. Pie chart data sum = grand total (chart[0] is cost pie)
  if (chartInstances.length > 0 && chartInstances[0].config.type === 'pie') {
    var pieData = chartInstances[0].data.datasets[0].data;
    var pieSum = 0;
    for (var pi = 0; pi < pieData.length; pi++) pieSum += pieData[pi];
    _ct(pieSum === gt, -1, label, 'MATHS_PIE_SUM',

      const P = { IfcFooting:'Substructure', IfcPile:'Substructure', IfcColumn:'Superstructure', IfcBeam:'Superstructure', IfcSlab:'Superstructure',
        IfcWall:'Architecture', IfcWallStandardCase:'Architecture', IfcDoor:'Architecture', IfcWindow:'Architecture', IfcRoof:'Architecture',
        IfcDuct:'MEP Rough-in', IfcPipe:'MEP Rough-in', IfcCableCarrier:'MEP Rough-in', IfcLightFixture:'MEP Final', IfcOutlet:'MEP Final',
        IfcCovering:'Finishes', IfcFurniture:'Finishes' };
      return P[cls] || 'Architecture';
    }
    function voProd(cls) {
      const P = { IfcColumn:6, IfcBeam:8, IfcSlab:35, IfcWall:12, IfcDoor:5, IfcWindow:5, IfcDuct:18, IfcPipe:25, IfcLightFixture:20 };
      return P[cls] || 10;
    }
    function voInfo(dbRef, guid) {
      try { var r = dbRef.exec("SELECT ifc_class, element_name, storey, discipline, material_rgba FROM elements_meta WHERE guid='" + guid.replace(/'/g,"''") + "'"); return r.length ? r[0].values[0] : [null,null,null,null,null]; } catch(e) { return [null,null,null,null,null]; }
    }

    // VO Detail sheet
    const wsVO = wb.addWorksheet('Variation Order');
    wsVO.columns = [
      { header: 'Status', key: 's', width: 10 }, { header: 'GUID', key: 'g', width: 36 },
      { header: 'IFC Class', key: 'c', width: 20 }, { header: 'Name', key: 'n', width: 24 },
      { header: 'Storey', key: 'st', width: 16 }, { header: 'Discipline', key: 'd', width: 10 },
      { header: 'Phase (4D)', key: 'p', width: 14 }, { header: 'Unit Rate (' + CUR + ')', key: 'r', width: 12 },
      { header: 'Factor', key: 'f', width: 8 }, { header: 'Direct Cost', key: 'dc', width: 12 },
      { header: 'Total Impact', key: 'ti', width: 12 }, { header: 'Days', key: 'dy', width: 8 }
    ];
    styleHeader(wsVO, 1, 'FF4FC3F7');

    var voTotalDirect = 0, voTotalImpact = 0, voTotalDays = 0;
    var voAddCost = 0, voRemCost = 0, voChgCost = 0;
    function voRow(status, dbRef, guid, factor) {
      var info = voInfo(dbRef, guid);
      var cls = info[0] || 'Unknown';
      var rate = voRate(cls), direct = rate * factor;
      var total = direct * (1 + VO_CFG.overheadPct + VO_CFG.markupPct) * (1 + VO_CFG.disruptionPct);
      var days = 1 / voProd(cls);
      voTotalDirect += direct; voTotalImpact += total; voTotalDays += days;
      if (status === 'ADDED') voAddCost += total;
      else if (status === 'REMOVED') voRemCost += total;
      else voChgCost += total;
      wsVO.addRow({ s: status, g: guid, c: cls, n: info[1], st: info[2], d: info[3], p: voPhase(cls), r: rate, f: factor, dc: Math.round(direct), ti: Math.round(total), dy: +days.toFixed(2) });
    }
    diffResult.added.forEach(g => voRow('ADDED', diffDb, g, VO_CFG.addFactor));
    diffResult.removed.forEach(g => voRow('REMOVED', db, g, VO_CFG.removeFactor));
    diffResult.changed.forEach(g => voRow('CHANGED', diffDb, g, VO_CFG.changeFactor));
    // Color-code
    wsVO.eachRow((row, idx) => {
      if (idx === 1) return;
      var s = row.getCell(1).value;
      if (s === 'ADDED') row.getCell(1).font = { color: { argb: 'FF44CC44' }, bold: true };
      else if (s === 'REMOVED') row.getCell(1).font = { color: { argb: 'FFCC4444' }, bold: true };
      else if (s === 'CHANGED') row.getCell(1).font = { color: { argb: 'FFCCCC44' }, bold: true };
    });

    // VO Summary sheet
    const wsVOS = wb.addWorksheet('Variance Summary');
    wsVOS.columns = [{ header: 'Metric', key: 'm', width: 32 }, { header: 'Value', key: 'v', width: 22 }, { header: 'Notes', key: 'n', width: 48 }];
    styleHeader(wsVOS, 1, 'FF4FC3F7');
    wsVOS.addRow({ m: 'Variation Order', v: bldName, n: 'Auto-generated — ' + new Date().toISOString().split('T')[0] });
    wsVOS.addRow({});
    wsVOS.addRow({ m: '── SCOPE ──' }); wsVOS.lastRow.font = { bold: true, color: { argb: 'FF4FC3F7' } };
    wsVOS.addRow({ m: 'Elements Added', v: diffResult.added.length, n: 'New in variation (green)' });
    wsVOS.addRow({ m: 'Elements Removed', v: diffResult.removed.length, n: 'Demolished (red)' });
    wsVOS.addRow({ m: 'Elements Changed', v: diffResult.changed.length, n: 'Modified properties (yellow)' });
    wsVOS.addRow({ m: 'Total Affected', v: diffResult.added.length + diffResult.removed.length + diffResult.changed.length });
    wsVOS.addRow({});
    wsVOS.addRow({ m: '── COST IMPACT (5D) ──', n: 'FIDIC Clause 12 + AACE' }); wsVOS.lastRow.font = { bold: true, color: { argb: 'FF4FC3F7' } };
    wsVOS.addRow({ m: 'Addition Cost', v: CUR + ' ' + Math.round(voAddCost).toLocaleString() });
    wsVOS.addRow({ m: 'Removal Cost', v: CUR + ' ' + Math.round(voRemCost).toLocaleString() });
    wsVOS.addRow({ m: 'Change Cost', v: CUR + ' ' + Math.round(voChgCost).toLocaleString() });
    wsVOS.addRow({ m: 'Net Direct', v: CUR + ' ' + Math.round(voTotalDirect).toLocaleString() });
    wsVOS.addRow({ m: 'Total Impact (O&P)', v: CUR + ' ' + Math.round(voTotalImpact).toLocaleString(), n: 'Direct × (1+10%OH+15%Markup) × (1+5%Disruption)' });
    wsVOS.addRow({});
    wsVOS.addRow({ m: '── SCHEDULE IMPACT (4D) ──' }); wsVOS.lastRow.font = { bold: true, color: { argb: 'FF4FC3F7' } };
    wsVOS.addRow({ m: 'Total Additional Days', v: voTotalDays.toFixed(1) + ' days' });

    console.log('[S224] §VO_IN_5D added=' + diffResult.added.length + ' removed=' + diffResult.removed.length + ' changed=' + diffResult.changed.length + ' impact=' + CUR + Math.round(voTotalImpact));
  }

  // ── Save ──
  const sheetCount = wb.worksheets.length;
  const filename = `BIM_OOTB_${bldName}_5D_BOQ_${new Date().toISOString().slice(0,10)}.xlsx`;
  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
  document.getElementById('status').textContent = (_TRL.ui_saved_excel || 'Saved {f} ({n} sheets)').replace('{f}', filename).replace('{n}', sheetCount) + (diffResult ? ' \u2014 ' + (_TRL.ui_vo_label || 'includes Variance Order') : '');

  _verifyMaths(wb, '5D');
  _verifyTRL(wb, '5D');
  _log('[S226] §CHART_SUMMARY 5D: ' + _chartTestPass + ' PASS, ' + _chartTestFail + ' FAIL');
  _downloadLog('5D');
  _chartTestPass = 0; _chartTestFail = 0;
}

// ============================================================================
// SAVE 4D SCHEDULE — ExcelJS: 3 sheets (matches schedule_export.py)
// ============================================================================
async function save4D() {
  if (_dbSourceLine) _log(_dbSourceLine);  // S238: re-emit DB source so it appears in every log
  document.getElementById('status').textContent = _TRL.ui_gen_4d || 'Generating 4D Excel...';
  const wb = new ExcelJS.Workbook();
  wb.creator = _TRL.source_app;
  const projDays = scheduleData.length ? Math.max(...scheduleData.map(t=>t.finishDay)) : 0;

  // ── Helper: style a header row (fill stops at last data column) ──
  function styleHeader(ws, rowNum, argb) {
    const row = ws.getRow(rowNum);
    const colCount = ws.columns ? ws.columns.length : row.cellCount;
    for (let c = 1; c <= colCount; c++) {
      const cell = row.getCell(c);
      cell.font = { bold: true, color: { argb: 'FFFFFFFF' } };
      cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: argb || 'FF4FC3F7' } };
      cell.alignment = { horizontal: 'center' };
    }
    row.commit();
  }

  // ── Sheet 1: Construction Schedule ──
  const wsSched = wb.addWorksheet(_TRL.s_schedule);
  wsSched.columns = [
    { width: 12 },{ width: 40 },{ width: 16 },{ width: 10 },{ width: 10 },{ width: 8 },{ width: 6 },
    { width: 10 },{ width: 12 },{ width: 6 },{ width: 12 },{ width: 12 },{ width: 16 },{ width: 8 },
    { width: 22 },{ width: 12 },{ width: 10 },
  ];
  const schedHeaders = [_TRL.h_wbs, _TRL.h_task_name, _TRL.h_phase, _TRL.h_discipline, _TRL.h_storey, _TRL.h_quantity, _TRL.h_uom,
    _TRL.h_productivity, _TRL.h_duration, _TRL.h_gangs, _TRL.h_start_date, _TRL.h_finish_date, _TRL.h_labor_resource, _TRL.h_crew_size, _TRL.h_equipment, _TRL.h_status, _TRL.h_pct_complete];
  wsSched.addRow(schedHeaders);
  styleHeader(wsSched, 1, 'FF2C3E50');
  for (const t of scheduleData) {
    wsSched.addRow([t.wbs,t.name,t.phase,t.discipline,t.storey,t.qty,t.uom,t.productivity,
      Math.round(t.duration*100)/100, t.crews||1, t.startDate, t.finishDate, t.resource, t.crew, t.equipment, _TRL.not_started, 0]);
  }

  // ── Sheet 2: Project Summary ──
  const wsSum = wb.addWorksheet(_TRL.s_proj_summary);
  wsSum.columns = [{ width: 25 }, { width: 20 }];
  const phaseCounts = {}, discCounts = {};
  for (const t of scheduleData) {
    phaseCounts[t.phase] = (phaseCounts[t.phase]||0) + 1;
    discCounts[t.discipline] = (discCounts[t.discipline]||0) + 1;
  }
  wsSum.addRow([bldName + ' Construction']);
  wsSum.getRow(1).font = { bold: true, size: 14 };
  wsSum.addRow([]);
  wsSum.addRow(['Database', DB_URL]);
  wsSum.addRow(['Total Tasks', scheduleData.length]);
  wsSum.addRow(['Project Start', scheduleData.length ? scheduleData[0].startDate : 'N/A']);
  wsSum.addRow(['Project Finish', scheduleData.length ? scheduleData[scheduleData.length-1].finishDate : 'N/A']);
  wsSum.addRow(['Total Duration', `${projDays} days`]);
  wsSum.addRow(['Generated', new Date().toISOString()]);
  wsSum.addRow([]);
  wsSum.addRow([_TRL.h_phase+' Summary', _TRL.h_task_count]);
  styleHeader(wsSum, wsSum.rowCount, 'FF4472C4');
  for (const [p,cnt] of Object.entries(phaseCounts).sort()) wsSum.addRow([p, cnt]);
  wsSum.addRow([]);
  wsSum.addRow([_TRL.h_discipline+' Summary', _TRL.h_task_count]);
  styleHeader(wsSum, wsSum.rowCount, 'FF70AD47');
  for (const [d,cnt] of Object.entries(discCounts).sort()) wsSum.addRow([d, cnt]);

  // ── Sheet 3: BIM 4D Dashboard ──
  const wsDash = wb.addWorksheet(_TRL.s_dashboard);
  wsDash.columns = [{ width: 35 },{ width: 14 },{ width: 12 },{ width: 12 }];

  wsDash.addRow([`${bldName} - BIM 4D Analytics Dashboard`]);
  wsDash.getRow(1).font = { bold: true, size: 14 };
  wsDash.addRow([]);

  wsDash.addRow([_TRL.t_phase_dur_analysis]);
  wsDash.getRow(wsDash.rowCount).font = { bold: true, size: 12 };
  wsDash.addRow([_TRL.h_phase, _TRL.h_total_days]);
  styleHeader(wsDash, wsDash.rowCount, 'FF4472C4');
  const phaseDur2 = {};
  for (const t of scheduleData) phaseDur2[t.phase] = (phaseDur2[t.phase]||0) + t.duration;
  for (const [p,d] of Object.entries(phaseDur2).sort((a,b)=>b[1]-a[1])) wsDash.addRow([p, Math.round(d*100)/100]);
  wsDash.addRow([]);

  wsDash.addRow([_TRL.t_resource_analysis]);
  wsDash.getRow(wsDash.rowCount).font = { bold: true, size: 12 };
  wsDash.addRow([_TRL.h_phase, _TRL.h_total_man_days]);
  styleHeader(wsDash, wsDash.rowCount, 'FF70AD47');
  const phaseMD2 = {};
  for (const t of scheduleData) phaseMD2[t.phase] = (phaseMD2[t.phase]||0) + t.duration * t.crew;
  for (const [p,md] of Object.entries(phaseMD2).sort((a,b)=>b[1]-a[1])) wsDash.addRow([p, Math.round(md*10)/10]);
  wsDash.addRow([]);

  wsDash.addRow([_TRL.t_s_curve_progress]);
  wsDash.getRow(wsDash.rowCount).font = { bold: true, size: 12 };
  wsDash.addRow([_TRL.h_week, _TRL.h_cumulative_pct]);
  styleHeader(wsDash, wsDash.rowCount, 'FFFFC000');
  if (scheduleData.length) {
    const maxD = Math.max(...scheduleData.map(t=>t.finishDay));
    const tw = Math.max(1, Math.ceil(maxD/7));
    const si = Math.max(1, Math.floor(tw/20));
    for (let w = 0; w <= tw; w += si) {
      const completed = scheduleData.filter(t => t.finishDay <= w*7).length;
      wsDash.addRow([`W${w}`, Math.round(completed/scheduleData.length*1000)/10]);
    }
    const lastRow = wsDash.getRow(wsDash.rowCount);
    if (lastRow.getCell(2).value < 100) wsDash.addRow([`W${tw}`, 100]);
  }
  wsDash.addRow([]);

  wsDash.addRow([_TRL.t_milestone_timeline]);
  wsDash.getRow(wsDash.rowCount).font = { bold: true, size: 12 };
  wsDash.addRow([_TRL.h_milestone, _TRL.h_day_offset, _TRL.h_date]);
  styleHeader(wsDash, wsDash.rowCount, 'FFED7D31');
  const pd2 = {};
  for (const t of scheduleData) {
    if (!pd2[t.phase]) pd2[t.phase] = {s:t.startDate,e:t.finishDate,sd:t.startDay,ed:t.finishDay};
    else {
      if (t.startDay < pd2[t.phase].sd) { pd2[t.phase].sd = t.startDay; pd2[t.phase].s = t.startDate; }
      if (t.finishDay > pd2[t.phase].ed) { pd2[t.phase].ed = t.finishDay; pd2[t.phase].e = t.finishDate; }
    }
  }
  wsDash.addRow(['Project Start', 0, scheduleData.length ? scheduleData[0].startDate : '']);
  for (const phase of Object.keys(pd2).sort()) {
    wsDash.addRow([`${phase} Start`, pd2[phase].sd, pd2[phase].s]);
    wsDash.addRow([`${phase} End`, pd2[phase].ed, pd2[phase].e]);
  }
  wsDash.addRow(['Project Finish', projDays, scheduleData.length ? scheduleData[scheduleData.length-1].finishDate : '']);
  wsDash.addRow([]);

  wsDash.addRow([_TRL.t_gantt_timeline]);
  wsDash.getRow(wsDash.rowCount).font = { bold: true, size: 12 };
  wsDash.addRow([_TRL.h_task, _TRL.h_phase, _TRL.h_start_date, _TRL.h_duration]);
  styleHeader(wsDash, wsDash.rowCount, 'FF5B9BD5');
  const top15x = [...scheduleData].sort((a,b)=>b.duration-a.duration).slice(0,15).sort((a,b)=>a.startDay-b.startDay);
  for (const t of top15x) wsDash.addRow([t.name.slice(0,35), t.phase, t.startDay, Math.round(t.duration*10)/10]);

  // ── Embed 4D chart images on the RIGHT side (col E = col 4), stacked vertically ──
  // Charts are in the HTML page — no need to embed in Excel

  // ── Save ──
  const filename = `BIM_OOTB_${bldName}_4D_Schedule_${new Date().toISOString().slice(0,10)}.xlsx`;
  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
  document.getElementById('status').textContent = (_TRL.ui_saved_excel || 'Saved {f} ({n} sheets)').replace('{f}', filename).replace('{n}', 3);
  _verifyMaths(wb, '4D');
  _verifyTRL(wb, '4D');
  _log('[S226] §CHART_SUMMARY 4D: ' + _chartTestPass + ' PASS, ' + _chartTestFail + ' FAIL');
  _downloadLog('4D');
  _chartTestPass = 0; _chartTestFail = 0;
}

let light = false;
// §3.1: Open MEP BOQ report in new tab — passes same DB + rates params
function openMepReport() {
  var p = new URLSearchParams(location.search);
  var mepUrl = 'mep_report.html?db=' + encodeURIComponent(p.get('db') || DB_URL);
  if (p.get('bld') || bldName) mepUrl += '&bld=' + encodeURIComponent(p.get('bld') || bldName);
  if (RATE_TEMPLATE_NAME) mepUrl += '&rates=' + encodeURIComponent(RATE_TEMPLATE_NAME);
  window.open(mepUrl, '_blank');
}

function toggleTheme() {
  light = !light;
  document.body.style.background = light ? '#f0f0f0' : '#1a1a2e';
  document.body.style.color = light ? '#222' : '#e0e0e0';
  document.querySelectorAll('h1,h2').forEach(e => e.style.color = light ? '#0077cc' : '#4fc3f7');
  document.querySelectorAll('th').forEach(e => {
    e.style.background = light ? 'rgba(0,119,204,0.1)' : 'rgba(79,195,247,0.15)';
    e.style.color = light ? '#0077cc' : '#4fc3f7';
  });
  document.querySelectorAll('.chart-box').forEach(e => {
    e.style.background = light ? 'rgba(0,0,0,0.03)' : 'rgba(255,255,255,0.05)';
    e.style.borderColor = light ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.08)';
  });
}
