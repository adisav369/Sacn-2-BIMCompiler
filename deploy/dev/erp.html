<!DOCTYPE html>
<!--
  erp.html — Spatial ERP OOTB — Standalone document swipe UI
  Implementing SpatialERP_POC.md §12b File 4 — Witness: W-SERP-P3
  No Three.js. No WebGL. Pure document handling with TikTok swipe UX.
  Copyright (c) 2025-2026 Redhuan D. Oon <red1org@gmail.com>
  SPDX-License-Identifier: MIT
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spatial ERP — Construction</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1e1e1e; color: #eee;
    font-family: system-ui, -apple-system, sans-serif;
    overflow: hidden; height: 100vh;
    display: flex; flex-direction: column;
  }
  #role-band {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    background: #1e1e1e;
  }
  #swipe-container {
    flex: 1; margin-top: 56px; margin-bottom: 40px;
    overflow: hidden;
  }
  #status-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(30,30,30,0.95); border-top: 1px solid #333;
    padding: 8px 16px; font-size: 12px; color: #888;
    text-align: center; z-index: 10;
  }
  #loading {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: #1e1e1e; z-index: 100;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #888; font-size: 14px;
  }
  #loading .spinner {
    width: 32px; height: 32px; border: 3px solid #333;
    border-top-color: #4fc3f7; border-radius: 50%;
    animation: spin 0.8s linear infinite; margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Swipe hint animation */
  .swipe-hint {
    position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%);
    color: #555; font-size: 11px; text-align: center;
    animation: fadeHint 4s ease-in-out;
    pointer-events: none;
  }
  @keyframes fadeHint { 0%,80% { opacity:1; } 100% { opacity:0; } }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div>Loading Spatial ERP&hellip;</div>
  <div id="load-status" style="margin-top:8px;font-size:11px;color:#555;"></div>
</div>

<div id="role-band"></div>
<div id="swipe-container"></div>
<div id="status-bar"></div>

<!-- sql.js WASM — local first, CDN fallback -->
<script>
(function () {
  'use strict';
  var statusEl = document.getElementById('load-status');
  function log(msg) {
    console.log('§ERP_HTML ' + msg);
    if (statusEl) statusEl.textContent = msg;
  }

  // ── 1. Load sql.js ─────────────────────────────────────────────
  function loadScript(url, cdn) {
    return new Promise(function (resolve) {
      var s = document.createElement('script');
      s.src = url;
      s.onload = resolve;
      s.onerror = function () {
        if (cdn) {
          log('CDN fallback for ' + url);
          var s2 = document.createElement('script');
          s2.src = cdn;
          s2.onload = resolve;
          s2.onerror = function () { resolve(); };
          document.head.appendChild(s2);
        } else { resolve(); }
      };
      document.head.appendChild(s);
    });
  }

  // ── 2. Load ERP modules ────────────────────────────────────────
  var MODULES = [
    'kernel_ops.js',
    'doc_engine.js',
    'category_loader.js',
    'handlers/construction.js',
    'role_band.js',
    'swipe.js',
    'erp_panel.js'
  ];

  async function boot() {
    log('Loading sql.js...');
    await loadScript('lib/sql-wasm.js',
      'https://cdn.jsdelivr.net/npm/rtree-sql.js@1.7.0/dist/sql-wasm.js');

    log('Loading ERP modules...');
    for (var i = 0; i < MODULES.length; i++) {
      await loadScript(MODULES[i]);
    }

    log('Initialising database...');
    var SQL;
    try {
      SQL = await initSqlJs({ locateFile: function (f) { return 'lib/' + f; } });
    } catch (e) {
      // CDN WASM fallback
      SQL = await initSqlJs({
        locateFile: function () {
          return 'https://cdn.jsdelivr.net/npm/rtree-sql.js@1.7.0/dist/sql-wasm.wasm';
        }
      });
    }

    // ── 3. Load .db — URL param or default seed ──────────────────
    var params = new URLSearchParams(window.location.search);
    var dbUrl = params.get('db');
    var db;

    if (dbUrl) {
      log('Fetching ' + dbUrl + '...');
      try {
        var resp = await fetch(dbUrl);
        var buf = await resp.arrayBuffer();
        db = new SQL.Database(new Uint8Array(buf));
        log('Database loaded from URL');
      } catch (e) {
        log('Fetch failed: ' + e.message + ' — using seed');
        db = new SQL.Database();
      }
    } else {
      db = new SQL.Database();
    }

    // ── 4. Ensure tables + seed data ─────────────────────────────
    if (typeof DocEngine !== 'undefined') DocEngine.ensureTables(db);

    // Ensure project_metadata table exists (needed for seed)
    try {
      db.run('CREATE TABLE IF NOT EXISTS project_metadata (key TEXT PRIMARY KEY, value TEXT)');
    } catch (ignore) {}

    // Check if seed data exists
    var hasContainers = db.exec('SELECT COUNT(*) FROM containers');
    var containerCount = (hasContainers.length && hasContainers[0].values.length)
      ? Number(hasContainers[0].values[0][0]) : 0;

    if (containerCount === 0) {
      log('Applying construction seed...');
      try {
        var seedResp = await fetch('construction_seed.sql');
        var seedSql = await seedResp.text();
        db.run(seedSql);
        log('Seed data applied');
      } catch (e) {
        log('Seed fetch failed: ' + e.message);
      }
    }

    console.log('§ERP_HTML db ready containers=' + containerCount);

    // ── 5. Init ERP Panel ────────────────────────────────────────
    if (typeof ERPPanel !== 'undefined') {
      ERPPanel.init(db);
    }

    // ── 6. Apply URL params: ?doc= focus, ?role= override ───────
    var docParam = params.get('doc');
    if (docParam) {
      console.log('§ERP_HTML url doc=' + docParam);
      // Role is handled by RoleBand.init reading ?role=
    }

    // Hide loading screen
    var loadingEl = document.getElementById('loading');
    if (loadingEl) loadingEl.style.display = 'none';

    // Show swipe hint (fades after 4s)
    var hint = document.createElement('div');
    hint.className = 'swipe-hint';
    hint.textContent = '\u2190 swipe \u2192 next doc \u00b7 \u2191 drill in \u00b7 \u2193 back';
    document.body.appendChild(hint);
    setTimeout(function () { if (hint.parentNode) hint.parentNode.removeChild(hint); }, 4500);

    console.log('§ERP_HTML boot complete');
  }

  boot().catch(function (e) {
    console.error('§ERP_HTML boot error: ' + e.message);
    var statusEl2 = document.getElementById('load-status');
    if (statusEl2) statusEl2.textContent = 'Error: ' + e.message;
  });
})();
</script>
</body>
</html>
