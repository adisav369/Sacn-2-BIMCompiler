<style>

  body { background: #1a1a2e; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; padding: 20px; }

<script>

// ============================================================================
// LABOR RATES (from boq_export.py — full trade/crew/rate_per_day)
// ============================================================================

  },
  ELECTRICIAN: {
    rate_per_day: 175, crew_size: 2, trade: 'Electrician (Skilled)',
    productivity: {IfcCableCarrier:30,IfcCableCarrierSegment:30,IfcLightFixture:20,IfcOutlet:25}
  },
  STEEL_ERECTOR: {
    rate_per_day: 195, crew_size: 4, trade: 'Steel Erector (Skilled)',
    productivity: {IfcBeam:8,IfcColumn:6}
  },
  CONCRETE_GANG: {
    rate_per_day: 145, crew_size: 6, trade: 'Concrete Gang (Mixed)',
    productivity: {IfcSlab:35}
  },
  MASON: {
    rate_per_day: 155, crew_size: 3, trade: 'Mason (Skilled) + Laborers',
    productivity: {IfcWall:12,IfcWallStandardCase:12}
  },
  LABORER: {
    rate_per_day: 95, crew_size: 1, trade: 'General Laborer',
    productivity: {}
  },
};

// ============================================================================
// EQUIPMENT RATES & ALLOCATION (from boq_export.py)
// ============================================================================
const EQUIPMENT_RATES = {
  MOBILE_CRANE_20T: {rate_per_day:1850, desc:'Mobile Crane 20 Tonne'},
  TOWER_CRANE: {rate_per_day:2200, desc:'Tower Crane'},
  CONCRETE_PUMP: {rate_per_day:950, desc:'Concrete Pump Truck'},
  SCISSOR_LIFT_8M: {rate_per_day:285, desc:'Scissor Lift 8m'},
  WELDING_MACHINE: {rate_per_day:65, desc:'Welding Machine 300A'},
  GENERATOR_5KVA: {rate_per_day:95, desc:'Generator 5KVA'},
};
const EQUIPMENT_ALLOCATION = {
  IfcBeam: {equipment:'MOBILE_CRANE_20T', duration_factor:0.5},
  IfcColumn: {equipment:'MOBILE_CRANE_20T', duration_factor:0.5},
  IfcSlab: {equipment:'CONCRETE_PUMP', duration_factor:0.3},
  IfcDuct: {equipment:'SCISSOR_LIFT_8M', duration_factor:0.4},
  IfcCableCarrier: {equipment:'SCISSOR_LIFT_8M', duration_factor:0.3},
};

// ============================================================================
// SEQUENCE RULES (from schedule_generator.py — for 4D schedule)
// ============================================================================
const SEQUENCE_RULES = {
  // Substructure
  IfcFooting:{phase:'Substructure',sequence:1,resource:'CONCRETE_GANG'},
  IfcReinforcingBar:{phase:'Substructure',sequence:1,resource:'CONCRETE_GANG'},
  // Superstructure
  IfcColumn:{phase:'Superstructure',sequence:2,resource:'STEEL_ERECTOR'},
  IfcBeam:{phase:'Superstructure',sequence:3,resource:'STEEL_ERECTOR'},
  IfcSlab:{phase:'Superstructure',sequence:4,resource:'CONCRETE_GANG'},
  IfcPlate:{phase:'Superstructure',sequence:4,resource:'STEEL_ERECTOR'},
  IfcMember:{phase:'Superstructure',sequence:3,resource:'STEEL_ERECTOR'},
  // MEP Rough-in (pipes, ducts, cable trays, flow segments/fittings)
  IfcDuct:{phase:'MEP Rough-in',sequence:5,resource:'HVAC_TECH'},
  IfcDuctSegment:{phase:'MEP Rough-in',sequence:5,resource:'HVAC_TECH'},
  IfcDuctFitting:{phase:'MEP Rough-in',sequence:5,resource:'HVAC_TECH'},
  IfcPipe:{phase:'MEP Rough-in',sequence:5,resource:'PLUMBER'},
  IfcPipeSegment:{phase:'MEP Rough-in',sequence:5,resource:'PLUMBER'},
  IfcPipeFitting:{phase:'MEP Rough-in',sequence:5,resource:'PLUMBER'},
  IfcCableCarrier:{phase:'MEP Rough-in',sequence:5,resource:'ELECTRICIAN'},
  IfcCableCarrierSegment:{phase:'MEP Rough-in',sequence:5,resource:'ELECTRICIAN'},
  IfcFlowSegment:{phase:'MEP Rough-in',sequence:5,resource:'PLUMBER'},
  IfcFlowFitting:{phase:'MEP Rough-in',sequence:5,resource:'PLUMBER'},
  IfcFlowController:{phase:'MEP Rough-in',sequence:5,resource:'ELECTRICIAN'},
  IfcFlowMovingDevice:{phase:'MEP Rough-in',sequence:5,resource:'HVAC_TECH'},
  IfcFlowStorageDevice:{phase:'MEP Rough-in',sequence:5,resource:'PLUMBER'},
  IfcFlowTreatmentDevice:{phase:'MEP Rough-in',sequence:5,resource:'PLUMBER'},
  IfcEnergyConversionDevice:{phase:'MEP Rough-in',sequence:5,resource:'HVAC_TECH'},
  // Architecture
  IfcWall:{phase:'Architecture',sequence:6,resource:'MASON'},
  IfcWallStandardCase:{phase:'Architecture',sequence:6,resource:'MASON'},
  IfcOpeningElement:{phase:'Architecture',sequence:6,resource:'MASON'},
  IfcBuildingElementPart:{phase:'Architecture',sequence:6,resource:'MASON'},
  IfcDoor:{phase:'Architecture',sequence:7,resource:'CARPENTER'},
  IfcWindow:{phase:'Architecture',sequence:7,resource:'CARPENTER'},
  IfcStair:{phase:'Architecture',sequence:7,resource:'CARPENTER'},
  IfcStairFlight:{phase:'Architecture',sequence:7,resource:'CARPENTER'},
  IfcRailing:{phase:'Architecture',sequence:7,resource:'CARPENTER'},
  IfcRoof:{phase:'Architecture',sequence:8,resource:'ROOFER'},
  IfcBuildingElementProxy:{phase:'Architecture',sequence:6,resource:null},
  IfcCurtainWall:{phase:'Architecture',sequence:7,resource:'CARPENTER'},
  // MEP Final
  IfcLightFixture:{phase:'MEP Final',sequence:9,resource:'ELECTRICIAN'},
  IfcOutlet:{phase:'MEP Final',sequence:9,resource:'ELECTRICIAN'},
  IfcElectricAppliance:{phase:'MEP Final',sequence:9,resource:'ELECTRICIAN'},
  IfcFlowTerminal:{phase:'MEP Final',sequence:9,resource:'HVAC_TECH'},
  // Finishes
  IfcCovering:{phase:'Finishes',sequence:10,resource:'FINISHER'},
  IfcFurniture:{phase:'Finishes',sequence:11,resource:'FINISHER'},
  IfcFurnishingElement:{phase:'Finishes',sequence:11,resource:'FINISHER'},
};
const DEFAULT_RULE = {phase:'Architecture',sequence:6,resource:null};

const DISC_COLORS = {
  ARC:'#4488ff',STR:'#44cccc',MEP:'#44cc44',ELEC:'#cccc44',FP:'#cc8844',
  ACMV:'#cc4444',PLB:'#8844cc',HVAC:'#44aacc',SAN:'#aa44aa',VENT:'#88ccaa',
};
const PHASE_COLORS = {
  'Substructure':'#A5A5A5','Superstructure':'#4472C4','MEP Rough-in':'#70AD47',
  'Architecture':'#ED7D31','MEP Final':'#5B9BD5','Finishes':'#FFC000',
  'Commissioning':'#C55A11','Unknown':'#888888',
};

// ============================================================================
// COMPUTED STATE
// ============================================================================
let db = null, bldName = '';
let qtoData = [];        // per storey/disc/class rows
let discSummary = {};     // disc -> {qty, matTotal, laborCost, equipCost}
let grandMaterial = 0, grandLabor = 0, grandEquip = 0, totalQty = 0;
let scheduleData = [];    // generated 4D tasks
let chartInstances = [];

// ============================================================================
// LABOR / EQUIPMENT CALCULATION (matches boq_export.py exactly)
// ============================================================================
function calcLabor(ifcClass, qty) {
  for (const [key, lr] of Object.entries(LABOR_RATES)) {
    if (lr.productivity && lr.productivity[ifcClass] !== undefined) {
      const prod = lr.productivity[ifcClass];
      const days = qty / prod;
      const cost = days * lr.crew_size * lr.rate_per_day;
      return {cost: Math.round(cost), days, crew: lr.crew_size, trade: lr.trade, tradeKey: key, prod};
    }
  }
  return {cost: 0, days: 0, crew: 0, trade: '', tradeKey: null, prod: 10};
}

function calcEquipment(ifcClass, laborDays) {
  const alloc = EQUIPMENT_ALLOCATION[ifcClass];
  if (!alloc) return {cost: 0, desc: '', days: 0};
  const er = EQUIPMENT_RATES[alloc.equipment];
  const days = laborDays * alloc.duration_factor;
  return {cost: Math.round(days * er.rate_per_day), desc: er.desc, days};
}

// ============================================================================
// SCHEDULE GENERATION — realistic storey-by-storey, phase-dependent
// ============================================================================
// Model:
//  - Storeys processed bottom-up within each phase
//  - Tasks in same phase+storey run concurrently (different trades)
//  - Next storey starts after previous storey (small overlap lag)
//  - Next phase on a storey starts after previous phase on THAT storey finishes + lag
//  - Single-task duration capped at ~20 days; parallel crews added beyond that
//  - Working days: Mon-Sat (JS getDay: 1-6)

function generateSchedule(activities, startDateStr) {
  const projectStart = new Date(startDateStr || '2025-01-06');

  // Mon-Sat working (JS getDay: 0=Sun, 1=Mon ... 6=Sat)
  const isWorkDay = d => { const w = d.getDay(); return w >= 1 && w <= 6; };

  // Advance by N working days from a date
  function addWorkDays(from, n) {
    const d = new Date(from);
    let rem = Math.ceil(n);
    while (rem > 0) { d.setDate(d.getDate() + 1); if (isWorkDay(d)) rem--; }
    return d;
  }

  // Storey sort: basements < ground < levels < roof
  function storeyRank(s) {
    if (!s) return 999;
    const u = s.toUpperCase();
    if (u.includes('ROOF')) return 900;
    if (u.includes('BASEMENT') || u.startsWith('B')) return -10 + (parseInt(u.replace(/\D/g,''))||0);
    if (u === 'GROUND' || u === 'G' || u === 'G0' || u === 'GF') return 0;
    const n = parseInt(u.replace(/\D/g,''));
    return isNaN(n) ? 50 : n;
  }

  const PHASE_ORDER = ['Substructure','Superstructure','MEP Rough-in','Architecture','MEP Final','Finishes'];
  const INTER_PHASE_LAG = 5;   // working days between phases on same storey
  const INTER_STOREY_LAG = 2;  // working days between storeys in same phase
  const MAX_TASK_DAYS = 20;    // cap before adding parallel crews

  // Group activities by phase -> storey
  const grouped = {};  // phase|||storey -> [act, ...]
  const phaseSets = {};
  for (const act of activities) {
    const rules = SEQUENCE_RULES[act.cls] || DEFAULT_RULE;
    const phase = rules.phase;
    const storey = act.storey || 'Unknown';
    const key = `${phase}|||${storey}`;
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push({...act, phase, rules});
    if (!phaseSets[phase]) phaseSets[phase] = new Set();
    phaseSets[phase].add(storey);
  }

  // Sort storeys per phase
  for (const p of Object.keys(phaseSets)) {
    phaseSets[p] = [...phaseSets[p]].sort((a,b) => storeyRank(a) - storeyRank(b));
  }

  // storeyPhaseEnd[storey][phase] = finish date
  const storeyPhaseEnd = {};
  const phaseFirstStart = {}; // phase -> date when first storey of this phase finishes
  const tasks = [];
  let taskId = 0;

  for (const phase of PHASE_ORDER) {
    if (!phaseSets[phase]) continue;
    let prevStoreyEnd = null;

    for (const storey of phaseSets[phase]) {
      const key = `${phase}|||${storey}`;
      const acts = grouped[key];
      if (!acts) continue;

      // Start date: wait for (a) latest earlier phase on this storey, (b) previous storey in this phase
      let storeyStart = new Date(projectStart);

      // Walk back through ALL earlier phases to find the latest one with data for this storey
      const phaseIdx = PHASE_ORDER.indexOf(phase);
      if (phaseIdx > 0 && storeyPhaseEnd[storey]) {
        for (let pi = phaseIdx - 1; pi >= 0; pi--) {
          const earlierPhase = PHASE_ORDER[pi];
          if (storeyPhaseEnd[storey][earlierPhase]) {
            const after = addWorkDays(storeyPhaseEnd[storey][earlierPhase], INTER_PHASE_LAG);
            if (after > storeyStart) storeyStart = after;
            break;
          }
        }
      }
      // Also wait for ANY earlier phase globally (prevents phases from starting before predecessors)
      if (phaseIdx > 0) {
        for (let pi = phaseIdx - 1; pi >= 0; pi--) {
          if (phaseFirstStart[PHASE_ORDER[pi]]) {
            const after = addWorkDays(phaseFirstStart[PHASE_ORDER[pi]], INTER_PHASE_LAG);
            if (after > storeyStart) storeyStart = after;
            break;
          }
        }
      }
      if (prevStoreyEnd) {
        const after = addWorkDays(prevStoreyEnd, INTER_STOREY_LAG);
        if (after > storeyStart) storeyStart = after;
      }

      // Tasks in same phase+storey run concurrently — find longest
      let maxFinish = storeyStart;

      for (const act of acts) {
        const prod = act.labor.prod || 10;
        let duration = Math.max(1, act.qty / prod);
        let crews = 1;
        if (duration > MAX_TASK_DAYS) {
          crews = Math.ceil(duration / MAX_TASK_DAYS);
          duration = Math.ceil(duration / crews);
        }

        const taskFinish = addWorkDays(storeyStart, duration);
        if (taskFinish > maxFinish) maxFinish = taskFinish;

        const equipAlloc = EQUIPMENT_ALLOCATION[act.cls];
        taskId++;
        tasks.push({
          id: taskId,
          wbs: `1.${act.rules.sequence}.${taskId}`,
          name: `${storey} - Install ${act.cls.replace('Ifc','')} (${act.disc})`,
          phase,
          discipline: act.disc,
          storey,
          qty: act.qty,
          uom: act.unit || 'EA',
          productivity: prod,
          duration,
          crews,
          startDate: storeyStart.toISOString().slice(0,10),
          finishDate: taskFinish.toISOString().slice(0,10),
          resource: act.labor.tradeKey || act.rules.resource || '',
          crew: (act.labor.crew || 2) * crews,
          equipment: equipAlloc ? EQUIPMENT_RATES[equipAlloc.equipment].desc : '',
          startDay: Math.round((storeyStart - projectStart) / 86400000),
          finishDay: Math.round((taskFinish - projectStart) / 86400000),
        });
      }

      if (!storeyPhaseEnd[storey]) storeyPhaseEnd[storey] = {};
      storeyPhaseEnd[storey][phase] = maxFinish;
      if (!phaseFirstStart[phase]) phaseFirstStart[phase] = maxFinish;
      prevStoreyEnd = maxFinish;
    }
  }
  return tasks;
}

// ============================================================================
// INIT — load DB, compute everything
// ============================================================================
async function init() {
  const SQL = await initSqlJs({
    locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}`
  });
  document.getElementById('info').textContent = `Loading ${DB_URL}...`;
  const buf = await fetch(DB_URL).then(r => r.arrayBuffer());
  db = new SQL.Database(new Uint8Array(buf));

  // Determine building
  bldName = BLD;
  if (!bldName) {
    const r = db.exec("SELECT building, COUNT(*) c FROM elements_meta GROUP BY building ORDER BY c DESC LIMIT 1");
    bldName = r.length ? r[0].values[0][0] : 'Unknown';
  }

  // Query QTO grouped by discipline, ifc_class, storey
  const rows = db.exec(`
    SELECT m.discipline, m.ifc_class, m.storey, COUNT(*) as qty,
           COUNT(DISTINCT i.geometry_hash) as meshes
    FROM elements_meta m LEFT JOIN element_instances i ON m.guid = i.guid
    WHERE m.building = '${bldName.replace(/'/g,"''")}'
    GROUP BY m.discipline, m.ifc_class, m.storey
    ORDER BY m.discipline, m.storey, qty DESC
  `);

  if (!rows.length) { document.getElementById('info').textContent = 'No data.'; return; }

  // Process data with full M/L/E calculation
  qtoData = []; discSummary = {};
  grandMaterial = 0; grandLabor = 0; grandEquip = 0; totalQty = 0;

  for (const row of rows[0].values) {
    const [disc, cls, storey, qty, meshes] = row;
    const mc = RATES[cls];
    const matRate = mc ? mc.rate : 0;
    const matTotal = Math.round(matRate * qty);
    const labor = calcLabor(cls, qty);
    const equip = calcEquipment(cls, labor.days);

    grandMaterial += matTotal;
    grandLabor += labor.cost;
    grandEquip += equip.cost;
    totalQty += qty;

    const r = {
      disc, cls, storey, qty, meshes, matRate, matTotal,
      laborDays: labor.days, laborCost: labor.cost, laborCrew: labor.crew, laborTrade: labor.trade,
      equipCost: equip.cost, equipDesc: equip.desc, equipDays: equip.days,
      desc: mc ? mc.desc : cls, unit: mc ? mc.unit : 'EA',
      labor, // keep full object for schedule
    };
    qtoData.push(r);

    if (!discSummary[disc]) discSummary[disc] = {qty:0, matTotal:0, laborCost:0, equipCost:0};
    discSummary[disc].qty += qty;
    discSummary[disc].matTotal += matTotal;
    discSummary[disc].laborCost += labor.cost;
    discSummary[disc].equipCost += equip.cost;
  }

  // Generate 4D schedule
  scheduleData = generateSchedule(qtoData, '2025-01-06');

  const grandTotal = grandMaterial + grandLabor + grandEquip;
  document.getElementById('info').textContent =
    `${bldName} | ${totalQty.toLocaleString()} elements | RM ${grandTotal.toLocaleString()} (Mat ${grandMaterial.toLocaleString()} + Lab ${grandLabor.toLocaleString()} + Equip ${grandEquip.toLocaleString()})`;

  renderCharts();
}

// ============================================================================
// RENDER ALL CHARTS (4 existing enhanced + 5 new from schedule_export.py)
// ============================================================================
function renderCharts() {
  const c = document.getElementById('charts');
  c.innerHTML = '';
  chartInstances.forEach(ci => ci.destroy());
  chartInstances = [];

  const discs = Object.keys(discSummary);

  // ── 1. Cost Pie by Discipline (M+L+E) ──
  const pieBox = el('div','chart-box');
  pieBox.innerHTML = '<h2>5D — Cost by Discipline (RM)</h2>';
  const pieCanvas = el('canvas');
  pieBox.appendChild(pieCanvas); c.appendChild(pieBox);

  const discTotals = discs.map(d => discSummary[d].matTotal + discSummary[d].laborCost + discSummary[d].equipCost);
  chartInstances.push(new Chart(pieCanvas, {
    type:'pie',
    data:{labels:discs, datasets:[{data:discTotals, backgroundColor:discs.map(d=>DISC_COLORS[d]||'#888')}]},
    options:{plugins:{legend:{position:'right',labels:{color:'#ccc'}}}}
  }));

  // ── 2. Cost Components by Discipline — M/L/E (boq_export.py "Cost Components by Discipline") ──
  const mleBox = el('div','chart-box');
  mleBox.innerHTML = '<h2>Cost Components by Discipline (RM)</h2>';
  const mleCanvas = el('canvas');
  mleBox.appendChild(mleCanvas); c.appendChild(mleBox);

  chartInstances.push(new Chart(mleCanvas, {
    type:'bar',
    data:{
      labels:discs,
      datasets:[
        {label:'Material',data:discs.map(d=>discSummary[d].matTotal),backgroundColor:'#70AD47'},
        {label:'Labour',data:discs.map(d=>discSummary[d].laborCost),backgroundColor:'#FFC000'},
        {label:'Equipment',data:discs.map(d=>discSummary[d].equipCost),backgroundColor:'#5B9BD5'},
      ]
    },
    options:{scales:{y:{stacked:true,ticks:{color:'#aaa'}},x:{stacked:{color:'#aaa'}}},plugins:{legend:{labels:{color:'#ccc'}}}}
  }));

  // ── 3. Task Distribution by Phase — pie (schedule_export.py "Task Distribution by Phase") ──
  const taskPhaseCounts = {};
  for (const t of scheduleData) taskPhaseCounts[t.phase] = (taskPhaseCounts[t.phase]||0) + 1;
  const tpPhases = Object.keys(taskPhaseCounts);

  const tpBox = el('div','chart-box');
  tpBox.innerHTML = '<h2>Task Distribution by Phase</h2>';
  const tpCanvas = el('canvas');
  tpBox.appendChild(tpCanvas); c.appendChild(tpBox);

  chartInstances.push(new Chart(tpCanvas, {
    type:'pie',
    data:{labels:tpPhases, datasets:[{data:tpPhases.map(p=>taskPhaseCounts[p]), backgroundColor:tpPhases.map(p=>PHASE_COLORS[p]||'#888')}]},
    options:{plugins:{legend:{position:'right',labels:{color:'#ccc'}}}}
  }));

  // ── 4. Task Count by Discipline — bar (schedule_export.py "Task Count by Discipline") ──
  const taskDiscCounts = {};
  for (const t of scheduleData) taskDiscCounts[t.discipline] = (taskDiscCounts[t.discipline]||0) + 1;
  const tdDiscs = Object.keys(taskDiscCounts);

  const tdBox = el('div','chart-box');
  tdBox.innerHTML = '<h2>Task Count by Discipline</h2>';
  const tdCanvas = el('canvas');
  tdBox.appendChild(tdCanvas); c.appendChild(tdBox);

  chartInstances.push(new Chart(tdCanvas, {
    type:'bar',
    data:{labels:tdDiscs, datasets:[{label:'Tasks',data:tdDiscs.map(d=>taskDiscCounts[d]),backgroundColor:tdDiscs.map(d=>DISC_COLORS[d]||'#888')}]},
    options:{scales:{y:{title:{display:true,text:'Number of Tasks',color:'#aaa'},ticks:{color:'#aaa'}},x:{title:{display:true,text:'Discipline',color:'#aaa'},ticks:{color:'#aaa'}}},plugins:{legend:{display:false}}}
  }));

  // ── 4. Phase Duration Analysis (horizontal bar — from schedule_export.py) ──
  const phaseDur = {};
  for (const t of scheduleData) phaseDur[t.phase] = (phaseDur[t.phase]||0) + t.duration;
  const pdPhases = Object.keys(phaseDur).sort((a,b) => phaseDur[b]-phaseDur[a]);

  const pdBox = el('div','chart-box');
  pdBox.innerHTML = '<h2>4D — Phase Duration (Total Days)</h2>';
  const pdCanvas = el('canvas');
  pdBox.appendChild(pdCanvas); c.appendChild(pdBox);

  chartInstances.push(new Chart(pdCanvas, {
    type:'bar',
    data:{labels:pdPhases, datasets:[{label:'Days',data:pdPhases.map(p=>Math.round(phaseDur[p])),backgroundColor:pdPhases.map(p=>PHASE_COLORS[p]||'#888')}]},
    options:{indexAxis:'y',scales:{x:{title:{display:true,text:'Days',color:'#aaa'},ticks:{color:'#aaa'}},y:{ticks:{color:'#aaa'}}},plugins:{legend:{display:false}}}
  }));

  // ── 5. Resource Workload — Man-Days by Phase (column — from schedule_export.py) ──
  const phaseMandays = {};
  for (const t of scheduleData) phaseMandays[t.phase] = (phaseMandays[t.phase]||0) + t.duration * t.crew;
  const mdPhases = Object.keys(phaseMandays).sort((a,b) => phaseMandays[b]-phaseMandays[a]);

  const mdBox = el('div','chart-box');
  mdBox.innerHTML = '<h2>4D — Resource Workload (Man-Days by Phase)</h2>';
  const mdCanvas = el('canvas');
  mdBox.appendChild(mdCanvas); c.appendChild(mdBox);

  chartInstances.push(new Chart(mdCanvas, {
    type:'bar',
    data:{labels:mdPhases, datasets:[{label:'Man-Days',data:mdPhases.map(p=>Math.round(phaseMandays[p])),backgroundColor:mdPhases.map(p=>PHASE_COLORS[p]||'#888')}]},
    options:{scales:{y:{title:{display:true,text:'Man-Days',color:'#aaa'},ticks:{color:'#aaa'}},x:{ticks:{color:'#aaa'}}},plugins:{legend:{display:false}}}
  }));

  // ── 6. S-Curve Progress (line — from schedule_export.py) ──
  if (scheduleData.length) {
    const scBox = el('div','chart-box');
    scBox.innerHTML = '<h2>4D — S-Curve Progress (Cumulative Task Completion)</h2>';
    const scCanvas = el('canvas');
    scBox.appendChild(scCanvas); c.appendChild(scBox);

    const allFinish = scheduleData.map(t => t.finishDay);
    const maxDay = Math.max(...allFinish);
    const totalTasks = scheduleData.length;
    const weekLabels = [], weekPcts = [];
    const totalWeeks = Math.max(1, Math.ceil(maxDay / 7));
    const sampleInterval = Math.max(1, Math.floor(totalWeeks / 20));

    for (let w = 0; w <= totalWeeks; w += sampleInterval) {
      const dayEnd = w * 7;
      const completed = scheduleData.filter(t => t.finishDay <= dayEnd).length;
      weekLabels.push(`W${w}`);
      weekPcts.push(Math.round(completed / totalTasks * 1000) / 10);
    }
    // Ensure final point
    if (weekPcts[weekPcts.length-1] < 100) {
      weekLabels.push(`W${totalWeeks}`);
      weekPcts.push(100);
    }

    chartInstances.push(new Chart(scCanvas, {
      type:'line',
      data:{labels:weekLabels, datasets:[{label:'% Complete',data:weekPcts,borderColor:'#4fc3f7',backgroundColor:'rgba(79,195,247,0.1)',fill:true,tension:0.3}]},
      options:{scales:{y:{min:0,max:100,title:{display:true,text:'% Complete',color:'#aaa'},ticks:{color:'#aaa'}},x:{title:{display:true,text:'Project Week',color:'#aaa'},ticks:{color:'#aaa'}}},plugins:{legend:{display:false}}}
    }));
  }

  // ── 7. Milestone Timeline (horizontal bar — from schedule_export.py) ──
  const phaseDates = {};
  for (const t of scheduleData) {
    if (!phaseDates[t.phase]) phaseDates[t.phase] = {start:t.startDay, end:t.finishDay};
    else {
      phaseDates[t.phase].start = Math.min(phaseDates[t.phase].start, t.startDay);
      phaseDates[t.phase].end = Math.max(phaseDates[t.phase].end, t.finishDay);
    }
  }
  const milestones = [];
  milestones.push({name:'Project Start', day:0});
  for (const phase of Object.keys(phaseDates).sort()) {
    milestones.push({name:`${phase} Start`, day:phaseDates[phase].start});
    milestones.push({name:`${phase} End`, day:phaseDates[phase].end});
  }
  const maxFinishDay = Math.max(...scheduleData.map(t=>t.finishDay));
  milestones.push({name:'Project Finish', day:maxFinishDay});
  milestones.sort((a,b) => a.day - b.day);

  const msBox = el('div','chart-box');
  msBox.innerHTML = '<h2>4D — Milestone Timeline</h2>';
  const msCanvas = el('canvas');
  msCanvas.height = 250;
  msBox.appendChild(msCanvas); c.appendChild(msBox);

  chartInstances.push(new Chart(msCanvas, {
    type:'bar',
    data:{labels:milestones.map(m=>m.name), datasets:[{label:'Day',data:milestones.map(m=>m.day),backgroundColor:milestones.map(m=>m.name.includes('Start')?'#70AD47':m.name.includes('End')?'#ED7D31':'#4fc3f7')}]},
    options:{indexAxis:'y',scales:{x:{title:{display:true,text:'Day from Project Start',color:'#aaa'},ticks:{color:'#aaa'}},y:{ticks:{color:'#aaa',font:{size:10}}}},plugins:{legend:{display:false}}}
  }));

  // ── 8. Strategic Gantt — Top 15 longest tasks (stacked bar — from schedule_export.py) ──
  const top15 = [...scheduleData].sort((a,b) => b.duration - a.duration).slice(0,15).sort((a,b) => a.startDay - b.startDay);

  const ganttBox = el('div','chart-box full');
  ganttBox.innerHTML = '<h2>4D — Gantt Timeline (Strategic Tasks by Phase)</h2>';
  const ganttCanvas = el('canvas');
  ganttCanvas.height = 350;
  ganttBox.appendChild(ganttCanvas); c.appendChild(ganttBox);

  chartInstances.push(new Chart(ganttCanvas, {
    type:'bar',
    data:{
      labels:top15.map(t => t.name.slice(0,40)),
      datasets:[
        {label:'Offset',data:top15.map(t=>t.startDay),backgroundColor:'rgba(0,0,0,0)'},
        {label:'Duration',data:top15.map(t=>Math.round(t.duration)),backgroundColor:top15.map(t=>PHASE_COLORS[t.phase]||'#888')},
      ]
    },
    options:{
      indexAxis:'y',
      scales:{
        x:{stacked:true,title:{display:true,text:'Days from Project Start',color:'#aaa'},ticks:{color:'#aaa'}},
        y:{stacked:true,ticks:{color:'#aaa',font:{size:9}}}
      },
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:ctx=>{
          if (ctx.datasetIndex===0) return null;
          const t = top15[ctx.dataIndex];
          return `${t.phase}: Day ${t.startDay}–${t.finishDay} (${Math.round(t.duration)} days, ${t.qty} EA)`;
        }}}
      }
    }
  }));

  // ── 9. BOQ Data Table (enhanced with Equipment column) ──
  const tableBox = el('div','chart-box full');
  tableBox.innerHTML = '<h2>5D — Bill of Quantities (CIDB 2024 Rates)</h2>';
  let html = '<table><tr><th>Disc</th><th>IFC Class</th><th>Storey</th><th>Qty</th><th>Unit</th>' +
    '<th>Description</th><th>Rate (RM)</th><th>Material (RM)</th><th>Labour Days</th><th>Labour (RM)</th>' +
    '<th>Equip (RM)</th><th>Total (RM)</th></tr>';
  for (const r of qtoData) {
    const rowTotal = r.matTotal + r.laborCost + r.equipCost;
    html += `<tr><td>${r.disc}</td><td>${r.cls}</td><td>${r.storey||''}</td><td>${r.qty.toLocaleString()}</td>` +
      `<td>${r.unit}</td><td>${r.desc}</td><td>${r.matRate.toLocaleString()}</td>` +
      `<td>${r.matTotal.toLocaleString()}</td><td>${r.laborDays.toFixed(1)}</td><td>${r.laborCost.toLocaleString()}</td>` +
      `<td>${r.equipCost.toLocaleString()}</td><td>${rowTotal.toLocaleString()}</td></tr>`;
  }
  const gt = grandMaterial + grandLabor + grandEquip;
  html += `<tr class="total-row"><td colspan="7">GRAND TOTAL</td>` +
    `<td>RM ${grandMaterial.toLocaleString()}</td><td></td><td>RM ${grandLabor.toLocaleString()}</td>` +
    `<td>RM ${grandEquip.toLocaleString()}</td><td>RM ${gt.toLocaleString()}</td></tr>`;
  html += '</table>';
  tableBox.innerHTML += html;
  c.appendChild(tableBox);

  // ── 10. Summary footer ──
  const projDays = scheduleData.length ? Math.max(...scheduleData.map(t=>t.finishDay)) : 0;
  const footBox = el('div','chart-box full');
  footBox.innerHTML = `<table>
    <tr><td>Building</td><td><b>${bldName}</b></td></tr>
    <tr><td>Total Elements</td><td><b>${totalQty.toLocaleString()}</b></td></tr>
    <tr><td>Material Cost</td><td><b>RM ${grandMaterial.toLocaleString()}</b></td></tr>
    <tr><td>Labour Cost</td><td><b>RM ${grandLabor.toLocaleString()}</b></td></tr>
    <tr><td>Equipment Cost</td><td><b>RM ${grandEquip.toLocaleString()}</b></td></tr>
    <tr><td>Grand Total</td><td><b>RM ${gt.toLocaleString()}</b></td></tr>
    <tr><td>Project Duration</td><td><b>${projDays} days (${scheduleData.length} tasks)</b></td></tr>
    <tr><td>Rates Source</td><td>CIDB Malaysia 2024 / BCISM Cost Book</td></tr>
    <tr><td>Exported</td><td>${new Date().toISOString()}</td></tr>
    <tr><td>Source</td><td>BIM OOTB — Frictionless BIM</td></tr>
  </table>`;
  c.appendChild(footBox);
}

function el(tag, cls) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}

    ['P5','Flight Information Display (FIDS)',25,'EA',8500,1200,'55" LED, networked'],
    ['P6','Baggage Trolley Storage Racks',12,'EA',1850,350,'Stainless steel, 30 trolleys'],
    ['P7','Retail Kiosk Fit-outs (Shell)',8,'EA',22000,5500,'Structural frame, services rough-in'],
    ['P8','Rubber Safety Flooring',Math.round(floorArea*0.15),'M2',95,28,'Anti-slip, heavy duty'],
    ['P9','Acoustic Ceiling Panels',Math.round(floorArea*0.20),'M2',135,42,'Class A, fire-rated'],
    ['P10','Bollards & Barriers - Security',45,'EA',1250,280,'Fixed/removable, crash-rated'],

  for (const p of provItems) {
    const total = p[2] * (p[4] + p[5]);
    provTotal += total;
    provRows.push([p[0], p[1], p[2], p[3], p[4], p[5], Math.round(total)]);
  }
  provRows.push([]);
  provRows.push(['','','','','','TOTAL PROVISIONAL SUMS', Math.round(provTotal)]);
  const wsProv = XLSX.utils.aoa_to_sheet(provRows);
  wsProv['!cols'] = [{wch:8},{wch:40},{wch:10},{wch:6},{wch:14},{wch:14},{wch:16}];
  XLSX.utils.book_append_sheet(wb, wsProv, 'Provisional Sums');

  const filename = `BIM_OOTB_${bldName}_5D_BOQ_${new Date().toISOString().slice(0,10)}.xlsx`;
  XLSX.writeFile(wb, filename);
  document.getElementById('status').textContent = `Saved ${filename} (7 sheets)`;
}

// ============================================================================
// SAVE 4D SCHEDULE — 3 sheets (matches schedule_export.py)
// ============================================================================
function save4D() {
  const wb = XLSX.utils.book_new();
  const projDays = scheduleData.length ? Math.max(...scheduleData.map(t=>t.finishDay)) : 0;

  // ── Sheet 1: Construction Schedule ──
  const schedHeaders = ['WBS','Task Name','Phase','Discipline','Storey','Quantity','UOM',
    'Productivity','Duration (days)','Gangs','Start Date','Finish Date','Labor Resource','Crew Size','Equipment','Status','% Complete'];
  const schedRows = [schedHeaders];
  for (const t of scheduleData) {
    schedRows.push([t.wbs,t.name,t.phase,t.discipline,t.storey,t.qty,t.uom,t.productivity,
      Math.round(t.duration*100)/100, t.crews||1, t.startDate, t.finishDate, t.resource, t.crew, t.equipment, 'Not Started', 0]);
  }
  const wsSched = XLSX.utils.aoa_to_sheet(schedRows);
  wsSched['!cols'] = [{wch:12},{wch:40},{wch:16},{wch:10},{wch:10},{wch:8},{wch:6},{wch:10},{wch:12},{wch:6},{wch:12},{wch:12},{wch:16},{wch:8},{wch:22},{wch:12},{wch:10}];
  XLSX.utils.book_append_sheet(wb, wsSched, 'Construction Schedule');

  // ── Sheet 2: Project Summary ──
  const phaseCounts = {}, discCounts = {};
  for (const t of scheduleData) {
    phaseCounts[t.phase] = (phaseCounts[t.phase]||0) + 1;
    discCounts[t.discipline] = (discCounts[t.discipline]||0) + 1;
  }
  const sumRows = [
    [bldName + ' Construction'],
    [],
    ['Database', DB_URL],
    ['Total Tasks', scheduleData.length],
    ['Project Start', scheduleData.length ? scheduleData[0].startDate : 'N/A'],
    ['Project Finish', scheduleData.length ? scheduleData[scheduleData.length-1].finishDate : 'N/A'],
    ['Total Duration', `${projDays} days`],
    ['Generated', new Date().toISOString()],
    [],
    ['Phase Summary','Task Count'],
  ];
  for (const [p,cnt] of Object.entries(phaseCounts).sort()) sumRows.push([p, cnt]);
  sumRows.push([]);
  sumRows.push(['Discipline Summary','Task Count']);
  for (const [d,cnt] of Object.entries(discCounts).sort()) sumRows.push([d, cnt]);
  const wsSum = XLSX.utils.aoa_to_sheet(sumRows);
  wsSum['!cols'] = [{wch:25},{wch:20}];
  XLSX.utils.book_append_sheet(wb, wsSum, 'Project Summary');

  // ── Sheet 3: BIM 5D Dashboard ──
  const dashRows = [
    [`${bldName} - BIM 4D Analytics Dashboard`],
    [],
    ['Phase Duration Analysis'],
    ['Phase','Total Days'],
  ];
  const phaseDur2 = {};
  for (const t of scheduleData) phaseDur2[t.phase] = (phaseDur2[t.phase]||0) + t.duration;
  for (const [p,d] of Object.entries(phaseDur2).sort((a,b)=>b[1]-a[1])) dashRows.push([p, Math.round(d*100)/100]);
  dashRows.push([]);

  dashRows.push(['Resource Workload Analysis']);
  dashRows.push(['Phase','Total Man-Days']);
  const phaseMD2 = {};
  for (const t of scheduleData) phaseMD2[t.phase] = (phaseMD2[t.phase]||0) + t.duration * t.crew;
  for (const [p,md] of Object.entries(phaseMD2).sort((a,b)=>b[1]-a[1])) dashRows.push([p, Math.round(md*10)/10]);
  dashRows.push([]);

  dashRows.push(['S-Curve Progress']);
  dashRows.push(['Week','Cumulative %']);
  if (scheduleData.length) {
    const maxD = Math.max(...scheduleData.map(t=>t.finishDay));
    const tw = Math.max(1, Math.ceil(maxD/7));
    const si = Math.max(1, Math.floor(tw/20));
    for (let w = 0; w <= tw; w += si) {
      const completed = scheduleData.filter(t => t.finishDay <= w*7).length;
      dashRows.push([`W${w}`, Math.round(completed/scheduleData.length*1000)/10]);
    }
    if (dashRows[dashRows.length-1][1] < 100) dashRows.push([`W${tw}`, 100]);
  }
  dashRows.push([]);

  dashRows.push(['Milestone Timeline']);
  dashRows.push(['Milestone','Day Offset','Date']);
  const pd2 = {};
  for (const t of scheduleData) {
    if (!pd2[t.phase]) pd2[t.phase] = {s:t.startDate,e:t.finishDate,sd:t.startDay,ed:t.finishDay};
    else {
      if (t.startDay < pd2[t.phase].sd) { pd2[t.phase].sd = t.startDay; pd2[t.phase].s = t.startDate; }
      if (t.finishDay > pd2[t.phase].ed) { pd2[t.phase].ed = t.finishDay; pd2[t.phase].e = t.finishDate; }
    }
  }
  dashRows.push(['Project Start', 0, scheduleData.length ? scheduleData[0].startDate : '']);
  for (const phase of Object.keys(pd2).sort()) {
    dashRows.push([`${phase} Start`, pd2[phase].sd, pd2[phase].s]);
    dashRows.push([`${phase} End`, pd2[phase].ed, pd2[phase].e]);
  }
  dashRows.push(['Project Finish', projDays, scheduleData.length ? scheduleData[scheduleData.length-1].finishDate : '']);
  dashRows.push([]);

  dashRows.push(['Gantt Timeline (Strategic Tasks)']);
  dashRows.push(['Task','Phase','Start (Day)','Duration (Days)']);
  const top15x = [...scheduleData].sort((a,b)=>b.duration-a.duration).slice(0,15).sort((a,b)=>a.startDay-b.startDay);
  for (const t of top15x) dashRows.push([t.name.slice(0,35), t.phase, t.startDay, Math.round(t.duration*10)/10]);

  const wsDash = XLSX.utils.aoa_to_sheet(dashRows);
  wsDash['!cols'] = [{wch:40},{wch:18},{wch:15},{wch:15}];
  XLSX.utils.book_append_sheet(wb, wsDash, 'BIM 4D Dashboard');

  const filename = `BIM_OOTB_${bldName}_4D_Schedule_${new Date().toISOString().slice(0,10)}.xlsx`;
  XLSX.writeFile(wb, filename);
  document.getElementById('status').textContent = `Saved ${filename} (3 sheets)`;
}

// ── Theme toggle ──
let light = false;
function toggleTheme() {
  light = !light;
  document.body.style.background = light ? '#f0f0f0' : '#1a1a2e';
  document.body.style.color = light ? '#222' : '#e0e0e0';
  document.querySelectorAll('h1,h2').forEach(e => e.style.color = light ? '#0077cc' : '#4fc3f7');
  document.querySelectorAll('th').forEach(e => {
    e.style.background = light ? 'rgba(0,119,204,0.1)' : 'rgba(79,195,247,0.15)';
    e.style.color = light ? '#0077cc' : '#4fc3f7';
  });
  document.querySelectorAll('.chart-box').forEach(e => {
    e.style.background = light ? 'rgba(0,0,0,0.03)' : 'rgba(255,255,255,0.05)';
    e.style.borderColor = light ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.08)';
  });
}

init();
</script>

</html>
