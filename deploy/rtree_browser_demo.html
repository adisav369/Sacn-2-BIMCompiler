    #hud { top: 8px; left: 8px; right: 8px; max-width: none; font-size: 14px; }
    #hud h2 { font-size: 16px; }

    .bld-card { padding: 8px 12px; font-size: 14px; }
    .panel-toggle { font-size: 20px; padding: 4px 8px; }
  }
</style>

<div id="load-overlay" style="position:fixed;top:0;left:0;width:100vw;height:100vh;
  background:#1a1a2e;z-index:1000;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-family:'Segoe UI',sans-serif">
  <div style="color:#4fc3f7;font-size:24px;font-weight:700;margin-bottom:20px">BIM OOTB</div>
  <div style="color:#888;font-size:13px;margin-bottom:16px">Frictionless BIM. Two DBs. One browser. Zero install.</div>
  <div id="load-items" style="width:280px"></div>
  <div id="load-elapsed" style="color:#555;font-size:12px;margin-top:12px">0:00</div>
</div>

<script>
// ── Progressive script loader with per-library progress ──
const _loadStart = performance.now();
const _elapsedEl = document.getElementById('load-elapsed');
const _timerIv = setInterval(() => {
  const s = Math.floor((performance.now() - _loadStart) / 1000);
  _elapsedEl.textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}, 1000);

const LIBS = [
  { name: 'Three.js',       url: 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js' },
  { name: 'OrbitControls',   url: 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js' },
  { name: 'SQLite (WASM)',   url: 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js' },
  { name: 'SheetJS (Excel)', url: 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js' },
];

// Create progress rows
const loadItems = document.getElementById('load-items');
LIBS.forEach((lib, i) => {
  const row = document.createElement('div');
  row.id = `lib-${i}`;
  row.style.cssText = 'margin:4px 0;font-size:12px;color:#aaa';
  row.innerHTML = `
    <div style="display:flex;justify-content:space-between">
      <span>${lib.name}</span>
      <span id="lib-${i}-status" style="color:#666">waiting...</span>
    </div>
    <div style="height:3px;background:#333;border-radius:2px;margin-top:2px">
      <div id="lib-${i}-bar" style="height:100%;width:0%;background:#4fc3f7;border-radius:2px;transition:width 0.05s"></div>
    </div>
  `;
  loadItems.appendChild(row);
});

async function fetchWithProgress(url, index) {
  const statusEl = document.getElementById(`lib-${index}-status`);
  const barEl = document.getElementById(`lib-${index}-bar`);
  statusEl.textContent = 'connecting...';
  statusEl.style.color = '#4fc3f7';

  const resp = await fetch(url);
  const total = +resp.headers.get('Content-Length') || 0;
  const reader = resp.body.getReader();
  const chunks = [];
  let received = 0;
  const t0 = performance.now();

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.length;
    const pct = total > 0 ? (received / total * 100) : 0;
    const speed = received / ((performance.now() - t0) / 1000);
    const eta = total > 0 ? Math.ceil((total - received) / speed) : '?';
    barEl.style.width = (total > 0 ? pct : 50) + '%';
    statusEl.textContent = total > 0
      ? `${(received/1024).toFixed(0)}/${(total/1024).toFixed(0)}KB  ${(speed/1024).toFixed(0)}KB/s  ~${eta}s`
      : `${(received/1024).toFixed(0)}KB`;
  }

  barEl.style.width = '100%';
  barEl.style.background = '#44cc44';
  const elapsed = ((performance.now() - t0) / 1000).toFixed(1);
  statusEl.textContent = `${(received/1024).toFixed(0)}KB in ${elapsed}s`;
  statusEl.style.color = '#44cc44';

  // Inject as script
  const blob = new Blob(chunks, { type: 'application/javascript' });
  const script = document.createElement('script');
  script.src = URL.createObjectURL(blob);
  return new Promise((resolve, reject) => {
    script.onload = resolve;
    script.onerror = reject;
    document.head.appendChild(script);
  });
}

async function loadAllLibs() {
  // Three.js must load before OrbitControls (dependency)
  await fetchWithProgress(LIBS[0].url, 0);  // Three.js
  await fetchWithProgress(LIBS[1].url, 1);  // OrbitControls (needs THREE global)
  // sql.js and SheetJS are independent — load in parallel
  await Promise.all([
    fetchWithProgress(LIBS[2].url, 2),
    fetchWithProgress(LIBS[3].url, 3),
  ]);

  // All loaded — remove overlay, show canvas
  clearInterval(_timerIv);
  document.getElementById('load-overlay').style.display = 'none';
  document.getElementById('canvas').style.display = 'block';

  // Now run the viewer
  initViewer();
}

loadAllLibs().catch(e => {
  document.getElementById('load-items').innerHTML += `
    <div style="color:#ff6644;margin-top:10px">Failed: ${e.message}</div>
  `;
});

function initViewer() {
// ── Config ──
const _params = new URLSearchParams(location.search);
// Auto-resolve: if hosted on OCI Object Storage, use same bucket base for DB URLs
const _ociMatch = location.href.match(/(https:\/\/objectstorage\.[^/]+\/n\/[^/]+\/b\/[^/]+\/o\/)/);
const _base = _ociMatch ? _ociMatch[1] : '';
const DB_URL = _params.get('db') || (_base ? _base + 'Duplex_extracted.db' : 'yourproject_extracted.db');
const LIB_URL = _params.get('lib') || (_base ? _base + 'component_library.db' : 'component_library.db');
const CITY_URL = _params.get('city') || null;   // city_index.db for city mode
const BLD_BASE = _params.get('bldbase') || '';   // per-building DB folder

// ── Discipline colours (same as Blender addon) ──
const DISC_COLORS = {
  ARC:  0x4488ff, STR:  0x44cccc, MEP:  0x44cc44,
  ELEC: 0xcccc44, FP:   0xcc8844, ACMV: 0xcc4444,
  PLB:  0x8844cc, HEAT: 0xff6644, HVAC: 0x44aacc,
  SAN:  0xaa44aa, VENT: 0x88ccaa, VOID: 0x666666,
};
const DEFAULT_COLOR = 0x888888;

// ── Three.js setup ──
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x1a1a2e);
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
// No fog — large buildings (LTU 126K) need full visibility from all angles
// scene.fog = new THREE.Fog(0x1a1a2e, 2000, 10000);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.5, 50000);
camera.position.set(300, 200, 400);

const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxDistance = 20000;
controls.minPolarAngle = 0;               // allow full top-down
controls.maxPolarAngle = Math.PI;         // allow full bottom-up — unrestricted orbit

// Controls: LMB=orbit, RMB=pan, scroll=zoom
// Touchpad: two-finger drag=orbit, two-finger pinch=zoom, Shift+drag=pan
controls.mouseButtons = {
  LEFT: THREE.MOUSE.ROTATE,
  MIDDLE: THREE.MOUSE.DOLLY,
  RIGHT: THREE.MOUSE.PAN
};
controls.touches = {
  ONE: THREE.TOUCH.ROTATE,
  TWO: THREE.TOUCH.DOLLY_PAN
};
controls.enablePan = true;
controls.panSpeed = 1.5;
controls.screenSpacePanning = true;
controls.zoomSpeed = 1.2;
controls.rotateSpeed = 0.8;
controls.keyPanSpeed = 20;

// Shift+Left = pan (for trackpad users without middle/right mouse)
canvas.addEventListener('pointerdown', (e) => {
  if (e.shiftKey && e.button === 0) {
    controls.mouseButtons.LEFT = THREE.MOUSE.PAN;
  }
});
canvas.addEventListener('pointerup', () => {
  controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
});

// Lighting
const ambient = new THREE.AmbientLight(0x606080, 0.6);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xfff0dd, 1.0);
sun.position.set(200, 400, 300);
sun.castShadow = true;
scene.add(sun);
const hemi = new THREE.HemisphereLight(0x8888cc, 0x444422, 0.4);
scene.add(hemi);

// Ground plane — positioned after DB load to sit below the lowest building
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(50000, 50000),
  new THREE.MeshLambertMaterial({ color: 0x222233, side: THREE.DoubleSide })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
ground.visible = false;  // shown after DB sets correct Y
scene.add(ground);

// ── State ──
let db = null, libDb = null;
let buildingCentres = {};  // name → {x,y,z,count}
let discCounts = {};       // disc → count
let meshCache = {};        // hash → THREE.BufferGeometry
let streamedCount = 0;
let totalElements = 0;
let modelOffset = { x: 0, y: 0, z: 0 };
let activeBuilding = null;
let activeBuildingTotal = 0;
let buildingsRendered = new Set();

const status = document.getElementById('status');

// IFC (X=east, Y=north, Z=up) → Three.js (X=east, Y=up, Z=south)
function ifc2three(ix, iy, iz) {
  return { x: ix - modelOffset.x, y: iz - modelOffset.z, z: -(iy - modelOffset.y) };
}

// ── IndexedDB cache — download once, reuse forever ──
const CACHE_DB_NAME = 'bim_ootb_cache';
const CACHE_STORE = 'dbs';

function openCacheDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(CACHE_DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(CACHE_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);  // cache failure is not fatal
  });
}

async function cachedFetch(url) {
  // Try cache first
  const cacheDb = await openCacheDB();
  if (cacheDb) {
    try {
      const cached = await new Promise((resolve, reject) => {
        const tx = cacheDb.transaction(CACHE_STORE, 'readonly');
        const req = tx.objectStore(CACHE_STORE).get(url);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      });
      if (cached) {
        console.log(`[S203] §CACHE_HIT ${url} size=${(cached.byteLength/1024/1024).toFixed(1)}MB`);
        return cached;
      }
    } catch(e) { /* cache miss */ }
  }

  // Download from network
  const buf = await fetch(url).then(r => {
    if (!r.ok) throw new Error(`Failed to fetch ${url}: ${r.status}`);
    return r.arrayBuffer();
  });

  // Store in cache (fire-and-forget)
  if (cacheDb) {
    try {
      const tx = cacheDb.transaction(CACHE_STORE, 'readwrite');
      tx.objectStore(CACHE_STORE).put(buf, url);
    } catch(e) { console.log(`[S203] §CACHE_WRITE_ERR ${e.message}`); }
  }

  console.log(`[S203] §CACHE_MISS ${url} size=${(buf.byteLength/1024/1024).toFixed(1)}MB — cached for next time`);
  return buf;
}

// ── Load databases ──
async function init() {
  status.textContent = 'Loading sql.js WebAssembly...';
  const SQL = await initSqlJs({
    locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}`
  });

  // ── City mode: load lightweight index, show bboxes, download buildings on demand ──
  if (CITY_URL) {
    await initCity(SQL);
    return;
  }

  status.textContent = `Fetching ${DB_URL}...`;
  const dbBuf = await cachedFetch(DB_URL);
  db = new SQL.Database(new Uint8Array(dbBuf));
  console.log(`[S192] §DB_LOADED size=${(dbBuf.byteLength/1024/1024).toFixed(0)}MB`);
  status.textContent = `DB loaded (${(dbBuf.byteLength/1024/1024).toFixed(0)}MB). Querying...`;

  // Get building centres + counts (using element_transforms — no R-tree needed)
  const rows = db.exec(`
    SELECT m.building, COUNT(*),
      AVG(t.center_x), AVG(t.center_y), AVG(t.center_z)
    FROM elements_meta m
    JOIN element_transforms t ON t.guid = m.guid
    WHERE m.discipline IN ('ARC','STR')
    GROUP BY m.building
  `);
  // Store in IFC coords (x=east, y=north, z=up). Convert to Three.js at render time.
  if (rows.length > 0) {
    for (const row of rows[0].values) {
      buildingCentres[row[0]] = { ix: row[2], iy: row[3], iz: row[4], count: row[1] };
    }
  }
  console.log(`[S192] §BOOTSTRAP centres=${Object.keys(buildingCentres).length}`);

  // Model offset in IFC coords (centre of all buildings)
  const allIX = Object.values(buildingCentres).map(b => b.ix);
  const allIY = Object.values(buildingCentres).map(b => b.iy);
  const allIZ = Object.values(buildingCentres).map(b => b.iz);
  if (allIX.length) {
    modelOffset.x = (Math.min(...allIX) + Math.max(...allIX)) / 2;
    modelOffset.y = (Math.min(...allIY) + Math.max(...allIY)) / 2;
    modelOffset.z = (Math.min(...allIZ) + Math.max(...allIZ)) / 2;
  }
  console.log(`[S192] §OFFSET ifc=(${modelOffset.x.toFixed(0)}, ${modelOffset.y.toFixed(0)}, ${modelOffset.z.toFixed(0)})`);

  // Position ground plane below lowest element (IFC Z → Three.js Y)
  const zRange = db.exec(`SELECT MIN(center_z), MAX(center_z) FROM element_transforms`);
  if (zRange.length > 0) {
    const minZ = zRange[0].values[0][0];
    const groundY = (minZ - modelOffset.z) - 2;  // 2m below lowest element
    ground.position.y = groundY;
    ground.visible = true;
    console.log(`[S200] §GROUND minZ_ifc=${minZ.toFixed(1)} groundY=${groundY.toFixed(1)}`);
  }

  // Element + discipline counts
  const elemRows = db.exec(`SELECT COUNT(*) FROM elements_meta`);
  totalElements = elemRows[0]?.values[0][0] || 0;
  const discRows = db.exec(`SELECT discipline, COUNT(*) FROM elements_meta GROUP BY discipline ORDER BY COUNT(*) DESC`);
  if (discRows.length > 0) {
    for (const r of discRows[0].values) {
      discCounts[r[0]] = r[1];
    }
  }

  updateHUD();
  populateBuildingList();

  // Draw building bboxes (like Preview — 1 box per disc per building)
  drawBuildingBoxes();

  // Try loading library DB
  status.textContent = `Fetching ${LIB_URL}...`;
  try {
    const libBuf = await cachedFetch(LIB_URL);
    libDb = new SQL.Database(new Uint8Array(libBuf));
    console.log(`[S192] §LIB_LOADED size=${(libBuf.byteLength/1024/1024).toFixed(0)}MB`);
    // Check which table has geometry
    try {
      const t = libDb.exec("SELECT COUNT(*) FROM component_geometries");
      console.log(`[S192] §LIB_TABLE component_geometries rows=${t[0].values[0][0]}`);
    } catch(e2) {
      console.log(`[S192] §LIB_TABLE component_geometries not found, trying base_geometries`);
      try {
        const t2 = libDb.exec("SELECT COUNT(*) FROM base_geometries");
        console.log(`[S192] §LIB_TABLE base_geometries rows=${t2[0].values[0][0]}`);
      } catch(e3) {
        console.log(`[S192] §LIB_ERROR no geometry table found`);
      }
    }
    status.textContent = `Library loaded (${(libBuf.byteLength/1024/1024).toFixed(0)}MB). Streaming nearest building...`;
  } catch (e) {
    // No separate library DB — fall back to main DB (base_geometries table)
    console.log(`[S200] §LIB_FALLBACK using main DB for geometry (${e.message})`);
    libDb = db;
    status.textContent = `Using main DB for geometry. Streaming...`;
  }

  // Position camera — measure actual building envelope from DB
  const bboxQ = db.exec(`
    SELECT MIN(center_x), MAX(center_x),
           MIN(center_y), MAX(center_y),
           MIN(center_z), MAX(center_z)
    FROM element_transforms
  `);
  let envW = 500, envD = 500, envH = 100;
  if (bboxQ.length > 0) {
    const [xMin, xMax, yMin, yMax, zMin, zMax] = bboxQ[0].values[0];
    envW = xMax - xMin;  // IFC X = width (east-west)
    envD = yMax - yMin;  // IFC Y = depth (north-south)
    envH = zMax - zMin;  // IFC Z = height (up)
  }
  const envelope = Math.max(envW, envD, envH);
  // Store envelope on all building centres so fly orbit uses it
  for (const bc of Object.values(buildingCentres)) {
    bc.envelope = envelope;
  }
  const dist = Math.max(80, envelope * 1.5);
  // High isometric angle — looking down at rooftops
  const ctr = ifc2three(
    (bboxQ[0]?.values[0][0] + bboxQ[0]?.values[0][1]) / 2 || 0,
    (bboxQ[0]?.values[0][2] + bboxQ[0]?.values[0][3]) / 2 || 0,
    (bboxQ[0]?.values[0][4] + bboxQ[0]?.values[0][5]) / 2 || 0
  );
  camera.position.set(ctr.x + dist * 0.6, ctr.y + dist * 0.8, ctr.z + dist * 0.6);
  camera.far = Math.max(10000, dist * 5);
  camera.updateProjectionMatrix();
  controls.target.set(ctr.x, ctr.y, ctr.z);
  controls.update();
  console.log(`[S203] §CAMERA envelope=${envW.toFixed(0)}x${envD.toFixed(0)}x${envH.toFixed(0)}m dist=${dist.toFixed(0)}m`);

  // Start streaming — check URL hash for deep-link first
  if (libDb) {
    const hashParams = loadFromHash();
    if (hashParams && hashParams.bld && buildingCentres[hashParams.bld]) {
      // Restore camera from deep-link
      if (hashParams.cx) {
        camera.position.set(Number(hashParams.cx), Number(hashParams.cy), Number(hashParams.cz));
        controls.target.set(Number(hashParams.tx), Number(hashParams.ty), Number(hashParams.tz));
        controls.update();
      }
      streamBuilding(hashParams.bld);
    } else {
      startStreaming();
    }
    // Auto-start fly mode so user sees the building from all angles
    setTimeout(() => { if (!flyActive) toggleFlyAround(); }, 2000);
  }
}

// ── Draw building bounding boxes (Preview equivalent) ──
function drawBuildingBoxes() {
  // Use element_transforms for bbox (no R-tree virtual table in WASM)
  const rows = db.exec(`
    SELECT m.building, m.discipline,
      MIN(t.center_x) - 5, MIN(t.center_y) - 5, MIN(t.center_z),
      MAX(t.center_x) + 5, MAX(t.center_y) + 5, MAX(t.center_z) + 3
    FROM elements_meta m
    JOIN element_transforms t ON t.guid = m.guid
    GROUP BY m.building, m.discipline
  `);
  if (!rows.length) return;

  for (const row of rows[0].values) {
    const [bld, disc, minX, minY, minZ, maxX, maxY, maxZ] = row;
    const color = DISC_COLORS[disc] || DEFAULT_COLOR;

    // IFC centre → Three.js
    const c = ifc2three((minX+maxX)/2, (minY+maxY)/2, (minZ+maxZ)/2);
    const sx = maxX - minX;
    const sy = maxZ - minZ;  // IFC Z extent → Three Y (height)
    const sz = maxY - minY;  // IFC Y extent → Three Z (depth)

    if (sx < 0.1 || sy < 0.1 || sz < 0.1) continue;

    const geo = new THREE.BoxGeometry(sx, sy, sz);
    const edges = new THREE.EdgesGeometry(geo);
    const line = new THREE.LineSegments(edges,
      new THREE.LineBasicMaterial({ color, opacity: 0.6, transparent: true }));
    line.position.set(c.x, c.y, c.z);
    line.userData = { building: bld, discipline: disc };
    scene.add(line);
  }

  document.getElementById('s-buildings').textContent =
    Object.keys(buildingCentres).length.toLocaleString();
  document.getElementById('s-elements').textContent = totalElements.toLocaleString();
}

// ── Stream geometry from library DB ──
let streamQueue = [];
let streamIdx = 0;
let streaming = false;

function startStreaming() {
  // Find nearest building to camera
  let nearest = null, nearestDist = Infinity;
  for (const [name, bc] of Object.entries(buildingCentres)) {
    const t = ifc2three(bc.ix, bc.iy, bc.iz);
    const dx = t.x - camera.position.x;
    const dz = t.z - camera.position.z;
    const d = Math.sqrt(dx*dx + dz*dz);
    if (d < nearestDist) { nearestDist = d; nearest = name; }
  }
  if (!nearest) return;
  console.log(`[S192] §DS_AUTO_START bld=${nearest} dist=${nearestDist.toFixed(0)}m`);
  streamBuilding(nearest);
}

let savedStreams = {};  // building → {queue, idx}

function streamBuilding(nearest) {
  // Save current stream if in progress
  if (activeBuilding && streaming && streamIdx < streamQueue.length) {
    savedStreams[activeBuilding] = { queue: streamQueue, idx: streamIdx };
  }
  streaming = false;

  // Resume saved stream or start fresh
  if (savedStreams[nearest]) {
    streamQueue = savedStreams[nearest].queue;
    streamIdx = savedStreams[nearest].idx;
    delete savedStreams[nearest];
    streaming = true;
    activeBuilding = nearest;
    activeBuildingTotal = streamQueue.length;
    console.log(`[S192] §DS_RESUME bld=${nearest} at=${streamIdx}/${streamQueue.length}`);
  } else {
    // Fresh query
    streamQueue = [];
    streamIdx = 0;
    const rows = db.exec(`
      SELECT m.guid, i.geometry_hash, m.material_rgba, m.discipline,
             t.center_x, t.center_y, t.center_z,
             t.rotation_x, t.rotation_y, t.rotation_z,
             m.storey, m.ifc_class
      FROM elements_meta m
      JOIN element_instances i ON m.guid = i.guid
      JOIN element_transforms t ON t.guid = m.guid
      WHERE m.building = '${nearest}'
        AND i.geometry_hash IS NOT NULL
        AND m.ifc_class != 'IfcOpeningElement'
    `);
    if (!rows.length) {
      console.log(`[S192] §DS_EMPTY bld=${nearest} — no streamable elements`);
      return;
    }
    streamQueue = rows[0].values;
    streamIdx = 0;
    streaming = true;
    activeBuilding = nearest;
    activeBuildingTotal = streamQueue.length;
    console.log(`[S192] §DS_QUEUED bld=${nearest} elements=${streamQueue.length}`);
  }
  document.getElementById('s-active').textContent = `${nearest}`;
  document.getElementById('s-building-total').textContent = activeBuildingTotal.toLocaleString();
  document.getElementById('s-progress').style.width = (streamIdx / streamQueue.length * 100).toFixed(1) + '%';
  document.getElementById('s-progress').style.background = '#4fc3f7';
  status.textContent = `STREAMING ${nearest} — ${streamIdx.toLocaleString()}/${streamQueue.length.toLocaleString()} elements`;
}

function streamTick() {
  if (!streaming || !libDb || streamIdx >= streamQueue.length) {
    if (streaming && streamIdx >= streamQueue.length) {
      streaming = false;
      if (activeBuilding) {
        buildingsRendered.add(activeBuilding);
        populateStoreys(activeBuilding);
        populateDiscs(activeBuilding);
      }
      document.getElementById('s-buildings-done').textContent = buildingsRendered.size;
      document.getElementById('s-active').textContent = `${activeBuilding} — DONE`;
      document.getElementById('s-active').style.color = '#44cc44';
      document.getElementById('s-current-element').textContent = '';
      document.getElementById('s-progress').style.width = '100%';
      document.getElementById('s-progress').style.background = '#44cc44';
      updateHash();
      status.textContent = `DONE — ${activeBuilding} ${streamedCount.toLocaleString()} elements. ${buildingsRendered.size} building(s) rendered.`;
    }
    return;
  }

  const batch = Math.min(50, streamQueue.length - streamIdx);
  const hashesNeeded = new Set();

  for (let i = 0; i < batch; i++) {
    const row = streamQueue[streamIdx + i];
    const hash = row[1];
    if (hash && !meshCache[hash]) hashesNeeded.add(hash);
  }

  // Fetch BLOBs for new hashes
  if (hashesNeeded.size > 0) {
    const hashList = [...hashesNeeded];
    const ph = hashList.map(() => '?').join(',');
    let fetched = 0;
    // Try component_geometries first, then base_geometries
    for (const table of ['component_geometries', 'base_geometries']) {
      if (fetched > 0) break;
      try {
        const stmt = libDb.prepare(
          `SELECT geometry_hash, vertices, faces FROM ${table} WHERE geometry_hash IN (${ph})`
        );
        stmt.bind(hashList);
        while (stmt.step()) {
          const [ghash, vBlob, fBlob] = stmt.get();
          if (vBlob && fBlob) {
            const geo = blobToGeometry(vBlob, fBlob);
            if (geo) { meshCache[ghash] = geo; fetched++; }
          }
        }
        stmt.free();
        if (fetched > 0) {
          console.log(`[S192] §BLOB_FETCH table=${table} new=${fetched} total_cached=${Object.keys(meshCache).length}`);
        }
      } catch (e) {
        // Table doesn't exist — try next
      }
    }
    if (fetched === 0 && hashesNeeded.size > 0) {
      console.warn(`[S192] §BLOB_MISS hashes=${hashesNeeded.size} — no geometry found in library`);
    }
  }

  for (let i = 0; i < batch; i++) {
    const row = streamQueue[streamIdx + i];
    const [guid, hash, rgba, disc, cx, cy, cz, rotX, rotY, rotZ, storey, ifcClass] = row;

    const geo = meshCache[hash];
    if (!geo) continue;

    // IFC material color; neutral grey fallback if missing
    let r, g, b, a = 1.0;
    const rgbaStr = rgba != null ? String(rgba) : '';
    if (rgbaStr && rgbaStr.includes(',')) {
      const parts = rgbaStr.split(',').map(Number);
      r = parts[0]; g = parts[1]; b = parts[2];
      if (parts.length >= 4 && parts[3] < 1.0) { a = parts[3]; }
    } else {
      r = 0.7; g = 0.7; b = 0.7;
    }

    const matOpts = { color: new THREE.Color(r, g, b), flatShading: true };
    if (a < 1.0) {
      matOpts.transparent = true;
      matOpts.opacity = a;
      matOpts.side = THREE.DoubleSide;
    }
    const mat = new THREE.MeshPhongMaterial(matOpts);
    mat.userData.origOpacity = a;
    mat.userData.origSide = a < 1.0 ? THREE.DoubleSide : THREE.FrontSide;
    if (xrayOn) { mat.transparent = true; mat.opacity = 0.15; mat.side = THREE.DoubleSide; }
    const mesh = new THREE.Mesh(geo, mat);

    // IFC coords → Three.js
    const pos = ifc2three(cx, cy, cz);
    mesh.position.set(pos.x, pos.y, pos.z);

    // IFC Euler (XYZ, Z-up) → Three.js Euler (XYZ, Y-up)
    // Same axis swap as position: IFC(x,y,z) → Three(x,z,-y)
    // Rotation around IFC X-axis → Three X, IFC Y → Three -Z, IFC Z → Three Y
    const rx = rotX || 0, ry = rotY || 0, rz = rotZ || 0;
    if (rx || ry || rz) {
      mesh.rotation.set(rx, rz, -ry);
    }

    // Store GUID + storey for pick, storey filter, color toggle
    mesh.userData.storey = storey || '';
    mesh.userData.disc = disc || '';
    mesh.userData.guid = guid;
    guidMap[mesh.id] = guid;
    if (wireOn) { mat.wireframe = true; }
    // Apply storey filter if active
    if (activeStoreyFilter !== null && mesh.userData.storey !== activeStoreyFilter) {
      mesh.visible = false;
    }
    if (hiddenDiscs.size > 0 && hiddenDiscs.has(disc)) {
      mesh.visible = false;
    }

    scene.add(mesh);
    streamedCount++;
  }

  // Log proof for first batch
  if (streamIdx === 0) {
    let rotCount = 0, placedCount = 0, missCount = 0, matCount = 0;
    for (let i = 0; i < Math.min(batch, 5); i++) {
      const row = streamQueue[i];
      console.log(`[S200] §SAMPLE[${i}] rgba="${row[2]}" type=${typeof row[2]} disc=${row[3]}`);
    }
    for (let i = 0; i < batch; i++) {
      const row = streamQueue[i];
      const rx = row[7] || 0, ry = row[8] || 0, rz = row[9] || 0;
      if (rx || ry || rz) rotCount++;
      if (meshCache[row[1]]) placedCount++; else missCount++;
      const rgbaStr = row[2] != null ? String(row[2]) : '';
      if (rgbaStr && rgbaStr.includes(',')) matCount++;
    }
    console.log(`[S200] §PROOF first_batch=${batch} rotation=${rotCount} placed=${placedCount} miss=${missCount} with_material=${matCount}`);
  }

  streamIdx += batch;

  document.getElementById('s-streamed').textContent = streamedCount.toLocaleString();
  document.getElementById('s-meshes').textContent = Object.keys(meshCache).length.toLocaleString();
  // Progress bar
  if (activeBuildingTotal > 0) {
    document.getElementById('s-progress').style.width = Math.min(100, (streamIdx / streamQueue.length) * 100).toFixed(1) + '%';
  }
  // Show current element being rendered — the nerdy flicker
  const lastRow = streamQueue[streamIdx - 1];
  if (lastRow) {
    document.getElementById('s-current-element').textContent = lastRow[11] || '';
  }
}

// ── BLOB → Three.js BufferGeometry ──
function blobToGeometry(vBlob, fBlob) {
  try {
    const vArr = new Float32Array(vBlob.buffer, vBlob.byteOffset, vBlob.byteLength / 4);
    const fArr = new Uint32Array(fBlob.buffer, fBlob.byteOffset, fBlob.byteLength / 4);

    if (vArr.length < 9 || fArr.length < 3) return null;

    // Vertices are LOCAL to element centre (already recentred during extraction).
    // Swap IFC (x,y,z) → Three.js (x, z, -y) to match ifc2three() on positions.
    const positions = new Float32Array(vArr.length);
    for (let i = 0; i < vArr.length; i += 3) {
      positions[i]     = vArr[i];       // local X
      positions[i + 1] = vArr[i + 2];   // local Z → Three Y (height)
      positions[i + 2] = -vArr[i + 1];  // local Y → Three -Z
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setIndex(new THREE.BufferAttribute(fArr, 1));
    geo.computeVertexNormals();
    geo.computeBoundingSphere();
    return geo;
  } catch (e) {
    return null;
  }
}

// ── Click-to-identify (raycaster) ──
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let guidMap = {};  // mesh.id → guid
let pointerDownPos = { x: 0, y: 0 };

canvas.addEventListener('pointerdown', (e) => {
  pointerDownPos.x = e.clientX;
  pointerDownPos.y = e.clientY;
  // Stop fly-around on user interaction
  if (flyActive) {
    flyActive = false;
    document.getElementById('fly-btn').style.background = '#444';
    document.getElementById('fly-btn').style.color = '#fff';
  }
});

canvas.addEventListener('pointerup', (e) => {
  // Only pick if pointer didn't drag (< 5px movement)
  const dx = e.clientX - pointerDownPos.x;
  const dy = e.clientY - pointerDownPos.y;
  if (Math.sqrt(dx*dx + dy*dy) > 5) return;
  if (e.shiftKey || e.button !== 0) return;  // skip pan/right-click

  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  // City mode: check bbox wireframes first
  if (CITY_URL) {
    const bboxes = [];
    scene.traverse(obj => { if (obj.isLineSegments && obj.userData.building) bboxes.push(obj); });
    const bboxHits = raycaster.intersectObjects(bboxes, false);
    if (bboxHits.length > 0) {
      const bldName = bboxHits[0].object.userData.building;
      flyTo(bldName);
      return;
    }
  }

  if (!db) return;

  // Collect all meshes (not just direct children)
  const meshes = [];
  scene.traverse(obj => { if (obj.isMesh && obj !== ground && obj.visible) meshes.push(obj); });
  const hits = raycaster.intersectObjects(meshes, false);

  if (!hits.length) {
    document.getElementById('info-panel').style.display = 'none';
    return;
  }

  const hit = hits[0];
  const guid = guidMap[hit.object.id];
  if (!guid) {
    console.log(`§PICK no guid for mesh.id=${hit.object.id}`);
    return;
  }

  // Yellow highlight bbox on selected element — parented to mesh for correct transform
  if (window._pickHighlight) {
    window._pickHighlight.parent.remove(window._pickHighlight);
    window._pickHighlight = null;
  }
  hit.object.geometry.computeBoundingBox();
  const bb = hit.object.geometry.boundingBox;
  const size = new THREE.Vector3();
  bb.getSize(size);
  const center = new THREE.Vector3();
  bb.getCenter(center);
  const hlGeo = new THREE.BoxGeometry(size.x, size.y, size.z);
  const hlEdges = new THREE.EdgesGeometry(hlGeo);
  const hlLine = new THREE.LineSegments(hlEdges,
    new THREE.LineBasicMaterial({ color: 0xffff00 }));
  hlLine.position.copy(center);  // local offset within mesh
  hit.object.add(hlLine);        // child of mesh — inherits position + rotation
  window._pickHighlight = hlLine;

  try {
    const rows = db.exec(`
      SELECT m.ifc_class, m.element_name, m.guid, m.building, m.storey,
             m.discipline, m.material_rgba
      FROM elements_meta m WHERE m.guid = '${guid}'
    `);
    if (!rows.length || !rows[0].values.length) return;
    const [cls, name, g, bld, storey, disc, mat] = rows[0].values[0];
    document.getElementById('info-class').textContent = cls || '—';
    document.getElementById('info-name').textContent = name || '—';
    document.getElementById('info-guid').textContent = g || '—';
    document.getElementById('info-building').textContent = bld || '—';
    document.getElementById('info-storey').textContent = storey || '—';
    document.getElementById('info-disc').textContent = disc || '—';
    document.getElementById('info-material').textContent = mat || '—';
    document.getElementById('info-panel').style.display = 'block';
    populateStoreys(bld);
    populateDiscs(bld);
    console.log(`§PICK ${cls} "${name}" ${disc} ${storey}`);
  } catch (err) {
    console.log(`§PICK_ERR ${err.message}`);
  }
});

// ── Storey isolator ──
let activeStoreyFilter = null;
let storeyMeshGroups = {};  // storey → [mesh.id, ...]

function populateStoreys(building) {
  if (!db || !building) return;
  const rows = db.exec(`
    SELECT DISTINCT storey FROM elements_meta
    WHERE building = '${building}' AND storey IS NOT NULL
    ORDER BY storey
  `);
  const panel = document.getElementById('storey-panel');
  const body = document.getElementById('storey-body');
  if (!rows.length || !rows[0].values.length) { panel.style.display = 'none'; return; }

  const storeys = rows[0].values.map(r => r[0]);
  body.innerHTML = `<button class="${activeStoreyFilter === null ? 'active' : ''}"
    onclick="filterStorey(null)" style="margin-top:4px">All Storeys</button>` +
    storeys.map(s => `<button class="${activeStoreyFilter === s ? 'active' : ''}"
      onclick="filterStorey('${s}')">${s}</button>`).join('');
  panel.style.display = 'block';
}

function filterStorey(storey) {
  activeStoreyFilter = storey;
  scene.traverse(obj => {
    if (obj.isMesh && obj !== ground && obj.userData.storey !== undefined) {
      obj.visible = storey === null || obj.userData.storey === storey;
    }
  });
  // Update button states
  document.querySelectorAll('#storey-body button').forEach(btn => {
    const btnStorey = btn.onclick.toString().match(/filterStorey\('(.+?)'\)/)?.[1] || null;
    btn.className = (btnStorey === storey || (storey === null && !btn.onclick.toString().includes("'"))) ? 'active' : '';
  });
  console.log(`[S200] §STOREY_FILTER ${storey || 'ALL'}`);
}

// ── Discipline toggle ──
let hiddenDiscs = new Set();

function populateDiscs(building) {
  if (!db || !building) return;
  const rows = db.exec(`
    SELECT discipline, COUNT(*) FROM elements_meta
    WHERE building = '${building}' AND discipline IS NOT NULL
    GROUP BY discipline ORDER BY COUNT(*) DESC
  `);
  const panel = document.getElementById('disc-panel');
  const body = document.getElementById('disc-body');
  if (!rows.length || !rows[0].values.length) { panel.style.display = 'none'; return; }

  body.innerHTML = rows[0].values.map(([d, cnt]) => {
    const hex = '#' + (DISC_COLORS[d] || DEFAULT_COLOR).toString(16).padStart(6, '0');
    const on = !hiddenDiscs.has(d);
    return `<button class="${on ? 'active' : ''}" onclick="toggleDisc('${d}')" style="margin-top:2px">
      <span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${hex};margin-right:4px"></span>
      ${d} <span style="color:#888;font-size:10px">${cnt.toLocaleString()}</span></button>`;
  }).join('');
  panel.style.display = 'block';
}

function toggleDisc(disc) {
  if (hiddenDiscs.has(disc)) {
    hiddenDiscs.delete(disc);
  } else {
    hiddenDiscs.add(disc);
  }
  scene.traverse(obj => {
    if (obj.isMesh && obj !== ground && obj.userData.disc) {
      const discVisible = !hiddenDiscs.has(obj.userData.disc);

let hoverHighlight = null;

let lastHoverTime = 0;
function onMouseMove(e) {
  // Throttle to every 100ms
  const now = performance.now();
  if (now - lastHoverTime < 100) return;
  lastHoverTime = now;

  hoverMouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  hoverMouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(hoverMouse, camera);

  const meshes = [];
  scene.traverse(obj => { if (obj.isMesh && obj !== ground && obj.visible) meshes.push(obj); });
  const hits = raycaster.intersectObjects(meshes, false);

  if (hoverHighlight) {
    hoverHighlight.material.emissive.setHex(0x000000);
    hoverHighlight = null;
  }

  if (hits.length > 0 && guidMap[hits[0].object.id]) {
    hoverHighlight = hits[0].object;
    hoverHighlight.material.emissive.setHex(0x222222);
    canvas.style.cursor = 'pointer';
  } else {
    canvas.style.cursor = 'default';
  }
}

// ── Fly around rendered buildings ──
let flyActive = false;
let flyAngle = 0;
let flyTargets = [];  // [{x,y,z,radius,name}]
let flyTargetIdx = 0;
let flyTransitioning = false;
let flyTransitionStart = 0;
let flyFromPos = null;
let flyFromTarget = null;

function toggleFlyAround() {
  flyActive = !flyActive;
  const btn = document.getElementById('fly-btn');
  btn.style.background = flyActive ? '#4fc3f7' : '#444';
  btn.style.color = flyActive ? '#000' : '#fff';

  if (flyActive) {
    // Collect rendered buildings — use actual envelope for orbit radius
    flyTargets = [];
    for (const name of buildingsRendered) {
      const bc = buildingCentres[name];
      if (!bc) continue;
      const t = ifc2three(bc.ix, bc.iy, bc.iz);
      // Use envelope if available, otherwise estimate
      const radius = Math.max(80, (bc.envelope || Math.sqrt(bc.count) * 2) * 1.2);
      flyTargets.push({ x: t.x, y: t.y, z: t.z, radius, name });
    }
    if (flyTargets.length === 0) { flyActive = false; btn.style.background = '#444'; btn.style.color = '#fff'; return; }
    flyTargetIdx = 0;
    flyAngle = 0;
    flyTransitioning = false;
    status.textContent = `Flying around ${flyTargets[0].name}...`;
  } else {
    status.textContent = 'Fly stopped.';
  }
}

function flyTick() {
  if (!flyActive || flyTargets.length === 0) return;

  const ft = flyTargets[flyTargetIdx];

  if (flyTransitioning) {
    // Smooth transition between buildings
    const elapsed = (performance.now() - flyTransitionStart) / 1500;  // 1.5s transition
    if (elapsed >= 1.0) {
      flyTransitioning = false;
      // Set flyAngle to match where the transition landed so no jump
      flyAngle = Math.atan2(camera.position.z - ft.z, camera.position.x - ft.x);
      status.textContent = `Flying around ${ft.name}...`;
    } else {
      // Lerp camera and target
      const t = elapsed * elapsed * (3 - 2 * elapsed);  // smoothstep
      camera.position.lerpVectors(flyFromPos, new THREE.Vector3(
        ft.x + ft.radius, ft.y + ft.radius * 0.6, ft.z + ft.radius
      ), t);
      controls.target.lerpVectors(flyFromTarget, new THREE.Vector3(ft.x, ft.y, ft.z), t);
      controls.update();
    }
    return;
  }

  // Orbit around current building
  flyAngle += 0.012;  // ~0.7 deg per frame, ~9s per orbit
  const camX = ft.x + Math.cos(flyAngle) * ft.radius;
  const camZ = ft.z + Math.sin(flyAngle) * ft.radius;
  const camY = ft.y + ft.radius * 0.6;
  camera.position.set(camX, camY, camZ);
  controls.target.set(ft.x, ft.y, ft.z);
  controls.update();

  // After one full orbit, move to next building
  if (flyAngle >= Math.PI * 2) {
    flyAngle = 0;
    if (flyTargets.length > 1) {
      flyFromPos = camera.position.clone();
      flyFromTarget = controls.target.clone();
      flyTargetIdx = (flyTargetIdx + 1) % flyTargets.length;
      flyTransitioning = true;
      flyTransitionStart = performance.now();
      status.textContent = `Flying to ${flyTargets[flyTargetIdx].name}...`;
    }
  }
}

// ── City mode: lightweight index → bboxes → on-demand building download ──
let cityDb = null;
let citySQL = null;
let cityArchetypes = {};   // archetype → { db, lib } filenames
let cityBuildingDbs = {};  // building name → { db, libDb } sql.js instances

async function initCity(SQL) {
  citySQL = SQL;
  status.textContent = `Fetching city index (${CITY_URL})...`;
  const buf = await cachedFetch(CITY_URL);
  cityDb = new SQL.Database(new Uint8Array(buf));
  console.log(`[S203] §CITY_INDEX size=${(buf.byteLength/1024).toFixed(0)}KB`);

  // Build archetype → filename mapping
  const archRows = cityDb.exec(`SELECT DISTINCT archetype FROM building_archetype`);
  if (archRows.length > 0) {
    for (const row of archRows[0].values) {
      const arch = row[0];
      cityArchetypes[arch] = {
        db: `${arch}_extracted.db`,
        lib: `${arch}_library.db`,
      };
    }
  }

  // Build building centres from summary (grouped by building, all disciplines)
  const rows = cityDb.exec(`
    SELECT building, SUM(element_count),
      AVG(center_x), AVG(center_y), AVG(center_z)
    FROM building_summary
    WHERE discipline IN ('ARC','STR')
    GROUP BY building
  `);
  if (rows.length > 0) {
    for (const row of rows[0].values) {
      buildingCentres[row[0]] = { ix: row[2], iy: row[3], iz: row[4], count: row[1] };
    }
  }
  // Fallback: buildings with no ARC/STR (use all disciplines)
  const allRows = cityDb.exec(`
    SELECT building, SUM(element_count),
      AVG(center_x), AVG(center_y), AVG(center_z)
    FROM building_summary
    GROUP BY building
  `);
  if (allRows.length > 0) {
    for (const row of allRows[0].values) {
      if (!buildingCentres[row[0]]) {
        buildingCentres[row[0]] = { ix: row[2], iy: row[3], iz: row[4], count: row[1] };
      }
    }
  }

  // Total elements
  const te = cityDb.exec(`SELECT SUM(total_elements) FROM building_archetype`);
  totalElements = te[0]?.values[0][0] || 0;

  // Discipline counts
  const dc = cityDb.exec(`SELECT discipline, SUM(element_count) FROM building_summary GROUP BY discipline ORDER BY SUM(element_count) DESC`);
  if (dc.length > 0) {
    for (const r of dc[0].values) { discCounts[r[0]] = r[1]; }
  }

  // Model offset
  const allIX = Object.values(buildingCentres).map(b => b.ix);
  const allIY = Object.values(buildingCentres).map(b => b.iy);
  const allIZ = Object.values(buildingCentres).map(b => b.iz);
  if (allIX.length) {
    modelOffset.x = (Math.min(...allIX) + Math.max(...allIX)) / 2;
    modelOffset.y = (Math.min(...allIY) + Math.max(...allIY)) / 2;
    modelOffset.z = (Math.min(...allIZ) + Math.max(...allIZ)) / 2;
  }

  // Ground plane
  const zRange = cityDb.exec(`SELECT MIN(min_z), MAX(max_z) FROM building_summary`);
  if (zRange.length > 0) {
    const groundY = (zRange[0].values[0][0] - modelOffset.z) - 2;
    ground.position.y = groundY;
    ground.visible = true;
  }

  updateHUD();
  populateBuildingList();

  // Draw bboxes from index
  const bboxRows = cityDb.exec(`
    SELECT building, discipline,
      min_x, min_y, min_z, max_x, max_y, max_z
    FROM building_summary
  `);
  if (bboxRows.length > 0) {
    for (const row of bboxRows[0].values) {
      const [bld, disc, minX, minY, minZ, maxX, maxY, maxZ] = row;
      const color = DISC_COLORS[disc] || DEFAULT_COLOR;
      const c = ifc2three((minX+maxX)/2, (minY+maxY)/2, (minZ+maxZ)/2);
      const sx = maxX - minX;
      const sy = maxZ - minZ;
      const sz = maxY - minY;
      if (sx < 0.1 || sy < 0.1 || sz < 0.1) continue;
      const geo = new THREE.BoxGeometry(sx, sy, sz);
      const edges = new THREE.EdgesGeometry(geo);
      const line = new THREE.LineSegments(edges,
        new THREE.LineBasicMaterial({ color, opacity: 0.6, transparent: true }));
      line.position.set(c.x, c.y, c.z);
      line.userData = { building: bld, discipline: disc };
      scene.add(line);
    }
  }

  document.getElementById('s-buildings').textContent =
    Object.keys(buildingCentres).length.toLocaleString();
  document.getElementById('s-elements').textContent = totalElements.toLocaleString();

  // Camera — overview of whole city
  const extentX = allIX.length ? Math.max(...allIX) - Math.min(...allIX) : 500;
  const extentY = allIY.length ? Math.max(...allIY) - Math.min(...allIY) : 500;
  const dist = Math.max(extentX, extentY) * 0.6;
  camera.position.set(dist * 0.3, dist * 0.5, dist * 0.4);
  camera.far = Math.max(10000, dist * 3);
  camera.updateProjectionMatrix();
  controls.target.set(0, 10, 0);
  controls.update();

  console.log(`[S203] §CITY_READY buildings=${Object.keys(buildingCentres).length} archetypes=${Object.keys(cityArchetypes).length} elements=${totalElements}`);
  status.textContent = `CITY MODE — ${Object.keys(buildingCentres).length} buildings, ${totalElements.toLocaleString()} elements. Click a building to load.`;
}

// Override flyTo for city mode — download per-building DB on demand
const _origFlyTo = flyTo;
flyTo = function(buildingName) {
  // Fly camera to building
  const bc = buildingCentres[buildingName];
  if (!bc) return;
  const t = ifc2three(bc.ix, bc.iy, bc.iz);
  const dist = Math.max(50, Math.sqrt(bc.count) * 1.5);
  camera.position.set(t.x + dist * 0.7, t.y + dist * 1.0, t.z + dist * 0.7);
  controls.target.set(t.x, t.y, t.z);
  camera.far = Math.max(5000, dist * 10);
  camera.updateProjectionMatrix();
  controls.update();

  if (!CITY_URL) {
    // Normal mode — stream from already-loaded DB
    document.getElementById('s-active').style.color = '#4fc3f7';
    document.getElementById('s-progress').style.width = '0%';
    document.getElementById('s-progress').style.background = '#4fc3f7';
    status.textContent = `Flew to ${buildingName} (${bc.count} elements)`;
    if (libDb) streamBuilding(buildingName);
    return;
  }

  // City mode — download building's per-building DB on demand
  if (buildingsRendered.has(buildingName)) {
    status.textContent = `${buildingName} already loaded (${bc.count} elements)`;
    return;
  }
  cityLoadBuilding(buildingName);
};

async function cityLoadBuilding(buildingName) {
  // Find archetype for this building
  const archRow = cityDb.exec(`SELECT archetype FROM building_archetype WHERE building = '${buildingName}'`);
  if (!archRow.length) { status.textContent = `Unknown building: ${buildingName}`; return; }
  const archetype = archRow[0].values[0][0];
  const files = cityArchetypes[archetype];
  if (!files) { status.textContent = `No DB for archetype: ${archetype}`; return; }

  // Check if we already downloaded this archetype's DBs
  if (!cityBuildingDbs[archetype]) {
    status.textContent = `Downloading ${archetype}...`;
    const extUrl = BLD_BASE + files.db;
    const libUrl = BLD_BASE + files.lib;

    const [extBuf, libBuf] = await Promise.all([
      cachedFetch(extUrl),
      cachedFetch(libUrl),
    ]);

    const extDb = new citySQL.Database(new Uint8Array(extBuf));
    const libDb2 = new citySQL.Database(new Uint8Array(libBuf));
    cityBuildingDbs[archetype] = { db: extDb, libDb: libDb2 };
    console.log(`[S203] §CITY_DL archetype=${archetype} ext=${(extBuf.byteLength/1024/1024).toFixed(1)}MB lib=${(libBuf.byteLength/1024/1024).toFixed(1)}MB`);
    status.textContent = `Downloaded ${archetype}. Streaming ${buildingName}...`;
  }

  // Swap db/libDb to this archetype's DBs, then stream
  const saved = { db, libDb };
  db = cityBuildingDbs[archetype].db;
  libDb = cityBuildingDbs[archetype].libDb;

  // The per-building DB has the archetype's T0_/S0_ building name,
  // but we need elements for THIS specific building.
  // The per-building DB only has one building — remap the query.
  // Get the building name that's actually in this DB
  const bldInDb = db.exec(`SELECT DISTINCT building FROM elements_meta`);
  const dbBldName = bldInDb.length > 0 ? bldInDb[0].values[0][0] : buildingName;

  // Query elements from archetype DB but apply transforms from city index
  // Actually — the per-building DB has ONE copy (T0_ or S0_).
  // For city copies at different positions, we need to offset.
  // Get the centre of the archetype's copy in the DB
  const arcCentre = db.exec(`SELECT AVG(center_x), AVG(center_y), AVG(center_z) FROM element_transforms`);
  const arcX = arcCentre[0].values[0][0];
  const arcY = arcCentre[0].values[0][1];
  const arcZ = arcCentre[0].values[0][2];

  // Get the centre of the target building from city index
  const bc = buildingCentres[buildingName];
  const tgtX = bc.ix, tgtY = bc.iy, tgtZ = bc.iz;

  // Offset = target - archetype
  const offX = tgtX - arcX;
  const offY = tgtY - arcY;
  const offZ = tgtZ - arcZ;

  // Query elements from archetype DB
  const rows = db.exec(`
    SELECT m.guid, i.geometry_hash, m.material_rgba, m.discipline,
           t.center_x, t.center_y, t.center_z,
           t.rotation_x, t.rotation_y, t.rotation_z,
           m.storey, m.ifc_class
    FROM elements_meta m
    JOIN element_instances i ON m.guid = i.guid
    JOIN element_transforms t ON t.guid = m.guid
    WHERE i.geometry_hash IS NOT NULL
      AND m.ifc_class != 'IfcOpeningElement'
  `);

  if (!rows.length) {
    status.textContent = `No streamable elements for ${buildingName}`;
    db = saved.db; libDb = saved.libDb;
    return;
  }

  // Apply position offset to each element
  const offsetRows = rows[0].values.map(row => {
    const r = [...row];
    r[4] += offX;  // center_x
    r[5] += offY;  // center_y
    r[6] += offZ;  // center_z
    return r;
  });

  // Feed into existing streaming pipeline
  streamQueue = offsetRows;
  streamIdx = 0;
  streaming = true;
  activeBuilding = buildingName;
  activeBuildingTotal = streamQueue.length;
  document.getElementById('s-active').textContent = buildingName;
  document.getElementById('s-active').style.color = '#4fc3f7';
  document.getElementById('s-building-total').textContent = activeBuildingTotal.toLocaleString();
  document.getElementById('s-progress').style.width = '0%';
  document.getElementById('s-progress').style.background = '#4fc3f7';
  status.textContent = `STREAMING ${buildingName} — 0/${streamQueue.length.toLocaleString()} elements`;

  // Restore saved db/libDb references (streaming will use meshCache which was populated from archetype libDb)
  // But we need libDb to stay pointed at archetype's lib for BLOB lookups during streaming
  db = saved.db;
  // Keep libDb pointing to archetype's library for this stream
  libDb = cityBuildingDbs[archetype].libDb;
}

// ── Go ──
animate();
init().catch(e => {
  status.textContent = `Error: ${e.message}`;
  console.error(`[S192] §INIT_ERROR`, e);
});
// ── Expose functions to HTML onclick handlers ──
window.togglePanel = togglePanel;
window.clearStreamed = clearStreamed;
window.toggleXray = toggleXray;
window.screenshot = screenshot;
window.toggleFullscreen = toggleFullscreen;
window.toggleTheme = toggleTheme;
window.toggleFlyAround = toggleFlyAround;
window.filterStorey = filterStorey;
window.toggleDisc = toggleDisc;
window.export4D5D = export4D5D;
window.flyTo = flyTo;
} // end initViewer
</script>
