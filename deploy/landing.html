<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1a2e">
<title>BIM OOTB — Frictionless BIM</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e; color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
  }
  .header {
    text-align: center; padding: 30px 20px 10px;
  }
  .header h1 {
    font-size: 28px; color: #4fc3f7; margin-bottom: 4px;
    letter-spacing: 1px;
  }
  .header .tagline {
    font-size: 14px; color: #888; font-style: italic;
  }
  .stats-bar {
    display: flex; justify-content: center; gap: 30px;
    padding: 12px 20px; font-size: 13px; color: #aaa;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .stats-bar b { color: #4fc3f7; }

  /* Loading overlay */
  .loading {
    text-align: center; padding: 60px 20px;
  }
  .loading .spinner {
    display: inline-block; width: 30px; height: 30px;
    border: 3px solid #333; border-top-color: #4fc3f7;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading .elapsed { color: #666; font-size: 12px; margin-top: 8px; }

  /* Building grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px; padding: 16px 20px;
    max-width: 1200px; margin: 0 auto;
  }
  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px; padding: 14px 16px;
    cursor: pointer; transition: all 0.15s;
  }
  .card:hover {
    background: rgba(79,195,247,0.08);
    border-color: rgba(79,195,247,0.3);
    transform: translateY(-1px);
  }
  .card .name { font-size: 15px; font-weight: 600; color: #e0e0e0; margin-bottom: 6px; }
  .card .meta { font-size: 12px; color: #888; line-height: 1.6; }
  .card .meta b { color: #ccc; }
  .card .instances {
    display: inline-block; background: #4fc3f7; color: #000;
    font-size: 11px; font-weight: 700; padding: 1px 6px;
    border-radius: 3px; margin-left: 6px;
  }
  .card .disc-bars { margin-top: 6px; }
  .card .disc-bar {
    display: inline-block; height: 6px; border-radius: 2px;
    margin-right: 1px; min-width: 3px;
  }
  .card .open-btn {
    display: block; width: 100%; margin-top: 10px;
    padding: 6px; background: rgba(79,195,247,0.15);
    border: 1px solid rgba(79,195,247,0.3);
    border-radius: 4px; color: #4fc3f7;
    font-size: 12px; font-weight: 600; cursor: pointer;
    transition: background 0.15s;
  }
  .card .open-btn:hover { background: rgba(79,195,247,0.3); }

  /* Open tabs tracker */
  .tabs-panel {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
    border-top: 1px solid rgba(255,255,255,0.1);
    padding: 8px 20px; display: none; z-index: 100;
  }
  .tabs-panel .tab-label { font-size: 11px; color: #666; margin-bottom: 4px; }
  .tabs-panel .tab-list { display: flex; gap: 8px; overflow-x: auto; }
  .tabs-panel .tab-item {
    padding: 4px 12px; background: rgba(79,195,247,0.15);
    border: 1px solid rgba(79,195,247,0.3); border-radius: 4px;
    color: #4fc3f7; font-size: 12px; cursor: pointer;
    white-space: nowrap; flex-shrink: 0;
  }
  .tabs-panel .tab-item:hover { background: rgba(79,195,247,0.3); }

  /* Section headers */
  .section-header {
    padding: 16px 20px 4px; max-width: 1200px; margin: 0 auto;
    font-size: 13px; color: #666; text-transform: uppercase;
    letter-spacing: 1px; border-top: 1px solid rgba(255,255,255,0.04);
  }

  /* Footer */
  .footer {
    text-align: center; padding: 20px; font-size: 11px; color: #444;
    padding-bottom: 60px; /* space for tabs panel */
  }
  .footer a { color: #4fc3f7; text-decoration: none; }

  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px; }
    .card { padding: 10px 12px; }
    .card .name { font-size: 13px; }
    .header h1 { font-size: 22px; }
    .stats-bar { gap: 15px; font-size: 12px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>BIM OOTB</h1>
  <div class="tagline">Frictionless BIM. Two DBs. One browser. Zero install.</div>
</div>

<div class="stats-bar" id="stats-bar">
  <span>Loading...</span>
</div>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div style="margin-top:12px; color:#aaa">Loading building manifest...</div>
  <div class="elapsed" id="elapsed">0:00</div>
</div>

<div id="content" style="display:none">
  <div class="section-header" id="instant-header">Instant Load (per-building DB)</div>
  <div class="grid" id="instant-grid"></div>
  <div class="section-header" id="large-header" style="color:#cc8844">Larger Buildings — SPEED ISSUES STILL SOLVING (httpvfs)</div>
  <div class="grid" id="large-grid"></div>
</div>

<div class="footer">
  <a href="https://red1oon.github.io/BIMCompiler/BIM_Designer_Browser/" target="_blank">Documentation</a>
  &nbsp;&middot;&nbsp;
  <a href="https://github.com/red1oon/BIMCompiler" target="_blank">GitHub</a>
  &nbsp;&middot;&nbsp;
  BIM OOTB &mdash; FOSS &middot; No account &middot; No vendor lock-in
</div>

<div class="tabs-panel" id="tabs-panel">
  <div class="tab-label">Open Tabs</div>
  <div class="tab-list" id="tab-list"></div>
</div>

<script>
// ── Config ──
const _ociMatch = location.href.match(/(https:\/\/objectstorage\.[^/]+\/n\/[^/]+\/b\/[^/]+\/o\/)/);
const _base = _ociMatch ? _ociMatch[1] : '';

// Detect: local = full download viewer, remote = httpvfs streaming viewer
const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
const viewerFile = isLocal ? 'rtree_browser_demo.html' : 'rtree_streaming.html';
const viewerBase = _base || '';

const DISC_COLORS = {
  ARC: '#4488ff', STR: '#44cccc', MEP: '#44cc44',
  ELEC: '#cccc44', FP: '#cc8844', ACMV: '#cc4444',
  PLB: '#8844cc', HEAT: '#ff6644', HVAC: '#44aacc',
};

// ── Timer ──
const loadStart = performance.now();
const elapsedEl = document.getElementById('elapsed');
const timerInterval = setInterval(() => {
  const s = Math.floor((performance.now() - loadStart) / 1000);
  elapsedEl.textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}, 1000);

// ── Open tab tracking ──
const openTabs = {};  // name → window reference

function trackTab(name, type, win) {
  const key = name + '_' + type;
  openTabs[key] = { name, type, win };
  renderTabs();
}

function renderTabs() {
  const panel = document.getElementById('tabs-panel');
  const list = document.getElementById('tab-list');
  // Clean closed tabs
  for (const [key, tab] of Object.entries(openTabs)) {
    if (tab.win && tab.win.closed) delete openTabs[key];
  }
  const entries = Object.values(openTabs);
  if (entries.length === 0) { panel.style.display = 'none'; return; }
  panel.style.display = 'block';
  list.innerHTML = entries.map(tab => {
    const label = tab.type === '3D' ? tab.name : `${tab.name} ${tab.type}`;
    return `<div class="tab-item" onclick="openTabs['${tab.name}_${tab.type}'].win.focus()">${label}</div>`;
  }).join('');
}
// Poll for closed tabs
setInterval(renderTabs, 3000);

// Per-building DBs available (extracted, instant load)
const SMALL_BUILDINGS = {
  'SampleHouse': { db: 'SampleHouse_extracted.db', lib: 'SampleHouse_library.db' },
  'BimWhale_Tall': { db: 'BimWhale_Tall_extracted.db', lib: 'BimWhale_Tall_library.db' },
  'AC90_Jasmin': { db: 'AC90_Jasmin_extracted.db', lib: 'AC90_Jasmin_library.db' },
  'FZKHaus': { db: 'FZKHaus_extracted.db', lib: 'FZKHaus_library.db' },
  'AC90_Niedriha': { db: 'AC90_Niedriha_extracted.db', lib: 'AC90_Niedriha_library.db' },
  'BimWhale_Basic': { db: 'BimWhale_Basic_extracted.db', lib: 'BimWhale_Basic_library.db' },
  'VogelGesamt': { db: 'VogelGesamt_extracted.db', lib: 'VogelGesamt_library.db' },
  'BimWhale_Large': { db: 'BimWhale_Large_extracted.db', lib: 'BimWhale_Large_library.db' },
  'AC9_HausGH': { db: 'AC9_HausGH_extracted.db', lib: 'AC9_HausGH_library.db' },
  'HospitalAuckland': { db: 'HospitalAuckland_extracted.db', lib: 'HospitalAuckland_library.db' },
  'SmileyWest': { db: 'SmileyWest_extracted.db', lib: 'SmileyWest_library.db' },
  'Jesse': { db: 'Jesse_extracted.db', lib: 'Jesse_library.db' },
  'AC11Institute': { db: 'AC11Institute_extracted.db', lib: 'AC11Institute_library.db' },
  'Duplex': { db: 'Duplex_extracted.db', lib: 'Duplex_library.db' },
};

function openViewer(archName, repBuilding) {
  const small = SMALL_BUILDINGS[archName];
  let url;
  if (small) {
    // Per-building DB — use full-download viewer (fast, <3MB)
    const bldBase = _base ? _base + 'buildings/' : 'buildings/';
    const viewerUrl = _base ? _base + 'rtree_browser_demo.html' : 'rtree_browser_demo.html';
    url = viewerUrl + `?db=${bldBase}${small.db}&lib=${bldBase}${small.lib}`;
  } else {
    // Large building — use httpvfs streaming viewer on sandbox
    const dbParam = _base ? _base + 'sandbox_1M_extracted.db' : 'sandbox_1M_extracted.db';
    const libParam = _base ? _base + 'component_library.db' : 'component_library.db';
    url = (_base || '') + 'rtree_streaming.html' + `?db=${dbParam}&lib=${libParam}&bld=${repBuilding}`;
  }
  const win = window.open(url, 'bim_' + archName);
  trackTab(archName, '3D', win);
}

// ── Build cards ──
function buildCard(arch, container) {
  const card = document.createElement('div');
  card.className = 'card';

  const discBars = Object.entries(arch.disciplines || {}).map(([d, c]) => {
    const color = DISC_COLORS[d] || '#888';
    const pct = (c / arch.count) * 100;
    return `<span class="disc-bar" style="background:${color};width:${Math.max(pct * 1.5, 3)}px" title="${d}: ${c.toLocaleString()}"></span>`;
  }).join('');

  const instancesBadge = arch.instances > 1
    ? `<span class="instances">&times;${arch.instances}</span>`
    : '';

  card.innerHTML = `
    <div class="name">${arch.name}${instancesBadge}</div>
    <div class="meta">
      <b>${arch.count.toLocaleString()}</b> elements<br>
      ${Object.keys(arch.disciplines || {}).join(' &middot; ')}
    </div>
    <div class="disc-bars">${discBars}</div>
    <button class="open-btn" onclick="event.stopPropagation(); openViewer('${arch.name}', '${arch.representative}')">Open 3D Viewer${SMALL_BUILDINGS[arch.name] ? ' &#9889;' : ''}</button>
  `;
  card.addEventListener('click', () => openViewer(arch.name, arch.representative));
  container.appendChild(card);
}

// ── Load manifest ──
async function loadManifest() {
  try {
    const url = (_base || '') + 'manifest.json';
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`${resp.status}`);
    const data = await resp.json();

    clearInterval(timerInterval);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';

    // Stats bar
    document.getElementById('stats-bar').innerHTML = `
      <span><b>${data.archetype_count}</b> archetypes</span>
      <span><b>${data.building_count.toLocaleString()}</b> buildings</span>
      <span><b>${data.total_elements.toLocaleString()}</b> elements</span>
    `;

    // Split: instant (has per-building DB) vs large
    const instant = data.archetypes.filter(a => SMALL_BUILDINGS[a.name]);
    const large = data.archetypes.filter(a => !SMALL_BUILDINGS[a.name]);

    const instantGrid = document.getElementById('instant-grid');
    const largeGrid = document.getElementById('large-grid');

    // Sort instant by element count ascending (small first)
    instant.sort((a, b) => a.count - b.count);
    instant.forEach(a => buildCard(a, instantGrid));

    if (large.length > 0) {
      large.sort((a, b) => b.count - a.count);
      large.forEach(a => buildCard(a, largeGrid));
    } else {
      document.getElementById('large-header').style.display = 'none';
    }

  } catch (e) {
    clearInterval(timerInterval);
    document.getElementById('loading').innerHTML = `
      <div style="color:#ff6644">Failed to load manifest: ${e.message}</div>
      <div style="margin-top:10px; color:#888; font-size:13px">
        Make sure <code>manifest.json</code> is in the same folder as this page.
      </div>
    `;
  }
}

loadManifest();
</script>
</body>
</html>
