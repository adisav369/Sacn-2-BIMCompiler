# construction_manifest.yaml — Declarative construction registration
# ==========================================================================
# Single source of truth for construction project identity and structure.
# Covers buildings, bridges, landscapes — any IFC-sourced construction type.
# See docs/BOMBasedCompilation.md §10 for spec.
#
# Rules:
#   - Declare identity: names, roles, paths, prefix.
#   - Never declare derived values: counts, dimensions, AABB, offsets.
#   - Scripts import this file; they never duplicate its content.
# ==========================================================================

buildings:

  # --- EXTRACTED buildings (IFC reference source) ---

  Ifc4_SampleHouse:
    prefix: SH
    doc_type_id: RE_SH
    name: Sample House
    doc_sub_type: SH
    doc_base_type: RE
    description: "IFC4 Sample House — single-unit residential, 1-storey"
    provenance: EXTRACTED
    climate: SCAN
    expected_elements: 55       # TODO: derive from extraction (§10.3)
    output_path: DAGCompiler/lib/output/ifc4_sample_house.db
    reference_path: DAGCompiler/lib/input/Ifc4_SampleHouse_extracted.db
    building_bom_id: BUILDING_SH_STD
    seq_no: 10
    storeys:
      Ground Floor: { code: GF,   bom_category: GF, role: GROUND_FLOOR, seq: 1010 }
      Roof:         { code: ROOF, bom_category: RF, role: ROOF,         seq: 1020 }
      Unknown:      { code: CW,   bom_category: CW, role: CURTAIN_WALL, seq: 1030 }

  Ifc2x3_Duplex:
