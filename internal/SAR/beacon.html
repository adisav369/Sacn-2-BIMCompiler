<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAR Beacon</title>
    <script src="codes.js"></script>
    <script>if(typeof SAR_CODES==='undefined'){const s=document.createElement('script');s.src='https://objectstorage.ap-kulai-2.oraclecloud.com/n/ax3cp6tzwuy2/b/bim-ootb-dev/o/sar/codes.js';document.head.appendChild(s);}</script>
    <style>
        * { box-sizing: border-box; }
        body { background: #000; color: #0f0; font-family: monospace; padding: 0; margin: 0;
               min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

        .channel-bar { display: flex; }
        .ch-btn { flex: 1; padding: 10px; font-size: 13px; font-weight: bold; font-family: monospace;
                  border: none; cursor: pointer; text-align: center; }
        .ch-btn.air { background: #1a1a00; color: #666; }
        .ch-btn.water { background: #001a2a; color: #666; }
        .ch-btn.active.air { color: #ff0; border-bottom: 3px solid #ff0; }
        .ch-btn.active.water { color: #0af; border-bottom: 3px solid #0af; }

        /* REC banner */
        #recBanner { display: none; background: #040; border: 2px solid #0f0; padding: 10px;
                     font-size: 20px; font-weight: bold; color: #0f0; text-align: center; animation: recFlash 0.5s 3; }
        @keyframes recFlash { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

        .cat-tabs { display: flex; overflow-x: auto; background: #111; border-bottom: 1px solid #333; gap: 0; }
        .cat-tab { padding: 8px 10px; font-size: 10px; font-family: monospace; color: #555; background: transparent;
                   border: none; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
        .cat-tab.active { color: #0f0; border-bottom-color: #0f0; }

        .codes { flex: 1; overflow-y: auto; padding: 6px; display: grid; grid-template-columns: 1fr 1fr; gap: 5px; align-content: start; }
        .code-btn { padding: 10px 4px; font-size: 11px; font-weight: bold; font-family: monospace;
                    border: 2px solid; border-radius: 6px; cursor: pointer; text-align: center; }
        .code-btn:active { transform: scale(0.95); }
        .code-btn .hex { font-size: 9px; opacity: 0.5; }
        .code-btn.active { animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
        /* Full-width critical */
        .code-btn.sev4 { grid-column: 1 / -1; }

        #stopBtn { display: none; background: #400; color: #f44; border: 2px solid #f44; padding: 10px;
                   font-size: 14px; font-weight: bold; font-family: monospace; cursor: pointer; width: 100%; }

        .status-bar { background: #111; border-top: 1px solid #333; padding: 5px; font-size: 10px; color: #888; text-align: center; }
        .gps { font-size: 9px; color: #444; text-align: center; padding: 2px; }
    </style>
</head>
<body>
    <div class="channel-bar">
        <button class="ch-btn air active" id="chAir" onclick="setChannel('air')">AIR / RUBBLE</button>
        <button class="ch-btn water" id="chWater" onclick="setChannel('water')">UNDERWATER</button>
        <a href="https://bim-ootb.com" target="_blank" style="padding:10px 12px; font-size:16px; color:#555; text-decoration:none; background:#111; display:flex; align-items:center;">&#x22EE;</a>
    </div>
    <div id="recBanner">ACK RECEIVED</div>
    <div class="gps" id="gpsInfo">GPS: acquiring...</div>
    <div class="cat-tabs" id="catTabs"></div>
    <div class="codes" id="codeGrid"></div>
    <button id="stopBtn" onclick="stopBeacon()">STOP BEACON</button>
    <div class="status-bar">
        <div id="txStatus">Select a code</div>
        <div id="txDetail"></div>
    </div>

    <script>
        const CHANNELS = {
            air:   { freq0: 3000, freq1: 4500, sync: 2000, ackFreq: [2500, 3500, 5000], bitMs: 60, label: 'AIR' },
            water: { freq0: 800,  freq1: 1200, sync: 500,  ackFreq: [600, 900, 1100],   bitMs: 100, label: 'WATER' },
        };
        let channel = CHANNELS.air;
        let audioCtx = null, beaconRunning = false, beaconTimer = null, loopCount = 0;
        let gpsLat = null, gpsLon = null;
        let activeCategory = null;

        // ACK listener
        let ackCtx = null, ackAnalyser = null, ackData = null, ackTimer = null, micStream = null;

        function setChannel(ch) {
            channel = CHANNELS[ch];
            document.getElementById('chAir').className = 'ch-btn air' + (ch === 'air' ? ' active' : '');
            document.getElementById('chWater').className = 'ch-btn water' + (ch === 'water' ? ' active' : '');
            if (beaconRunning) stopBeacon();
        }

        // GPS
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                p => { gpsLat = p.coords.latitude.toFixed(6); gpsLon = p.coords.longitude.toFixed(6);
                       document.getElementById('gpsInfo').textContent = `GPS: ${gpsLat}, ${gpsLon}`;
                       document.getElementById('gpsInfo').style.color = '#0f0'; },
                e => { document.getElementById('gpsInfo').textContent = `GPS: ${e.message}`; },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
            );
        }

        // Build category tabs + code grid
        function buildUI() {
            const groups = sarGrouped();
            const cats = Object.keys(groups);
            const tabsEl = document.getElementById('catTabs');
            tabsEl.innerHTML = cats.map((cat, i) =>
                `<button class="cat-tab${i === 0 ? ' active' : ''}" onclick="showCategory('${cat}')">${cat}</button>`
            ).join('');
            activeCategory = cats[0];
            renderCodes();
        }

        function showCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.cat-tab').forEach(t =>
                t.classList.toggle('active', t.textContent === cat));
            renderCodes();
        }

        function renderCodes() {
            const groups = sarGrouped();
            const codes = groups[activeCategory] || [];
            const grid = document.getElementById('codeGrid');
            grid.innerHTML = codes.map(c => {
                const sev = SEV_COLOURS[c.severity] || SEV_COLOURS[0];
                const fullWidth = c.severity === 4 ? ' sev4' : '';
                return `<button class="code-btn${fullWidth}" style="background:${sev.bg}; color:${sev.fg}; border-color:${sev.border};"
                    onclick="transmit('${c.code}')">
                    ${c.short}<br><span class="hex">${c.code} ${sev.label}</span>
                </button>`;
            }).join('');
        }

        buildUI();

        // ========== TRANSMIT ==========
        function transmit(code3) {
            if (beaconRunning) stopBeacon();
            const code4 = sarEncode(code3);
            const entry = SAR_CODES[code3];

            // Packet: 4 hex digits as 16 bits + GPS nibbles
            const gps = (gpsLat && gpsLon) ? `${gpsLat},${gpsLon}` : '';
            // Encode code4 as binary (16 bits)
            const codeBits = parseInt(code4, 16).toString(2).padStart(16, '0').split('').map(Number);
            // Encode GPS as ASCII bits (if available)
            const gpsBits = [];
            for (let i = 0; i < gps.length; i++) {
                let bin = gps.charCodeAt(i).toString(2).padStart(8, '0');
                gpsBits.push(...bin.split('').map(Number));
            }
            // End marker
            const eot = [0,0,0,0,0,1,0,0];
            const allBits = [...codeBits, ...gpsBits, ...eot];

            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            beaconRunning = true; loopCount = 0;
            console.log(`§TX-START code=${code4} bits=${allBits.length} ch=${channel.label}`);

            document.getElementById('stopBtn').style.display = 'block';
            document.getElementById('codeGrid').style.opacity = '0.3';
            document.getElementById('codeGrid').style.pointerEvents = 'none';
            document.getElementById('txStatus').textContent = `TX: ${code4} ${entry ? entry.short : code3}`;
            document.getElementById('txStatus').style.color = '#f44';

            // Start listening for ACK
            startACKListener();

            function loop() {
                if (!beaconRunning) return;
                loopCount++;
                const t0 = audioCtx.currentTime + 0.05;
                const dur = channel.bitMs / 1000 * 0.85;
                const step = channel.bitMs / 1000;
                let fi = 0;

                // Preamble
                for (let i = 0; i < 6; i++) { tone(channel.sync * (i % 2 === 0 ? 1 : 1.5), t0 + fi * step, dur, 0.9); fi++; }
                fi += 2;
                // Data
                for (const b of allBits) { tone(b === 1 ? channel.freq1 : channel.freq0, t0 + fi * step, dur, 0.8); fi++; }
                // End chirps
                fi += 1;
                for (let i = 0; i < 3; i++) { tone(channel.sync, t0 + fi * step, dur * 0.5, 0.7); fi++; }

                const cycleSec = fi * step + 2.0;
                document.getElementById('txDetail').textContent = `#${loopCount} | ${code4} | ${allBits.length}b | ${cycleSec.toFixed(1)}s`;
                beaconTimer = setTimeout(loop, cycleSec * 1000);
            }
            loop();
        }

        function tone(freq, t, dur, vol) {
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.frequency.value = freq; o.type = 'sine';
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(vol, t + 0.003);
            g.gain.setValueAtTime(vol, t + dur - 0.003);
            g.gain.linearRampToValueAtTime(0, t + dur);
            o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + dur + 0.01);
        }

        function stopBeacon() {
            beaconRunning = false;
            if (beaconTimer) clearTimeout(beaconTimer);
            if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; }
            stopACKListener();
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('codeGrid').style.opacity = '1';
            document.getElementById('codeGrid').style.pointerEvents = 'auto';
            document.getElementById('txStatus').textContent = `Stopped (${loopCount} loops)`;
            document.getElementById('txStatus').style.color = '#888';
        }

        // ========== ACK LISTENER (runs while transmitting) ==========
        async function startACKListener() {
            try {
                micStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }, video: false });
                ackCtx = new (window.AudioContext || window.webkitAudioContext)();
                const src = ackCtx.createMediaStreamSource(micStream);
                ackAnalyser = ackCtx.createAnalyser();
                ackAnalyser.fftSize = 4096;
                ackAnalyser.smoothingTimeConstant = 0.3;
                src.connect(ackAnalyser);
                ackData = new Uint8Array(ackAnalyser.frequencyBinCount);
                ackTimer = setInterval(checkACK, 100);
            } catch (e) { /* mic not available — skip ACK listening */ }
        }

        function stopACKListener() {
            if (ackTimer) { clearInterval(ackTimer); ackTimer = null; }
            if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
            if (ackCtx) { ackCtx.close().catch(() => {}); ackCtx = null; }
        }

        let ackHitCount = 0;
        function checkACK() {
            if (!ackAnalyser) return;
            ackAnalyser.getByteFrequencyData(ackData);
            const binHz = ackCtx.sampleRate / ackAnalyser.fftSize;

            // ACK = 3 ascending frequencies played together
            const ackFreqs = channel.ackFreq;
            let hits = 0;
            for (const f of ackFreqs) {
                const bin = Math.round(f / binHz);
                let max = 0;
                for (let i = bin - 3; i <= bin + 3; i++)
                    if (i >= 0 && i < ackData.length && ackData[i] > max) max = ackData[i];
                if (max > 40) hits++;
            }

            if (hits >= 2) {
                ackHitCount++;
                if (ackHitCount >= 3) {
                    showREC();
                    ackHitCount = 0;
                }
            } else {
                ackHitCount = Math.max(0, ackHitCount - 1);
            }
        }

        function showREC() {
            console.log('§ACK-RECEIVED');
            const banner = document.getElementById('recBanner');
            banner.style.display = 'block';
            banner.textContent = 'ACK RECEIVED';
            // Vibrate
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            // Play confirmation beep
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const o = ctx.createOscillator(), g = ctx.createGain();
            o.frequency.value = 660; o.type = 'sine'; g.gain.value = 0.4;
            o.connect(g); g.connect(ctx.destination);
            o.start(); o.stop(ctx.currentTime + 0.3);
            setTimeout(() => ctx.close(), 500);
            // Auto-hide after 5s
            setTimeout(() => { banner.style.display = 'none'; }, 5000);
        }

        // ========== STANDBY RESILIENCE ==========
        let wakeLockSentinel = null;
        async function acquireWakeLock() {
            if (!navigator.wakeLock) return;
            try { wakeLockSentinel = await navigator.wakeLock.request('screen');
                  wakeLockSentinel.addEventListener('release', () => { wakeLockSentinel = null; });
                  console.log('§WAKELOCK acquired');
            } catch (e) { console.log('§WAKELOCK fail', e.message); }
        }
        acquireWakeLock();

        document.addEventListener('visibilitychange', () => {
            console.log(`§VISIBILITY state=${document.visibilityState} beaconRunning=${beaconRunning} audioCtx=${audioCtx ? audioCtx.state : 'null'}`);
            if (document.visibilityState === 'visible') {
                acquireWakeLock();
                if (audioCtx && audioCtx.state === 'suspended') {
                    console.log('§VISIBILITY resume suspended audioCtx');
                    audioCtx.resume();
                }
                if (ackCtx && ackCtx.state === 'suspended') ackCtx.resume();
            }
        });

        // Service Worker — offline cache
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    </script>
</body>
</html>
