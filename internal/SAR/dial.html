<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAR Dial</title>
    <script src="codes.js"></script>
    <script>if(typeof SAR_CODES==='undefined'){const s=document.createElement('script');s.src='https://objectstorage.ap-kulai-2.oraclecloud.com/n/ax3cp6tzwuy2/b/bim-ootb-dev/o/sar/codes.js';document.head.appendChild(s);}</script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #000; color: #0f0; font-family: monospace; overflow: hidden;
               min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
               touch-action: none; user-select: none; -webkit-user-select: none; }
        canvas { flex: 1; display: block; }
        /* TOP BAR: about + channel + flash message */
        #topBar { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center;
                  background: rgba(0,0,0,0.9); border-bottom: 1px solid #222; padding: 4px 8px;
                  pointer-events: auto; z-index: 5; height: 38px; }
        #btnAbout { color: #555; text-decoration: none; font-size: 22px; padding: 4px 8px; }
        #chIndicator { padding: 3px 10px; border-radius: 12px; font-size: 14px; font-weight: bold;
                       cursor: pointer; margin-left: 4px; }
        .ch-air { background: #330; color: #ff0; border: 1px solid #ff0; }
        .ch-water { background: #013; color: #0af; border: 1px solid #0af; }
        #topFlash { flex: 1; text-align: center; font-size: 16px; font-weight: bold; color: #fff;
                    min-height: 20px; transition: opacity 0.15s; overflow: hidden; white-space: nowrap;
                    margin: 0 8px; }
        #topLabel { font-size: 12px; color: #555; text-align: right; min-width: 50px; }
        /* BT/Sonar toggle — top right bulb */
        #btnTrx { min-width: 50px; height: 30px; border-radius: 15px; border: 2px solid #555;
                  background: #111; font-size: 12px; font-weight: bold; font-family: monospace;
                  cursor: pointer; display: flex; align-items: center; justify-content: center;
                  margin-left: 4px; transition: all 0.2s; gap: 4px; padding: 0 8px; }
        #btnTrx .dot { width: 10px; height: 10px; border-radius: 50%; }
        #btnTrx.bt { border-color: #48f; background: #004; color: #48f; }
        #btnTrx.bt .dot { background: #48f; }
        #btnTrx.sonar { border-color: #0f0; background: #020; color: #0f0; }
        #btnTrx.sonar .dot { background: #0f0; }
        #btnTrx.bt-active { animation: btPulse 1s infinite; }
        @keyframes btPulse { 0%,100% { box-shadow: 0 0 8px #48f; } 50% { box-shadow: 0 0 2px #48f; } }
        /* Flag chooser */
        #flagBar { display: none; position: absolute; top: 39px; left: 0; right: 0; z-index: 6;
                   background: rgba(0,0,0,0.95); border-bottom: 1px solid #333;
                   display: flex; justify-content: center; gap: 2px; padding: 4px; flex-wrap: wrap; }
        #flagBar.hidden { display: none; }
        .flag-btn { font-size: 20px; padding: 4px 6px; background: transparent; border: 2px solid transparent;
                    border-radius: 6px; cursor: pointer; }
        .flag-btn.active { border-color: #0f0; background: #020; }

        /* LIVE PREVIEW — above knobs */
        #preview { position: absolute; bottom: 90px; left: 0; right: 0; text-align: center;
                   pointer-events: none; z-index: 4; padding: 0 10px; }
        #hudShort { font-size: 32px; font-weight: bold; line-height: 1.1; text-shadow: 0 0 10px rgba(0,255,0,0.3); }
        #hudCode { font-size: 16px; letter-spacing: 3px; color: #555; margin-top: 2px; }
        #hudDetail { font-size: 16px; color: #666; margin-top: 2px; }
        #hudQueue { font-size: 13px; color: #48f; overflow: hidden; white-space: nowrap; margin-top: 3px; min-height: 10px; }
        #hudQueue .ticker { display: inline-block; }
        #hudQueue.scroll .ticker { animation: ticker 10s linear infinite; padding-left: 100%; }
        @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        /* BOTTOM KNOBS — 4 round buttons like a control panel */
        #knobBar { position: absolute; bottom: 10px; left: 0; right: 0; display: flex;
                   justify-content: space-evenly; align-items: center; pointer-events: auto; z-index: 5; padding: 0 8px; }
        .rknob { width: 64px; height: 64px; border-radius: 50%; font-size: 16px; font-weight: bold;
                 font-family: monospace; border: 3px solid; cursor: pointer; display: flex;
                 flex-direction: column; align-items: center; justify-content: center; gap: 1px;
                 transition: transform 0.1s; }
        .rknob:active { transform: scale(0.9); }
        .rknob .rlabel { font-size: 10px; font-weight: normal; opacity: 0.6; }
        #btnClear { background: #1a1200; color: #fa0; border-color: #fa0; }
        #btnSend  { background: #001a00; color: #0f0; border-color: #0f0; width: 72px; height: 72px; font-size: 18px; }
        #btnSend:active { background: #0f0; color: #000; }
        #btnGPS   { background: #001020; color: #0af; border-color: #0af; }
        #btnSOS   { background: #1a0000; color: #f44; border-color: #f44; }
        #btnSOS:active { background: #f44; color: #000; }
        #btnSOS.active { animation: sosPulse 0.5s infinite; }
        @keyframes sosPulse { 0%,100% { background: #f44; color: #000; } 50% { background: #1a0000; color: #f44; } }

        /* REC banner */
        #recBanner { display: none; position: absolute; top: 44px; left: 8%; right: 8%;
                     background: #040; border: 2px solid #0f0; padding: 10px; border-radius: 8px;
                     font-size: 16px; font-weight: bold; color: #0f0; text-align: center;
                     animation: recFlash 0.5s 3; pointer-events: none; z-index: 10; }
        @keyframes recFlash { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>
    <!-- TOP: about + channel + trx toggle + flash -->
    <div id="topBar">
        <a id="btnAbout" href="https://objectstorage.ap-kulai-2.oraclecloud.com/n/ax3cp6tzwuy2/b/bim-ootb-dev/o/index.html" target="_blank">&#x2302;</a>
        <div id="chIndicator" class="ch-air" onclick="toggleChannel()">AIR</div>
        <span id="flagCurrent" onclick="toggleFlagBar()" style="font-size:18px; cursor:pointer; margin-left:4px;">🇬🇧</span>
        <div id="topFlash"></div>
        <div id="topLabel">TAP TO START</div>
        <div id="btnTrx" class="sonar" onclick="toggleTrx()"><span class="dot"></span><span id="trxLabel">SND</span></div>
    </div>

    <!-- Flag chooser row -->
    <div id="flagBar" class="hidden"></div>

    <div id="recBanner">ACK RECEIVED</div>
    <canvas id="c"></canvas>

    <!-- LIVE PREVIEW -->
    <div id="preview">
        <div id="hudShort">---</div>
        <div id="hudCode"></div>
        <div id="hudDetail"></div>
        <div id="hudQueue"></div>
    </div>

    <!-- BOTTOM KNOBS — round, balanced -->
    <div id="knobBar">
        <button class="rknob" id="btnClear" onclick="clearQueue()">&#x1F6D1;<span class="rlabel">stop</span></button>
        <button class="rknob" id="btnSend" onclick="transmitQueue()">SEND<span class="rlabel">over</span></button>
        <button class="rknob" id="btnGPS" onclick="sendGPS()">&#x1F4CD;<span class="rlabel" id="gpsStatus">---</span></button>
        <button class="rknob" id="btnSOS" onclick="toggleSOS()">S.O.S<span class="rlabel">loop</span></button>
    </div>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');

        // State — 3-ring grammar
        let W, H, cx, cy, maxR;
        let ring1Angle = 0, ring2Angle = 0, ring3Angle = 0;
        let sel1 = 0, sel2 = 0, sel3 = 0;   // selected index per ring
        let r1Items = [], r2Items = [], r3Items = [];
        let queue = [];
        let channelMode = 'air';
        // Composed sentence codes (resolved from grammar)
        let composedCodes = [];

        function buildRings() {
            r1Items = sarGrammarRing1();
            sel1 = Math.min(sel1, r1Items.length - 1);
            updateRing2();
        }
        function updateRing2() {
            const key1 = r1Items[sel1]?.key;
            r2Items = key1 ? sarGrammarRing2(key1) : [];
            sel2 = 0; ring2Angle = 0;
            updateRing3();
        }
        function updateRing3() {
            const key1 = r1Items[sel1]?.key;
            const key2 = r2Items[sel2]?.key;
            r3Items = (key1 && key2) ? sarGrammarRing3(key1, key2) : [];
            sel3 = 0; ring3Angle = 0;
            resolveComposed();
        }
        function resolveComposed() {
            if (r3Items.length > 0 && r3Items[sel3]) {
                composedCodes = r3Items[sel3].codes;
            } else if (r2Items.length > 0 && r2Items[sel2]) {
                composedCodes = r2Items[sel2].codes;
            } else { composedCodes = []; }
            updateHUD();
        }
        buildRings();

        // Layout
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            cx = W / 2;
            cy = H / 2 - 30;
            maxR = W / 2 - 8; // fill phone width edge-to-edge (8px margin)
        }
        resize();
        window.addEventListener('resize', resize);

        // ========== DRAWING — 3 RINGS ==========
        function draw() {
            ctx.clearRect(0, 0, W, H);

            // Ring radii: outer=R1 (pattern), middle=R2 (context), inner=R3 (detail), centre=tap
            const R1out = maxR;
            const R1in  = maxR * 0.78;
            const R2out = R1in - 3;
            const R2in  = maxR * 0.50;
            const R3out = R2in - 3;
            const R3in  = maxR * 0.25;
            const centreR = R3in - 3;

            drawRing(r1Items, sel1, ring1Angle, R1out, R1in, (item) => item.label, (item) => item.colour, '#888');
            drawRing(r2Items, sel2, ring2Angle, R2out, R2in, (item) => item.key.replace(/_/g, ' '), () => '#0f0', '#555');
            if (r3Items.length > 0)
                drawRing(r3Items, sel3, ring3Angle, R3out, R3in, (item) => item.key.replace(/_/g, ' '), () => '#ff0', '#444');

            // Centre — tap to queue
            ctx.beginPath();
            ctx.arc(cx, cy, centreR, 0, Math.PI * 2);
            ctx.fillStyle = queue.length > 0 ? '#040' : '#111';
            ctx.fill();
            ctx.strokeStyle = '#0f0'; ctx.lineWidth = 2; ctx.stroke();

            // Centre text — composed sentence hex codes
            if (composedCodes.length > 0) {
                ctx.fillStyle = '#0f0';
                ctx.font = `bold ${centreR * 0.5}px monospace`;
                ctx.textAlign = 'center';
                ctx.fillText(composedCodes.join('+'), cx, cy + 4);
                if (queue.length > 0) {
                    ctx.font = `${centreR * 0.25}px monospace`;
                    ctx.fillStyle = '#48f';
                    ctx.fillText(`${queue.length} queued`, cx, cy + centreR * 0.5);
                }
            } else {
                ctx.fillStyle = '#333';
                ctx.font = `bold ${centreR * 0.4}px monospace`;
                ctx.textAlign = 'center';
                ctx.fillText('SPIN', cx, cy + 4);
            }

            // Selection indicator (top arrow)
            ctx.beginPath();
            ctx.moveTo(cx, cy - R1out - 4);
            ctx.lineTo(cx - 8, cy - R1out - 16);
            ctx.lineTo(cx + 8, cy - R1out - 16);
            ctx.closePath();
            ctx.fillStyle = '#0f0'; ctx.fill();

            requestAnimationFrame(draw);
        }

        function drawRing(items, selIdx, angle, rOut, rIn, labelFn, colourFn, dimColour) {
            const n = items.length;
            if (n === 0) return;
            const slice = (Math.PI * 2) / n;
            const bandW = rOut - rIn;
            for (let i = 0; i < n; i++) {
                const a0 = angle + i * slice - slice / 2;
                const a1 = a0 + slice;
                const isSel = i === selIdx;
                const col = colourFn(items[i]);

                ctx.beginPath();
                ctx.arc(cx, cy, rOut, a0, a1);
                ctx.arc(cx, cy, rIn, a1, a0, true);
                ctx.closePath();
                ctx.fillStyle = isSel ? col : shadeColor(col, -70);
                ctx.globalAlpha = isSel ? 0.9 : 0.3;
                ctx.fill();
                ctx.globalAlpha = 1;

                // Label — fill the space
                const mid = (a0 + a1) / 2;
                const lr = (rOut + rIn) / 2;
                const arcLen = slice * lr;
                const fontSize = Math.min(arcLen * 0.8, bandW * 0.55);
                if (fontSize < 5) continue;

                ctx.save();
                ctx.translate(cx + Math.cos(mid) * lr, cy + Math.sin(mid) * lr);
                ctx.rotate(mid + Math.PI / 2);
                ctx.fillStyle = isSel ? '#000' : dimColour;
                ctx.font = `${isSel ? 'bold ' : ''}${Math.max(8, fontSize)}px monospace`;
                ctx.textAlign = 'center';
                const text = labelFn(items[i]);
                const maxC = Math.max(3, Math.floor(bandW / (fontSize * 0.5)));
                ctx.fillText(text.length > maxC ? text.substring(0, maxC) : text, 0, 0);
                ctx.restore();
            }
        }

        draw();

        function shadeColor(hex, amt) {
            let r = parseInt(hex.slice(1, 3), 16) + amt;
            let g = parseInt(hex.slice(3, 5), 16) + amt;
            let b = parseInt(hex.slice(5, 7), 16) + amt;
            r = Math.max(0, Math.min(255, r));
            g = Math.max(0, Math.min(255, g));
            b = Math.max(0, Math.min(255, b));
            return `rgb(${r},${g},${b})`;
        }

        // ========== TOUCH — 3 RINGS ==========
        let touchStartAngle = null, touchRing = null, touchMoved = false;
        let touchStartR1 = 0, touchStartR2 = 0, touchStartR3 = 0;

        canvas.addEventListener('pointerdown', e => {
            const dx = e.clientX - cx, dy = e.clientY - cy;
            const dist = Math.sqrt(dx * dx + dy * dy);
            touchStartAngle = Math.atan2(dy, dx);
            touchMoved = false;

            const R1in = maxR * 0.78, R2in = maxR * 0.50, R3in = maxR * 0.25, cR = R3in - 3;
            if (dist < cR) { touchRing = 'centre'; }
            else if (dist < R3in) { touchRing = 'r3'; touchStartR3 = ring3Angle; }
            else if (dist < R2in) { touchRing = 'r2'; touchStartR2 = ring2Angle; }
            else { touchRing = 'r1'; touchStartR1 = ring1Angle; }
        });

        canvas.addEventListener('pointermove', e => {
            if (!touchRing || touchRing === 'centre') return;
            const dx = e.clientX - cx, dy = e.clientY - cy;
            const delta = Math.atan2(dy, dx) - touchStartAngle;
            touchMoved = true;

            if (touchRing === 'r1') {
                ring1Angle = touchStartR1 + delta;
                const newSel = snapToTop(r1Items.length, ring1Angle);
                if (newSel !== sel1) { sel1 = newSel; updateRing2(); }
            } else if (touchRing === 'r2') {
                ring2Angle = touchStartR2 + delta;
                const newSel = snapToTop(r2Items.length, ring2Angle);
                if (newSel !== sel2) { sel2 = newSel; updateRing3(); }
            } else if (touchRing === 'r3') {
                ring3Angle = touchStartR3 + delta;
                const newSel = snapToTop(r3Items.length, ring3Angle);
                if (newSel !== sel3) { sel3 = newSel; resolveComposed(); }
            }
        });

        canvas.addEventListener('pointerup', e => {
            if (touchRing === 'centre' && !touchMoved) {
                addToQueue();
                const flash = document.getElementById('topFlash');
                if (composedCodes.length > 0) {
                    flash.textContent = `+ ${sarGrammarText(composedCodes)}`;
                    flash.style.color = '#48f';
                    setTimeout(() => { flash.textContent = ''; }, 1200);
                }
            }
            touchRing = null; touchStartAngle = null;
        });

        function snapToTop(n, angle) {
            if (n === 0) return 0;
            const slice = (Math.PI * 2) / n;
            const top = -Math.PI / 2;
            let best = 0, bestD = Infinity;
            for (let i = 0; i < n; i++) {
                let d = Math.abs(((angle + i * slice - top + Math.PI) % (Math.PI * 2)) - Math.PI);
                if (d < bestD) { bestD = d; best = i; }
            }
            return best;
        }

        function updateHUD() {
            const shortEl = document.getElementById('hudShort');
            const codeEl = document.getElementById('hudCode');
            const detailEl = document.getElementById('hudDetail');

            if (composedCodes.length > 0) {
                // Show composed sentence in translated text
                const text = sarGrammarText(composedCodes);
                const firstCode = composedCodes[0];
                const entry = SAR_CODES[firstCode];
                const sev = entry ? SEV_COLOURS[entry.severity] || SEV_COLOURS[0] : SEV_COLOURS[0];
                shortEl.textContent = text;
                shortEl.style.color = sev.fg;
                codeEl.textContent = composedCodes.join(' + ');
                codeEl.style.color = '#555';
                // Build path: Ring1 > Ring2 > Ring3
                const path = [r1Items[sel1]?.label, r2Items[sel2]?.key, r3Items[sel3]?.key].filter(Boolean).join(' › ');
                detailEl.textContent = path;
            } else {
                shortEl.textContent = r1Items[sel1]?.label || '---';
                shortEl.style.color = '#888';
                codeEl.textContent = '';
                detailEl.textContent = 'Spin rings to compose';
            }
        }

        // ========== QUEUE ==========
        function addToQueue() {
            if (composedCodes.length === 0) return;
            // Store composed codes as a sentence
            for (const code of composedCodes) {
                const entry = SAR_CODES[code];
                if (entry) queue.push({ code, ...entry });
            }
            renderQueue();
            if (navigator.vibrate) navigator.vibrate(50);
        }

        function clearQueue() {
            stopCurrentTX(); // stop anything playing
            queue = [];
            renderQueue();
            transmitSingleCode('00B');
        }

        function transmitSingleCode(code3) {
            const ch = CHANNELS[channelMode];
            const code4 = sarEncode(code3);
            const val = parseInt(code4, 16);
            const bits = val.toString(2).padStart(16, '0').split('').map(Number);
            bits.push(0,0,0,0,0,1,0,0); // EOT

            stopRXListener();
            const aCtx = new (window.AudioContext || window.webkitAudioContext)();
            const t0 = aCtx.currentTime + 0.1;
            const dur = ch.bitMs / 1000 * 0.85;
            const step = ch.bitMs / 1000;
            let fi = 0;
            for (let i = 0; i < 6; i++) { playTone(aCtx, ch.sync * (i % 2 === 0 ? 1 : 1.5), t0 + fi * step, dur, 0.9); fi++; }
            fi += 2;
            for (const b of bits) { playTone(aCtx, b === 1 ? ch.freq1 : ch.freq0, t0 + fi * step, dur, 0.8); fi++; }
            fi += 1;
            for (let i = 0; i < 3; i++) { playTone(aCtx, ch.sync, t0 + fi * step, dur * 0.5, 0.7); fi++; }
            setTimeout(() => { aCtx.close(); startRXListener(); }, fi * step * 1000 + 500);
        }

        let flashIdx = 0, flashTimer = null;

        function renderQueue() {
            const el = document.getElementById('hudQueue');
            const flashEl = document.getElementById('topFlash');
            if (queue.length === 0) {
                el.innerHTML = ''; el.className = '';
                flashEl.textContent = '';
                if (flashTimer) { clearInterval(flashTimer); flashTimer = null; }
                return;
            }

            // Ticker tape (small, bottom)
            const text = queue.map((c, i) => `${c.code}`).join(' ► ');
            if (queue.length > 3) {
                el.className = 'scroll';
                el.innerHTML = `<span class="ticker">${text}  ●  ${text}</span>`;
            } else {
                el.className = '';
                el.innerHTML = `<span class="ticker">${text}</span>`;
            }

            // Flash cycle (large, dramatic, one word at a time)
            if (flashTimer) clearInterval(flashTimer);
            flashIdx = 0;
            flashWord();
            flashTimer = setInterval(flashWord, 1200);
        }

        function flashWord() {
            const flashEl = document.getElementById('topFlash');
            if (queue.length === 0) { flashEl.textContent = ''; return; }
            const c = queue[flashIdx % queue.length];
            const sev = SEV_COLOURS[c.severity] || SEV_COLOURS[0];

            // Fade out
            flashEl.style.opacity = '0';
            setTimeout(() => {
                flashEl.textContent = c.short;
                flashEl.style.color = sev.fg;
                flashEl.style.opacity = '1';
            }, 150);

            flashIdx++;
        }

        // ========== TRANSMIT ==========
        const CHANNELS = {
            air:   { freq0: 3000, freq1: 4500, sync: 2000, ackFreq: [2500, 3500, 5000], bitMs: 60 },
            water: { freq0: 800,  freq1: 1200, sync: 500,  ackFreq: [600, 900, 1100],   bitMs: 100 },
        };

        function toggleChannel() {
            channelMode = channelMode === 'air' ? 'water' : 'air';
            const ind = document.getElementById('chIndicator');
            ind.textContent = channelMode.toUpperCase();
            ind.className = channelMode === 'water' ? 'ch-water' : 'ch-air';
            // Flash the channel change in top bar
            const flash = document.getElementById('topFlash');
            flash.textContent = channelMode === 'water' ? 'UNDERWATER MODE' : 'AIR / RUBBLE MODE';
            flash.style.color = channelMode === 'water' ? '#0af' : '#ff0';
            setTimeout(() => { flash.textContent = ''; }, 2000);
            // Restart RX on new channel
            if (rxStarted) { stopRXListener(); startRXListener(); }
        }

        // ========== GPS ==========
        let gpsLat = null, gpsLon = null;
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                p => {
                    gpsLat = p.coords.latitude.toFixed(5);  // 5 decimals = ~1m precision
                    gpsLon = p.coords.longitude.toFixed(5);
                    document.getElementById('gpsStatus').textContent = 'FIX';
                    document.getElementById('gpsStatus').style.color = '#0f0';
                },
                () => { document.getElementById('gpsStatus').textContent = 'NO'; },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
            );
        }

        function sendGPS() {
            stopCurrentTX(); // stop anything playing
            if (!gpsLat || !gpsLon) {
                document.getElementById('topFlash').textContent = 'NO GPS FIX';
                document.getElementById('topFlash').style.color = '#f44';
                setTimeout(() => { document.getElementById('topFlash').textContent = ''; }, 2000);
                return;
            }
            // Transmit code 700 (I AM HERE) + GPS as compact string
            // GPS encoding: strip leading zeros, use comma separator
            // e.g. "3.12345,101.56789" — compact enough for acoustic
            const gpsStr = `${gpsLat},${gpsLon}`;
            const code4 = sarEncode('700'); // I AM HERE
            const val = parseInt(code4, 16);
            const codeBits = val.toString(2).padStart(16, '0').split('').map(Number);
            // GPS as ASCII bits
            const gpsBits = [];
            for (let i = 0; i < gpsStr.length; i++) {
                gpsBits.push(...gpsStr.charCodeAt(i).toString(2).padStart(8, '0').split('').map(Number));
            }
            const eot = [0,0,0,0,0,1,0,0];
            const allBits = [...codeBits, ...gpsBits, ...eot];

            // Flash
            document.getElementById('topFlash').textContent = `GPS: ${gpsStr}`;
            document.getElementById('topFlash').style.color = '#0af';

            // Transmit
            const ch = CHANNELS[channelMode];
            stopRXListener();
            const aCtx = new (window.AudioContext || window.webkitAudioContext)();
            const t0 = aCtx.currentTime + 0.1;
            const dur = ch.bitMs / 1000 * 0.85;
            const step = ch.bitMs / 1000;
            let fi = 0;
            for (let i = 0; i < 6; i++) { playTone(aCtx, ch.sync * (i % 2 === 0 ? 1 : 1.5), t0 + fi * step, dur, 0.9); fi++; }
            fi += 2;
            for (const b of allBits) { playTone(aCtx, b === 1 ? ch.freq1 : ch.freq0, t0 + fi * step, dur, 0.8); fi++; }
            fi += 1;
            for (let i = 0; i < 3; i++) { playTone(aCtx, ch.sync, t0 + fi * step, dur * 0.5, 0.7); fi++; }

            document.getElementById('btnGPS').style.background = '#0af';
            document.getElementById('btnGPS').style.color = '#000';
            setTimeout(() => {
                aCtx.close();
                document.getElementById('btnGPS').style.background = '#013';
                document.getElementById('btnGPS').style.color = '#0af';
                startRXListener();
            }, fi * step * 1000 + 500);
        }

        // ========== SOS PANIC ==========
        let sosRunning = false, sosTimer = null, sosAudioCtx = null;

        function toggleSOS() {
            if (sosRunning) { stopSOS(); return; }
            stopCurrentTX(); // stop any other TX first
            sosRunning = true;
            isTXing = true;
            const sosBtn = document.getElementById('btnSOS');
            sosBtn.classList.add('active');
            sosBtn.innerHTML = 'STOP<span class="rlabel">SOS</span>';
            document.getElementById('btnSend').innerHTML = 'STOP<span class="rlabel">SOS active</span>';
            document.getElementById('btnSend').style.borderColor = '#f44';
            document.getElementById('btnSend').style.background = '#400';
            document.getElementById('topFlash').textContent = 'SOS BEACON ACTIVE';
            document.getElementById('topFlash').style.color = '#f44';
            stopRXListener();
            sosLoop();
        }

        function sosLoop() {
            if (!sosRunning) return;
            const ch = CHANNELS[channelMode];
            const code4 = sarEncode('100'); // SOS
            const val = parseInt(code4, 16);
            const bits = val.toString(2).padStart(16, '0').split('').map(Number);
            // Add GPS if available
            if (gpsLat && gpsLon) {
                const gpsStr = `${gpsLat},${gpsLon}`;
                for (let i = 0; i < gpsStr.length; i++)
                    bits.push(...gpsStr.charCodeAt(i).toString(2).padStart(8, '0').split('').map(Number));
            }
            bits.push(0,0,0,0,0,1,0,0); // EOT

            // BLE parallel SOS
            if (bleConnected) bleSend([{ code: '100' }], gpsLat && gpsLon ? `${gpsLat},${gpsLon}` : '');

            sosAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const t0 = sosAudioCtx.currentTime + 0.1;
            const dur = ch.bitMs / 1000 * 0.85;
            const step = ch.bitMs / 1000;
            let fi = 0;
            for (let i = 0; i < 8; i++) { playTone(sosAudioCtx, ch.sync * (i % 2 === 0 ? 1 : 1.5), t0 + fi * step, dur, 1.0); fi++; }
            fi += 2;
            for (const b of bits) { playTone(sosAudioCtx, b === 1 ? ch.freq1 : ch.freq0, t0 + fi * step, dur, 0.9); fi++; }
            fi += 1;
            for (let i = 0; i < 3; i++) { playTone(sosAudioCtx, ch.sync, t0 + fi * step, dur * 0.5, 0.8); fi++; }

            const cycleSec = fi * step + 2.0; // 2s gap between loops
            sosTimer = setTimeout(() => {
                if (sosAudioCtx) { sosAudioCtx.close().catch(() => {}); }
                sosLoop();
            }, cycleSec * 1000);
        }

        function stopSOS() {
            sosRunning = false;
            isTXing = false;
            if (sosTimer) { clearTimeout(sosTimer); sosTimer = null; }
            if (sosAudioCtx) { sosAudioCtx.close().catch(() => {}); sosAudioCtx = null; }
            const sosBtn = document.getElementById('btnSOS');
            sosBtn.classList.remove('active');
            sosBtn.innerHTML = 'SOS<span class="rlabel">loop</span>';
            document.getElementById('btnSend').innerHTML = 'SEND<span class="rlabel">over</span>';
            document.getElementById('btnSend').style.borderColor = '#0f0';
            document.getElementById('btnSend').style.background = '#001a00';
            document.getElementById('topFlash').textContent = '';
            startRXListener();
        }

        // Track active transmission — SEND is a toggle
        let txAudioCtx = null, txTimeout = null, isTXing = false;

        function stopCurrentTX() {
            isTXing = false;
            if (txAudioCtx) { txAudioCtx.close().catch(() => {}); txAudioCtx = null; }
            if (txTimeout) { clearTimeout(txTimeout); txTimeout = null; }
            if (sosRunning) stopSOS();
            const btn = document.getElementById('btnSend');
            btn.innerHTML = 'SEND<span class="rlabel">over</span>';
            btn.style.borderColor = '#0f0';
            btn.style.background = '#001a00';
            startRXListener();
        }

        function transmitQueue() {
            // TOGGLE: if already transmitting, stop
            if (isTXing) { stopCurrentTX(); return; }

            // Auto-add current composed selection if queue empty
            if (queue.length === 0) {
                if (composedCodes.length > 0) {
                    for (const code of composedCodes) {
                        const entry = SAR_CODES[code];
                        if (entry) queue.push({ code, ...entry });
                    }
                    renderQueue();
                } else { return; }
            }
            const ch = CHANNELS[channelMode];

            // Build bits: for each code, encode 4 hex digits (16 bits)
            let allBits = [];
            for (const c of queue) {
                const code4 = sarEncode(c.code);
                const val = parseInt(code4, 16);
                const bits = val.toString(2).padStart(16, '0').split('').map(Number);
                allBits.push(...bits);
                // Separator: 4 zero bits between codes
                allBits.push(0, 0, 0, 0);
            }
            // EOT
            allBits.push(0,0,0,0,0,1,0,0);

            // BLE parallel TX
            if (bleConnected) bleSend(queue, '');

            txAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const t0 = txAudioCtx.currentTime + 0.1;
            const dur = ch.bitMs / 1000 * 0.85;
            const step = ch.bitMs / 1000;
            let fi = 0;

            for (let i = 0; i < 6; i++) { playTone(txAudioCtx, ch.sync * (i % 2 === 0 ? 1 : 1.5), t0 + fi * step, dur, 0.9); fi++; }
            fi += 2;
            for (const b of allBits) { playTone(txAudioCtx, b === 1 ? ch.freq1 : ch.freq0, t0 + fi * step, dur, 0.8); fi++; }
            fi += 1;
            for (let i = 0; i < 3; i++) { playTone(txAudioCtx, ch.sync, t0 + fi * step, dur * 0.5, 0.7); fi++; }

            const totalSec = fi * step;
            const sendBtn = document.getElementById('btnSend');
            isTXing = true;
            sendBtn.innerHTML = 'STOP<span class="rlabel">tap to stop</span>';
            sendBtn.style.borderColor = '#f44';
            sendBtn.style.background = '#400';

            stopRXListener();
            stopACK();

            txTimeout = setTimeout(() => {
                isTXing = false;
                if (txAudioCtx) { txAudioCtx.close().catch(() => {}); txAudioCtx = null; }
                sendBtn.innerHTML = 'SEND<span class="rlabel">over</span>';
                sendBtn.style.borderColor = '#0f0';
                sendBtn.style.background = '#001a00';
                startRXListener();
                startACKListener(ch);
            }, totalSec * 1000 + 500);
        }

        function playTone(ctx, freq, t, dur, vol) {
            const o = ctx.createOscillator(), g = ctx.createGain();
            o.frequency.value = freq; o.type = 'sine';
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(vol, t + 0.003);
            g.gain.setValueAtTime(vol, t + dur - 0.003);
            g.gain.linearRampToValueAtTime(0, t + dur);
            o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + dur + 0.01);
        }

        // ========== ACK LISTENER ==========
        let ackMic = null, ackCtx = null, ackAn = null, ackBuf = null, ackPoll = null, ackHits = 0;

        async function startACKListener(ch) {
            try {
                ackMic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }, video: false });
                ackCtx = new (window.AudioContext || window.webkitAudioContext)();
                ackAn = ackCtx.createAnalyser(); ackAn.fftSize = 4096; ackAn.smoothingTimeConstant = 0.3;
                ackCtx.createMediaStreamSource(ackMic).connect(ackAn);
                ackBuf = new Uint8Array(ackAn.frequencyBinCount);
                ackHits = 0;
                ackPoll = setInterval(() => {
                    ackAn.getByteFrequencyData(ackBuf);
                    const binHz = ackCtx.sampleRate / ackAn.fftSize;
                    let hits = 0;
                    for (const f of ch.ackFreq) {
                        const bin = Math.round(f / binHz);
                        let max = 0;
                        for (let i = bin - 3; i <= bin + 3; i++) if (i >= 0 && i < ackBuf.length && ackBuf[i] > max) max = ackBuf[i];
                        if (max > 40) hits++;
                    }
                    if (hits >= 2) { ackHits++; if (ackHits >= 3) { showREC(); ackHits = 0; } }
                    else ackHits = Math.max(0, ackHits - 1);
                }, 100);
                // Auto-stop after 10s
                setTimeout(stopACK, 10000);
            } catch (e) {}
        }

        function stopACK() {
            if (ackPoll) clearInterval(ackPoll);
            if (ackMic) { ackMic.getTracks().forEach(t => t.stop()); ackMic = null; }
            if (ackCtx) { ackCtx.close().catch(() => {}); ackCtx = null; }
        }

        function showREC() {
            const banner = document.getElementById('recBanner');
            banner.style.display = 'block';
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            setTimeout(() => { banner.style.display = 'none'; }, 4000);
        }

        // ========== WALKIE-TALKIE: BACKGROUND LISTENER ==========
        // Listens for incoming SAR codes when not transmitting
        let rxCtx = null, rxAn = null, rxBuf = null, rxMic = null, rxPoll = null;
        let rxSyncCount = 0, rxSyncDetected = false, rxBits = [], rxSilence = 0;
        let rxV0 = 0, rxV1 = 0, rxVS = 0;
        let rxIncoming = []; // decoded incoming codes
        const RX_IDLE_POLL_MS = 100;  // 10 Hz standby — must catch 360ms air preamble (need ≥3 hits)
        let rxCurrentPollMs = 0;

        async function startRXListener() {
            const ch = CHANNELS[channelMode];
            try {
                rxMic = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }, video: false });
                rxCtx = new (window.AudioContext || window.webkitAudioContext)();
                rxAn = rxCtx.createAnalyser(); rxAn.fftSize = 8192; rxAn.smoothingTimeConstant = 0.2;
                rxCtx.createMediaStreamSource(rxMic).connect(rxAn);
                rxBuf = new Uint8Array(rxAn.frequencyBinCount);
                rxCurrentPollMs = RX_IDLE_POLL_MS;
                rxPoll = setInterval(() => processRX(ch), RX_IDLE_POLL_MS);
                console.log(`§RX-START ch=${channelMode} poll=${RX_IDLE_POLL_MS}ms(idle) fft=${rxAn.fftSize} state=${rxCtx.state}`);
            } catch (e) { console.error('§RX-FAIL', e.message); }
        }

        function stopRXListener() {
            console.log(`§RX-STOP poll=${!!rxPoll} mic=${!!rxMic} ctx=${rxCtx ? rxCtx.state : 'null'}`);
            if (rxPoll) { clearInterval(rxPoll); rxPoll = null; }
            if (rxMic) { rxMic.getTracks().forEach(t => t.stop()); rxMic = null; }
            if (rxCtx) { rxCtx.close().catch(() => {}); rxCtx = null; }
        }

        function processRX(ch) {
            rxAn.getByteFrequencyData(rxBuf);
            const binHz = rxCtx.sampleRate / rxAn.fftSize;
            const eSync = pkRX(Math.round(ch.sync / binHz), 4);
            const eSyncHi = pkRX(Math.round((ch.sync * 1.5) / binHz), 4);
            const e0 = pkRX(Math.round(ch.freq0 / binHz), 4);
            const e1 = pkRX(Math.round(ch.freq1 / binHz), 4);
            const qBin = Math.round(6000 / binHz);
            let ns = 0, nc = 0;
            for (let b = qBin; b < qBin + 20 && b < rxBuf.length; b++) { ns += rxBuf[b]; nc++; }
            const thr = Math.max(nc > 0 ? ns / nc + 15 : 20, 20);

            if (!rxSyncDetected) {
                if (eSync > thr || eSyncHi > thr) { rxSyncCount++; rxSilence = 0;
                    if (rxSyncCount >= 3) {
                        rxSyncDetected = true; rxBits = [];
                        // Ramp up to fast polling for data capture
                        const fastMs = channelMode === 'water' ? 50 : 30;
                        if (rxCurrentPollMs !== fastMs) {
                            clearInterval(rxPoll);
                            rxCurrentPollMs = fastMs;
                            rxPoll = setInterval(() => processRX(ch), fastMs);
                            console.log(`§POLL-FAST ${fastMs}ms`);
                        }
                    }
                } else { rxSilence++; if (rxSilence > 10) rxSyncCount = 0; }
                return;
            }

            const maxE = Math.max(e0, e1);
            if (maxE > thr) {
                if (e0 > e1 * 1.4) rxV0++;
                else if (e1 > e0 * 1.4) rxV1++;
            } else { rxVS++; }

            if (rxV0 + rxV1 + rxVS >= 2) {
                if (rxV0 > rxV1 && rxV0 > 0) rxBits.push(0);
                else if (rxV1 > rxV0 && rxV1 > 0) rxBits.push(1);
                else if (rxVS >= 2) rxSilence += 2;
                rxV0 = 0; rxV1 = 0; rxVS = 0;
            }

            if (rxSilence > 10 && rxBits.length >= 16) {
                decodeIncoming();
                rxSyncDetected = false; rxSyncCount = 0; rxBits = []; rxSilence = 0;
                // Ramp back to idle polling — save battery
                if (rxCurrentPollMs !== RX_IDLE_POLL_MS) {
                    clearInterval(rxPoll);
                    rxCurrentPollMs = RX_IDLE_POLL_MS;
                    rxPoll = setInterval(() => processRX(ch), RX_IDLE_POLL_MS);
                    console.log(`§POLL-IDLE ${RX_IDLE_POLL_MS}ms`);
                }
            }
        }

        function pkRX(bin, r) {
            let m = 0;
            for (let i = bin - r; i <= bin + r; i++) if (i >= 0 && i < rxBuf.length && rxBuf[i] > m) m = rxBuf[i];
            return m;
        }

        let rxGPS = ''; // GPS received with last message

        function decodeIncoming() {
            // First 16 bits = code
            if (rxBits.length < 16) return;
            let val = 0;
            for (let i = 0; i < 16; i++) val = (val << 1) | rxBits[i];
            const code4 = val.toString(16).toUpperCase().padStart(4, '0');
            const result = sarDecode(code4);
            console.log(`§RX-DECODE code4=${code4} valid=${result.valid} bits=${rxBits.length} entry=${result.entry ? result.entry.short : 'null'}`);

            if (result.valid && result.entry) {
                rxIncoming.push(result);
            }

            // Extract trailing ASCII (GPS or more codes)
            rxGPS = '';
            let pos = 16;
            let text = '';
            while (pos + 7 < rxBits.length) {
                let byte = 0;
                for (let b = 0; b < 8; b++) byte = (byte << 1) | rxBits[pos + b];
                pos += 8;
                if (byte === 4) break; // EOT
                if (byte >= 32 && byte < 127) text += String.fromCharCode(byte);
            }
            // Check if text looks like GPS coords (contains comma + numbers)
            if (/^-?\d+\.\d+,-?\d+\.\d+$/.test(text.trim())) {
                rxGPS = text.trim();
            } else if (text.length > 0) {
                // Might be more codes — try to decode as 16-bit chunks
                // For now just store as text
            }

            if (rxIncoming.length > 0) {
                showIncoming();
            }
        }

        function showIncoming() {
            // Check for REST/CANCEL/NULL signals
            const isRest = rxIncoming.some(r => r.code === '00B' || r.code === '000');
            if (isRest) {
                const banner = document.getElementById('recBanner');
                banner.textContent = 'SENDER REST';
                banner.style.background = '#111';
                banner.style.borderColor = '#555';
                banner.style.color = '#888';
                banner.style.display = 'block';
                const flashEl = document.getElementById('topFlash');
                flashEl.textContent = 'STANDBY';
                flashEl.style.color = '#555';
                setTimeout(() => { banner.style.display = 'none'; }, 5000);
                rxIncoming = [];
                return;
            }

            // Show received message dramatically
            const banner = document.getElementById('recBanner');
            const msgs = rxIncoming.map(r => r.entry.short).join(' ► ');
            const codes = rxIncoming.map(r => r.code).join(' ');
            const topSev = Math.max(...rxIncoming.map(r => r.entry.severity));
            const sevCol = SEV_COLOURS[topSev] || SEV_COLOURS[2];

            // Build banner content — include GPS GO button if coordinates received
            let bannerHTML = `RX: ${msgs}`;
            if (rxGPS) {
                const [lat, lon] = rxGPS.split(',');
                bannerHTML += `<br><a href="https://maps.google.com/?q=${lat},${lon}" target="_blank"
                    style="display:inline-block; margin-top:6px; padding:8px 24px; background:#0f0; color:#000;
                    font-size:16px; font-weight:bold; text-decoration:none; border-radius:6px; pointer-events:auto;">
                    GO — ${rxGPS}</a>`;
            }
            banner.innerHTML = bannerHTML;
            banner.style.background = sevCol.bg;
            banner.style.borderColor = sevCol.fg;
            banner.style.color = sevCol.fg;
            banner.style.display = 'block';

            // Alert
            if (navigator.vibrate) navigator.vibrate(topSev >= 4 ? [300, 100, 300, 100, 300] : [200, 100, 200]);
            const aCtx = new (window.AudioContext || window.webkitAudioContext)();
            const t = aCtx.currentTime;
            for (let i = 0; i < (topSev >= 4 ? 5 : 3); i++) {
                const o = aCtx.createOscillator(), g = aCtx.createGain();
                o.frequency.value = topSev >= 4 ? 1200 : 880; o.type = 'square'; g.gain.value = 0.3;
                o.connect(g); g.connect(aCtx.destination);
                o.start(t + i * 0.15); o.stop(t + i * 0.15 + 0.08);
            }
            setTimeout(() => aCtx.close(), 2000);

            // Flash received words through the flash display
            if (flashTimer) clearInterval(flashTimer);
            let rIdx = 0;
            const flashEl = document.getElementById('topFlash');
            function flashRX() {
                if (rIdx >= rxIncoming.length) {
                    // Done — restore queue flash
                    if (queue.length > 0) { flashIdx = 0; flashTimer = setInterval(flashWord, 1200); }
                    return;
                }
                const r = rxIncoming[rIdx];
                const sc = SEV_COLOURS[r.entry.severity] || SEV_COLOURS[0];
                flashEl.style.opacity = '0';
                setTimeout(() => {
                    flashEl.textContent = `◄ ${r.entry.short}`;
                    flashEl.style.color = sc.fg;
                    flashEl.style.opacity = '1';
                }, 150);
                rIdx++;
                setTimeout(flashRX, 1500);
            }
            flashRX();

            // Auto-hide banner (longer if GPS so user can tap GO)
            setTimeout(() => { banner.style.display = 'none'; }, rxGPS ? 15000 : 8000);

            // Auto-relay: retransmit received codes after 3s to extend mesh range
            // Only relay if the codes haven't been seen before (prevent echo loops)
            const relayKey = rxIncoming.map(r => r.code).join(',');
            if (!relayedSet.has(relayKey)) {
                relayedSet.add(relayKey);
                setTimeout(() => autoRelay(rxIncoming), 3000);
            }
            rxIncoming = [];
        }

        // Relay dedup — prevent echo loops
        const relayedSet = new Set();
        // Clear old relay keys every 60s
        setInterval(() => relayedSet.clear(), 60000);

        function autoRelay(codes) {
            if (codes.length === 0) return;
            const ch = CHANNELS[channelMode];

            // Mute RX
            stopRXListener();

            let allBits = [];
            for (const r of codes) {
                const code4 = sarEncode(r.code);
                const val = parseInt(code4, 16);
                allBits.push(...val.toString(2).padStart(16, '0').split('').map(Number));
                allBits.push(0, 0, 0, 0);
            }
            allBits.push(0,0,0,0,0,1,0,0);

            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const t0 = ctx.currentTime + 0.1;
            const dur = ch.bitMs / 1000 * 0.85;
            const step = ch.bitMs / 1000;
            let fi = 0;
            for (let i = 0; i < 6; i++) { playTone(ctx, ch.sync * (i % 2 === 0 ? 1 : 1.5), t0 + fi * step, dur, 0.9); fi++; }
            fi += 2;
            for (const b of allBits) { playTone(ctx, b === 1 ? ch.freq1 : ch.freq0, t0 + fi * step, dur, 0.7); fi++; }
            fi += 1;
            for (let i = 0; i < 3; i++) { playTone(ctx, ch.sync, t0 + fi * step, dur * 0.5, 0.6); fi++; }

            const totalMs = fi * step * 1000;
            document.getElementById('btnSend').innerHTML = 'RLY<span class="rlabel">relay</span>';
            document.getElementById('btnSend').style.borderColor = '#fa0';

            setTimeout(() => {
                ctx.close();
                document.getElementById('btnSend').innerHTML = 'SEND<span class="rlabel">over</span>';
                document.getElementById('btnSend').style.borderColor = '#0f0';
                startRXListener();
            }, totalMs + 500);
        }

        // Start listening on FIRST user interaction (mobile requires gesture for mic)
        let rxStarted = false;
        function ensureRX() {
            if (!rxStarted) {
                rxStarted = true;
                startRXListener();
                document.getElementById('topLabel').textContent = 'LIVE';
            }
        }
        document.addEventListener('pointerdown', ensureRX, { once: true });

        // ========== STANDBY RESILIENCE ==========
        // Mobile browsers suspend AudioContext on screen-off / tab-background.
        // Re-acquire wakeLock and resume mic when page becomes visible again.
        let wakeLockSentinel = null;
        async function acquireWakeLock() {
            if (!navigator.wakeLock) return;
            try { wakeLockSentinel = await navigator.wakeLock.request('screen');
                  wakeLockSentinel.addEventListener('release', () => { wakeLockSentinel = null; });
            } catch (e) {}
        }
        acquireWakeLock();
        console.log('§STANDBY-INIT wakeLock + visibility + heartbeat armed');

        document.addEventListener('visibilitychange', () => {
            console.log(`§VISIBILITY state=${document.visibilityState} rxCtx=${rxCtx ? rxCtx.state : 'null'} rxPoll=${!!rxPoll}`);
            if (document.visibilityState === 'visible') {
                // Re-acquire wake lock (released on hide)
                acquireWakeLock();
                // Resume any suspended AudioContexts
                if (rxCtx && rxCtx.state === 'suspended') rxCtx.resume();
                if (ackCtx && ackCtx.state === 'suspended') ackCtx.resume();
                // Auto-reconnect BLE if it was connected before
                if (trxMode === 'bt' && !bleConnected && bleDevice && bleDevice.gatt) {
                    connectBLE().catch(() => {});
                }
                // If RX was started but mic died, restart it
                if (rxStarted && !isTXing && !sosRunning && (!rxPoll || (rxCtx && rxCtx.state === 'closed'))) {
                    stopRXListener();
                    startRXListener();
                    document.getElementById('topLabel').textContent = 'LIVE';
                }
            }
        });

        // Periodic heartbeat — catch silent AudioContext death every 10s
        setInterval(() => {
            if (!rxStarted || isTXing || sosRunning) return;
            const state = rxCtx ? rxCtx.state : 'null';
            if (!rxCtx || rxCtx.state === 'closed') {
                console.log(`§HEARTBEAT revive — rxCtx=${state}`);
                stopRXListener();
                startRXListener();
            } else if (rxCtx.state === 'suspended') {
                console.log('§HEARTBEAT resume suspended');
                rxCtx.resume();
            }
        }, 10000);

        updateHUD();

        // ========== FLAG CHOOSER (i18n) ==========
        let currentLang = 'en';
        function buildFlagBar() {
            const bar = document.getElementById('flagBar');
            bar.innerHTML = Object.entries(SAR_LANGUAGES).map(([code, lang]) =>
                `<button class="flag-btn${code === currentLang ? ' active' : ''}" onclick="setLang('${code}')">${lang.flag}</button>`
            ).join('');
        }
        buildFlagBar();

        function toggleFlagBar() {
            document.getElementById('flagBar').classList.toggle('hidden');
        }

        function setLang(code) {
            currentLang = code;
            sarSetLang(code);
            document.getElementById('flagCurrent').textContent = SAR_LANGUAGES[code].flag;
            document.getElementById('flagBar').classList.add('hidden');
            // Rebuild categories with translated text
            buildCategories();
            updateHUD();
            buildFlagBar();
            console.log(`§LANG set=${code} name=${SAR_LANGUAGES[code].name}`);
        }

        // ========== BLE TRANSPORT (BT mode) ==========
        let trxMode = 'sonar'; // 'sonar' or 'bt'
        let bleDevice = null, bleServer = null, bleTxChar = null, bleRxChar = null;
        let bleConnected = false;

        function toggleTrx() {
            if (trxMode === 'sonar') {
                trxMode = 'bt';
                document.getElementById('btnTrx').className = 'bt';
                document.getElementById('trxLabel').textContent = 'BT';
                connectBLE();
            } else {
                trxMode = 'sonar';
                document.getElementById('btnTrx').className = 'sonar';
                document.getElementById('trxLabel').textContent = 'SND';
                disconnectBLE();
            }
            console.log(`§TRX mode=${trxMode}`);
        }

        async function connectBLE() {
            if (!navigator.bluetooth) {
                flashMsg('NO BLUETOOTH API', '#f44');
                trxMode = 'sonar';
                document.getElementById('btnTrx').className = 'sonar';
                return;
            }
            try {
                // Try reconnect to previously paired device first
                if (bleDevice && bleDevice.gatt) {
                    flashMsg('RECONNECTING...', '#48f');
                    try {
                        bleServer = await bleDevice.gatt.connect();
                        await subscribeBLE();
                        return;
                    } catch (e) { console.log('§BLE-RECONNECT-FAIL', e.message); }
                }

                // Fresh scan — also accept any device advertising our service name
                flashMsg('SCANNING BLE...', '#48f');
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [
                        { services: [SAR_BLE.SERVICE] },
                        { namePrefix: 'SAR' }
                    ],
                    optionalServices: [SAR_BLE.SERVICE]
                });
                bleDevice.addEventListener('gattserverdisconnected', onBLEDisconnect);
                flashMsg('CONNECTING...', '#48f');
                bleServer = await bleDevice.gatt.connect();
                await subscribeBLE();
            } catch (e) {
                console.log(`§BLE-FAIL ${e.message}`);
                flashMsg(e.message.includes('cancel') ? 'BT CANCELLED' : `BT: ${e.message}`, '#f44');
                trxMode = 'sonar';
                document.getElementById('btnTrx').className = 'sonar';
            }
        }

        async function subscribeBLE() {
            const service = await bleServer.getPrimaryService(SAR_BLE.SERVICE);
            bleTxChar = await service.getCharacteristic(SAR_BLE.TX_CHAR);
            bleRxChar = await service.getCharacteristic(SAR_BLE.RX_CHAR);
            bleRxChar.addEventListener('characteristicvaluechanged', onBLERx);
            await bleRxChar.startNotifications();
            bleConnected = true;
            document.getElementById('btnTrx').classList.add('bt-active');
            flashMsg(`BT: ${bleDevice.name || 'connected'}`, '#48f');
            console.log(`§BLE-CONNECT device=${bleDevice.name} service=${SAR_BLE.SERVICE}`);
        }

        function disconnectBLE() {
            if (bleServer && bleServer.connected) bleServer.disconnect();
            bleConnected = false;
            document.getElementById('btnTrx').classList.remove('bt-active');
            console.log('§BLE-DISCONNECT');
        }

        function onBLEDisconnect() {
            bleConnected = false;
            document.getElementById('btnTrx').classList.remove('bt-active');
            flashMsg('BT DISCONNECTED', '#f44');
            console.log('§BLE-LOST');
        }

        function onBLERx(event) {
            const bytes = new Uint8Array(event.target.value.buffer);
            const pkt = sarUnpackBLE(bytes);
            console.log(`§BLE-RX code=${pkt.code} valid=${pkt.valid} gps=${pkt.gps}`);
            if (!pkt || !pkt.valid || !pkt.entry) return;
            // Feed into the same incoming pipeline as acoustic
            rxIncoming.push(pkt);
            if (pkt.gps) rxGPS = pkt.gps;
            showIncoming();
        }

        // Send SAR codes via BLE (called alongside acoustic TX)
        async function bleSend(codes, gpsStr) {
            if (!bleConnected || !bleTxChar) return;
            for (const c of codes) {
                const bytes = sarPackToBLE(c.code, gpsStr || '');
                try {
                    await bleTxChar.writeValue(bytes);
                    console.log(`§BLE-TX code=${c.code} bytes=${bytes.length}`);
                } catch (e) { console.log(`§BLE-TX-FAIL ${e.message}`); }
            }
        }

        function flashMsg(text, colour) {
            const el = document.getElementById('topFlash');
            el.textContent = text;
            el.style.color = colour;
            setTimeout(() => { el.textContent = ''; }, 2500);
        }

        // Service Worker — offline cache
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    </script>
</body>
</html>
