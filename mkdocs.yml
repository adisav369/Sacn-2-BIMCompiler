  - Start Here:
      - Home: index.md
      - The ERP World View: MANIFESTO.md
      - Documentation Index: INDEX.md
      #- Current State: ../PROGRESS.md  # outside docs_dir — link from landing page instead

  # ─── "I want to understand the system" ──────────────────
  - Specs:
      - BOM Compilation (Core Spec): BOMBasedCompilation.md
      - Data Model: DATA_MODEL.md
      - Rosetta Stone Strategy: TheRosettaStoneStrategy.md
      - Source Code Guide: SourceCodeGuide.md

  # ─── DOMAIN: Compilation engine ─────────────────────────
  - Verb Engine:
      - BIM COBOL (64 Verbs): BIM_COBOL.md
      - Test Architecture (6 Gates): TestArchitecture.md
      - EYES (Geometric Proofs): EYES_SRS.md
