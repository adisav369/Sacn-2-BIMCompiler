site_name: BIM Intent Compiler
site_description: Construction is manufacturing. A building IS its Bill of Materials.
site_author: Redhuan D. Oon
repo_url: https://github.com/red1oon/BIMCompiler

theme:
  name: material
  palette:
    - scheme: default
      primary: blue grey
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - toc.follow
    - content.tabs.link

docs_dir: docs

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra_css:
  - stylesheets/custom.css

extra:
  analytics:
    provider: google
    property: G-XXXXXXXXXX  # Replace with your GA4 Measurement ID from https://analytics.google.com/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/red1oon/BIMCompiler
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/red1oon/

