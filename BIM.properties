# BIM Compiler Configuration
# Following iDempiere convention: external properties file, not hardcoded.
#
# Log level: ERROR, WARN, INFO, FINE, DEBUG
# Override per-run with -Dbim.log.level=FINE
bim.log.level=INFO

# GEO debug mode — tack chain logging (BBC.md §4)
# Activates [GEO] TACK ENTER/EXIT/LEAF lines in log file.
# Override per-run with -Dbim.geo.debug=true
bim.geo.debug=true
# Optional filter: only log elements whose productId contains this string.
# No filter = all elements. Override with -Dbim.geo.filter=Desk
#bim.geo.filter=
