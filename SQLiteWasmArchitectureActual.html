<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SQLite‑WASM — The Trick Behind Zero Servers</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #10131c; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; color: #e2e8f0; display: flex; flex-direction: column;
         align-items: center; padding: 14px 10px; }
  h1 { font-size: 2.1rem; font-weight: 800; color: #f5f7fa; letter-spacing: 0.01em; text-align: center; }
  h1 span { color: #f0b429; }
  .sub { color: #8a97b8; font-size: 1.1rem; margin: 5px 0 10px; text-align: center; }
  .stage { width: 100%; max-width: 1500px; }
  svg { width: 100%; height: auto; display: block; }
  .tag    { font: 700 14px 'Segoe UI', sans-serif; letter-spacing: 0.04em; }
  .node-t { font: 800 22px 'Segoe UI', sans-serif; }
  .node-s { font: 500 14.5px 'Segoe UI', sans-serif; }
  .term   { font: 700 16px 'Consolas', monospace; }
  .side   { font: 800 16px 'Segoe UI', sans-serif; letter-spacing: 0.03em; }
  .item   { font: 500 15.5px 'Segoe UI', sans-serif; }
  .itemOK { font: 700 15.5px 'Segoe UI', sans-serif; }

  @keyframes wipeX {
    0%, 42%  { x: -820px; }
    50%, 92% { x: -320px; }
    100%     { x: -820px; }
  }
  #wipeRect, #wipeEdgeInner { animation: wipeX 7s ease-in-out infinite; }
</style>
</head>
<body>
  <h1>SQLite‑WASM: <span>The Trick Behind Zero Servers</span></h1>
  <div class="sub">Same engine. Same file calls. One swapped layer — watch what stays fixed and what flips.</div>

  <div class="stage">
  <svg viewBox="0 0 1500 940" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 Z" fill="#8b97b8"/>
      </marker>
      <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 Z" fill="#4fd497"/>
      </marker>
      <clipPath id="wipeClip">
        <rect id="wipeRect" x="-820" y="-140" width="600" height="280"/>
      </clipPath>
    </defs>

    <!-- ═══ CONSTANT ZONE — same in every case, never animates ═══ -->
    <rect x="380" y="10" width="490" height="58" rx="12" fill="#171c2b" stroke="#3a4460" stroke-width="1.5"/>
    <text x="625" y="33" text-anchor="middle" class="tag" fill="#8b97b8">ALWAYS TRUE — NOT A REWRITE, THE REAL THING</text>
    <text x="625" y="55" text-anchor="middle" class="node-s" fill="#c3ccdf">Unmodified SQLite C source, compiled by <tspan class="term" fill="#f0b429">Emscripten</tspan> into <tspan class="term" fill="#f0b429">WASM</tspan></text>

    <path d="M625,68 V100" stroke="#8b97b8" stroke-width="2.5" marker-end="url(#arrowW)"/>

    <rect x="485" y="108" width="280" height="72" rx="12" fill="#1d2540" stroke="#5b9bf0" stroke-width="2.5"/>
    <text x="625" y="143" text-anchor="middle" class="node-t" fill="#eef2ff">SQLite Engine</text>
    <text x="625" y="168" text-anchor="middle" class="node-s" fill="#7c93c9">→ boots this app's Viewer &amp; every ERP page</text>

    <text x="625" y="212" text-anchor="middle" class="term" fill="#9db4e6">open()  ·  read()  ·  write()</text>
    <text x="625" y="233" text-anchor="middle" class="node-s" fill="#8a97b8">the exact same calls SQLite has always made</text>

    <path d="M625,241 V274" stroke="#8b97b8" stroke-width="2.5" marker-end="url(#arrowW)"/>

    <polygon points="625,278 760,364 625,450 490,364" fill="#3d2f78" stroke="#f0b429" stroke-width="3"/>
    <text x="625" y="352" text-anchor="middle" class="node-t" fill="#fff7e0">VFS</text>
    <text x="625" y="374" text-anchor="middle" class="node-s" fill="#e6d9ff">SQLite's own swappable</text>
    <text x="625" y="392" text-anchor="middle" class="node-s" fill="#e6d9ff">storage layer</text>
    <text x="625" y="419" text-anchor="middle" class="tag" fill="#f0b429" font-size="12">built into SQLite since 2004 —</text>
    <text x="625" y="435" text-anchor="middle" class="tag" fill="#f0b429" font-size="12">this isn't a WASM hack</text>

    <path d="M625,450 V480" stroke="#8b97b8" stroke-width="2.5" marker-end="url(#arrowW)"/>

    <!-- ═══ THE SWIPE — Disk and Memory occupy the SAME spot; only the clip reveals which ═══ -->
    <text x="335" y="510" text-anchor="middle" class="side" fill="#7c8aad">NORMAL COMPUTER</text>
    <text x="915" y="510" text-anchor="middle" class="side" fill="#7ff0bc">THIS BROWSER TAB</text>

    <rect x="245" y="530" width="760" height="290" rx="18" fill="#151a29" stroke="#2b3550" stroke-width="1.5"/>

    <g transform="translate(625,690)">
      <!-- bottom layer: what SQLite's code assumes — a real disk -->
      <g opacity="0.85">
        <rect x="-58" y="-40" width="116" height="80" rx="8" fill="none" stroke="#8894b8" stroke-width="3"/>
        <circle cx="0" cy="0" r="26" fill="none" stroke="#8894b8" stroke-width="3"/>
        <circle cx="0" cy="0" r="5" fill="#8894b8"/>
        <text x="0" y="74" text-anchor="middle" class="node-t" fill="#dfe4f0">A Real Disk</text>
        <text x="0" y="100" text-anchor="middle" class="node-s" fill="#a3aecb">an OS + file system + physical drive</text>
      </g>

      <!-- top layer: what's actually there — browser memory, wiped in/out -->
      <g clip-path="url(#wipeClip)">
        <rect x="-140" y="-70" width="280" height="180" fill="#151a29"/>
        <rect x="-58" y="-40" width="116" height="80" rx="8" fill="none" stroke="#7ff0bc" stroke-width="3"/>
        <line x1="-34" y1="-20" x2="-34" y2="20" stroke="#7ff0bc" stroke-width="3"/>
        <line x1="-11" y1="-20" x2="-11" y2="20" stroke="#7ff0bc" stroke-width="3"/>
        <line x1="11" y1="-20" x2="11" y2="20" stroke="#7ff0bc" stroke-width="3"/>
        <line x1="34" y1="-20" x2="34" y2="20" stroke="#7ff0bc" stroke-width="3"/>
        <text x="0" y="74" text-anchor="middle" class="node-t" fill="#eafff5">MEMFS</text>
        <text x="0" y="100" text-anchor="middle" class="node-s" fill="#a8e8c8">just bytes in this tab's RAM</text>
      </g>

      <!-- traveling edge marking the swipe boundary -->
      <g transform="translate(600,0)" clip-path="none">
        <rect id="wipeEdgeInner" x="-820" y="-135" width="4" height="270" fill="#4fd497"/>
      </g>
    </g>

    <text x="625" y="862" text-anchor="middle" class="node-s" fill="#7c93c9">e.g. this app's <tspan class="term" fill="#9db4e6">building_extracted.db</tspan> and <tspan class="term" fill="#9db4e6">erp/ad_seed.db</tspan> both get swapped in this way</text>

    <!-- OPFS side note -->
    <rect x="1030" y="600" width="230" height="120" rx="10" fill="#0e2a2f" stroke="#7fe0ee" stroke-width="1.5"/>
    <text x="1145" y="626" text-anchor="middle" class="tag" fill="#7fe0ee" font-size="12">ALSO AVAILABLE</text>
    <text x="1145" y="652" text-anchor="middle" class="node-t" fill="#e4f9fc" font-size="18">OPFS</text>
    <text x="1145" y="676" text-anchor="middle" class="node-s" fill="#a9dde6" font-size="12.5">real persistent storage —</text>
    <text x="1145" y="694" text-anchor="middle" class="node-s" fill="#a9dde6" font-size="12.5">detected, not wired in yet</text>

    <path d="M625,820 V856" stroke="#4fd497" stroke-width="2.5" marker-end="url(#arrowGreen)" transform="translate(0,20)"/>

    <!-- ═══ RESULT — what disappears ═══ -->
    <rect x="395" y="878" width="460" height="52" rx="12" fill="#0c1220" stroke="#3a4460" stroke-width="1.5"/>
    <text x="625" y="900" text-anchor="middle" class="tag" fill="#8b97b8">SO THESE DISAPPEAR:</text>
    <text x="625" y="920" text-anchor="middle" class="item" fill="#6b7591"><tspan text-decoration="line-through">app server</tspan> · <tspan text-decoration="line-through">DB server</tspan> · <tspan text-decoration="line-through">network round‑trip</tspan></text>

  </svg>
  </div>
</body>
</html>
