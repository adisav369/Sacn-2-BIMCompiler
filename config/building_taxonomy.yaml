# Building Parts Taxonomy — top-down checklist / bottom-up lookup, same table.
# Spec: prompts/BUILDING_PARTS_TAXONOMY.md — read it first, has the full recon citations.
# Module: build/building_parts_taxonomy.js · Witness: build/witness_building_parts_taxonomy.js
#
# min_count: 0 means ADVISORY (tick found/not-found, never a shortfall failure) — distinct from
# config/profiles/malaysian_residential.yaml's required_spaces (min_count >= 1 = hard gate).
# STORAGE and AIR_LIGHT_WELL are deliberately ABSENT from this file — recon found zero real
# evidence for either in any of the 8 shipped buildings. See the spec doc's own table before
# adding either back; do not re-derive that search.

building_classes:
  residential:            # WalkerDoctrine.md §1 LOCKED: SampleHouse, Duplex, SampleCastle
    parts:
      - type: STAIRWAY
        source: ifc_entity
        evidence: measured
        min_count: 0
        buildings: ["Duplex (2 IfcStair+2 IfcStairFlight)", "SampleCastle (9 IfcStair)"]
      - type: LIFT_SHAFT
        source: name_keyword
        evidence: measured
        min_count: 0
        buildings: ["SampleCastle (67 elements: liftdeur/liftputvloer/lifttop/liftwand)"]

  complex:                # WalkerDoctrine.md §1 LOCKED: Terminal, Clinic, Hospital, HHS (office-scale)
    parts:
      - type: STAIRWAY
        source: ifc_entity
        evidence: measured
        min_count: 0
        buildings: ["Hospital (60 IfcStair, strongest anchor)", "Clinic (3 IfcStair+6 IfcStairFlight)",
                    "Terminal (32 IfcStairFlight+1 IfcRampFlight)"]
      - type: LIFT_SHAFT
        source: name_keyword
        evidence: measured
        min_count: 0
        buildings: ["HHS (3x \"Aufzug 2-flg\")", "Clinic (1x M_Elevator-Hydraulic)",
                    "Terminal (5x ElevatorLift_Door)"]
      - type: PLANT_ROOM
        source: mep_density
        evidence: measured
        min_count: 0
        # n=4 real buildings as of 2026-07-12 (DISCWALK_PLANT_ROOM_INDUSTRIAL_TAXONOMY.md survey,
        # class-checked on the FULL *_extracted.db data — the ARC-only residents are MEP-stripped
        # by design, so resident-side counts are 0 for HHS/Clinic/Hospital and 74 for Terminal;
        # both scopes cited so neither number gets "corrected" into the other).
        buildings: ["Terminal (74 keyword elements in Terminal_ARC.db resident, 10/74 in one room; 644 in Terminal_extracted.db full data: 568 IfcDuctSegment + 68 proxy + 2 IfcValve, plus 6 walls literally typed A_Wall_Ext_230mm_AHU_V1 — a designated AHU room enclosure)",
                    "Hospital (5391: 4816 IfcDuctSegment + 575 proxy AHU/fan/damper — densest room 263 elements)",
                    "Clinic (1881: 1759 IfcFlowSegment + 115 IfcFlowController + 5 IfcFlowMovingDevice fans/pumps + 2 IfcEnergyConversionDevice chillers — densest room 317 elements)",
                    "HHS (1769: 933 IfcFlowFitting + 834 IfcFlowSegment + 2 proxy AHU/rooftop-fan — densest room 18 elements)"]
