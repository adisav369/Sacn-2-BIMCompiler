# Space Type Definitions
# Phase 29: Configuration-driven space types
# Phase 32: MEP (Mechanical, Electrical, Plumbing) requirements
#
# Source: ✓ EXTRACTED from RoomType.java enum
# Standard: OmniClass Table 13 (Space Types)
# MEP Reference: UBBL 1984 (Malaysia), IRC 2021 (US)
#
# Adding a new space type:
# 1. Add entry to this file
# 2. No Java recompile needed
# 3. Use in DSL immediately
#
# MEP is derived implicitly from space type.
# Override in DSL if non-standard requirements.
#
# =============================================================================
# ELECTRICAL CONFIGURATION PROVENANCE (Phase 39)
# =============================================================================
# Provenance: RESEARCHED from Malaysian residential standards (MS IEC 60364)
# NOT extracted from TERMINAL (industrial/marine - different use case)
# Reference: TNB domestic installation guidelines
# Status: Pending validation against real residential BOM
#
# Circuit Types:
#   general   - Standard power outlets (ring circuit, max 10 outlets)
#   wet_area  - RCD/ELCB protected (30mA trip) for bathrooms, wet kitchens
#   high_load - Dedicated circuits ≥20A for kitchen appliances
# =============================================================================

# =============================================================================
# RESIDENTIAL - ENCLOSED (4 walls)
# =============================================================================

BEDROOM:
  category: HABITABLE
  omniclass: "13-21 11 00"
  wall_rule: ENCLOSED
  validation:
    min_area: 6.5          # IRC R304.1 (70 sq ft)
    min_dimension: 2.134   # IRC R304.2 (7 ft)
    requires_window: true  # IRC R303.1
    requires_egress: true  # IRC R310.1 (sleeping room)
  is_sleeping_room: true
  mep:
    electrical:
      light_points: 1
      power_points: 2
      switch_points: 1
      circuit_type: general
    hvac:
      allows_aircon: true
      ventilation_type: natural
  aliases:
    - BED
    - BT
    - BILIK_TIDUR

