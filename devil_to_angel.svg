<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 912" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9aa3ad"/>
    </marker>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f6"/>
    </linearGradient>
  </defs>

  <rect width="1240" height="912" fill="url(#bg)"/>

  <!-- Title -->
  <text x="60" y="52" font-size="33" font-weight="700" fill="#2b2f36">The Devil You Knew</text>
  <line x1="404" y1="43" x2="452" y2="43" stroke="#0f7b7b" stroke-width="5"/>
  <polygon points="450,36 468,43 450,50" fill="#0f7b7b"/>
  <text x="486" y="52" font-size="33" font-weight="700" fill="#0f7b7b">The Angel You Must Test</text>
  <text x="60" y="84" font-size="17" fill="#5b6770">Trading a serverful ERP for a serverless one — what each comfort gave you, and what now has to be <tspan font-style="italic">proven</tspan>.</text>

  <!-- Column headers -->
  <rect x="40" y="104" width="360" height="48" rx="8" fill="#2b2f36"/>
  <text x="220" y="127" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1" fill="#ff6b5e">THE DEVIL YOU KNEW</text>
  <text x="220" y="144" text-anchor="middle" font-size="11" fill="#aeb6bf">the evil comforts — proven · heavy · always-on</text>

  <text x="550" y="124" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="1" fill="#8a939c">WHAT IT GAVE YOU</text>
  <text x="550" y="141" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="1" fill="#8a939c">FOR FREE</text>

  <rect x="700" y="104" width="500" height="48" rx="8" fill="#0f7b7b"/>
  <text x="950" y="127" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1" fill="#ffffff">THE ANGEL — UNPROVEN UNTIL TESTED</text>
  <text x="950" y="144" text-anchor="middle" font-size="11" fill="#bdeaea">lighter · serverless · must be falsified first</text>

  <!-- ============ ROWS ============ -->
  <!-- Row template: devil card 40..400 ; arrow 412..688 ; angel card 700..1200 ; pitch 112, top=170+i*112 -->

  <!-- Row 0 -->
  <g>
    <rect x="40" y="170" width="360" height="96" rx="10" fill="#33373f" stroke="#c0392b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="64" y="208" font-size="21" font-weight="700" fill="#ffffff">Postgres + fsync</text>
    <text x="64" y="234" font-size="13" fill="#9aa3ad">synchronous durability engine</text>
    <text x="550" y="210" text-anchor="middle" font-size="13" font-style="italic" fill="#6b747d">synchronous durability —</text>
    <text x="550" y="228" text-anchor="middle" font-size="13" font-style="italic" fill="#6b747d">committed = on disk</text>
    <line x1="412" y1="218" x2="688" y2="218" stroke="#9aa3ad" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="700" y="170" width="500" height="96" rx="10" fill="#f3f8ff" stroke="#1aa3a3" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="724" y="204" font-size="16.5" font-weight="600" fill="#1d2b2b">Async durability is bounded &amp; recoverable —</text>
    <text x="724" y="226" font-size="16.5" font-weight="600" fill="#1d2b2b">no silent loss window</text>
    <rect x="724" y="238" width="46" height="22" rx="11" fill="#2e86de"/><text x="747" y="253" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">A1</text>
    <rect x="778" y="238" width="46" height="22" rx="11" fill="#2e86de"/><text x="801" y="253" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">A2</text>
    <rect x="832" y="238" width="46" height="22" rx="11" fill="#e67e22"/><text x="855" y="253" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">G1</text>
  </g>

  <!-- Row 1 -->
  <g>
    <rect x="40" y="282" width="360" height="96" rx="10" fill="#33373f" stroke="#c0392b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="64" y="320" font-size="21" font-weight="700" fill="#ffffff">JVM app server</text>
    <text x="64" y="346" font-size="13" fill="#9aa3ad">the rule enforcer</text>
    <text x="550" y="322" text-anchor="middle" font-size="13" font-style="italic" fill="#6b747d">one server enforces</text>
    <text x="550" y="340" text-anchor="middle" font-size="13" font-style="italic" fill="#6b747d">every invariant</text>
    <line x1="412" y1="330" x2="688" y2="330" stroke="#9aa3ad" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="700" y="282" width="500" height="96" rx="10" fill="#f3f8ff" stroke="#1aa3a3" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="724" y="316" font-size="16.5" font-weight="600" fill="#1d2b2b">The deterministic kernel enforces on replay —</text>
    <text x="724" y="338" font-size="16.5" font-weight="600" fill="#1d2b2b">identically on every client</text>
    <rect x="724" y="350" width="46" height="22" rx="11" fill="#8e44ad"/><text x="747" y="365" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">D1</text>
    <rect x="778" y="350" width="46" height="22" rx="11" fill="#8e44ad"/><text x="801" y="365" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">D3</text>
  </g>

  <!-- Row 2 -->
  <g>
    <rect x="40" y="394" width="360" height="96" rx="10" fill="#33373f" stroke="#c0392b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="64" y="432" font-size="21" font-weight="700" fill="#ffffff">Docker / k8s</text>
    <text x="64" y="458" font-size="13" fill="#9aa3ad">the ops platform</text>
    <text x="550" y="434" text-anchor="middle" font-size="13" font-style="italic" fill="#6b747d">mature ops: logs,</text>
    <text x="550" y="452" text-anchor="middle" font-size="13" font-style="italic" fill="#6b747d">metrics, rollback</text>
    <line x1="412" y1="442" x2="688" y2="442" stroke="#9aa3ad" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="700" y="394" width="500" height="96" rx="10" fill="#f3f8ff" stroke="#1aa3a3" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="724" y="428" font-size="16.5" font-weight="600" fill="#1d2b2b">Observability &amp; safe release / rollback —</text>
    <text x="724" y="450" font-size="16.5" font-weight="600" fill="#1d2b2b">with no server to read logs from</text>
    <rect x="724" y="462" width="46" height="22" rx="11" fill="#e67e22"/><text x="747" y="477" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">G2</text>
    <rect x="778" y="462" width="46" height="22" rx="11" fill="#e67e22"/><text x="801" y="477" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">G3</text>
  </g>

  <!-- Row 3 -->
  <g>
    <rect x="40" y="506" width="360" height="96" rx="10" fill="#33373f" stroke="#c0392b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="64" y="544" font-size="21" font-weight="700" fill="#ffffff">A real DB engine</text>
    <text x="64" y="570" font-size="13" fill="#9aa3ad">unbounded &amp; concurrent</text>
    <text x="550" y="546" text-anchor="middle" font-size="13" font-style="italic" fill="#6b747d">unbounded data,</text>
    <text x="550" y="564" text-anchor="middle" font-size="13" font-style="italic" fill="#6b747d">concurrency, planner</text>
    <line x1="412" y1="554" x2="688" y2="554" stroke="#9aa3ad" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="700" y="506" width="500" height="96" rx="10" fill="#f3f8ff" stroke="#1aa3a3" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="724" y="540" font-size="16.5" font-weight="600" fill="#1d2b2b">In-memory + gravity-sharded — holds at real</text>
    <text x="724" y="562" font-size="16.5" font-weight="600" fill="#1d2b2b">data size on real devices</text>
    <rect x="724" y="574" width="46" height="22" rx="11" fill="#27ae60"/><text x="747" y="589" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">B1</text>
    <rect x="778" y="574" width="46" height="22" rx="11" fill="#27ae60"/><text x="801" y="589" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">B2</text>
    <rect x="832" y="574" width="46" height="22" rx="11" fill="#27ae60"/><text x="855" y="589" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">B3</text>
  </g>

  <!-- Row 4 -->
  <g>
    <rect x="40" y="618" width="360" height="96" rx="10" fill="#33373f" stroke="#c0392b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="64" y="656" font-size="21" font-weight="700" fill="#ffffff">Controlled server OS</text>
    <text x="64" y="682" font-size="13" fill="#9aa3ad">one runtime, pinned</text>
    <text x="550" y="658" text-anchor="middle" font-size="13" font-style="italic" fill="#6b747d">one runtime you</text>
    <text x="550" y="676" text-anchor="middle" font-size="13" font-style="italic" fill="#6b747d">pin &amp; patch</text>
    <line x1="412" y1="666" x2="688" y2="666" stroke="#9aa3ad" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="700" y="618" width="500" height="96" rx="10" fill="#f3f8ff" stroke="#1aa3a3" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="724" y="652" font-size="16.5" font-weight="600" fill="#1d2b2b">Survives the browser zoo you don't control</text>
    <text x="724" y="674" font-size="16.5" font-weight="600" fill="#1d2b2b">(Safari / iOS first)</text>
    <rect x="724" y="686" width="46" height="22" rx="11" fill="#c0392b"/><text x="747" y="701" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">C1</text>
    <rect x="778" y="686" width="46" height="22" rx="11" fill="#c0392b"/><text x="801" y="701" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">C2</text>
  </g>

  <!-- Row 5 -->
  <g>
    <rect x="40" y="730" width="360" height="96" rx="10" fill="#33373f" stroke="#c0392b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="64" y="768" font-size="21" font-weight="700" fill="#ffffff">Server-side auth</text>
    <text x="64" y="794" font-size="13" fill="#9aa3ad">a trust boundary</text>
    <text x="550" y="770" text-anchor="middle" font-size="13" font-style="italic" fill="#6b747d">a trust boundary</text>
    <text x="550" y="788" text-anchor="middle" font-size="13" font-style="italic" fill="#6b747d">you own</text>
    <line x1="412" y1="778" x2="688" y2="778" stroke="#9aa3ad" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="700" y="730" width="500" height="96" rx="10" fill="#f3f8ff" stroke="#1aa3a3" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="724" y="764" font-size="16.5" font-weight="600" fill="#1d2b2b">Signed facts + key custody carry trust</text>
    <text x="724" y="786" font-size="16.5" font-weight="600" fill="#1d2b2b">off-server</text>
    <rect x="724" y="798" width="46" height="22" rx="11" fill="#34495e"/><text x="747" y="813" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">E1</text>
    <rect x="778" y="798" width="46" height="22" rx="11" fill="#34495e"/><text x="801" y="813" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">E2</text>
    <rect x="832" y="798" width="46" height="22" rx="11" fill="#34495e"/><text x="855" y="813" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">E3</text>
  </g>

  <!-- Footer -->
  <line x1="40" y1="852" x2="1200" y2="852" stroke="#d4dae0" stroke-width="1"/>
  <circle cx="66" cy="876" r="6" fill="#27ae60"/>
  <circle cx="84" cy="876" r="6" fill="#e67e22"/>
  <circle cx="102" cy="876" r="6" fill="#c0392b"/>
  <text x="120" y="880" font-size="13.5" fill="#5b6770">Every <tspan font-style="italic">angel</tspan> claim ships with a remedy + a test —
    <tspan fill="#27ae60" font-weight="700">exists</tspan> /
    <tspan fill="#e67e22" font-weight="700">partial</tspan> /
    <tspan fill="#c0392b" font-weight="700">to build</tspan>.  The pills (A1-E3) are the live risk register.</text>
  <text x="1200" y="880" text-anchor="end" font-size="12.5" fill="#90999f">red1oon.github.io/BIMCompiler/ProductionRisks</text>
</svg>
