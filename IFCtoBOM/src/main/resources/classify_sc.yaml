    "00 begane grond": { code: GF, product_category: GF, role: GROUND_FLOOR, seq: 1020 }  # 862 elements
    "01 eerste verdieping": { code: L1, product_category: L1, role: UPPER_FLOOR, seq: 1030 }  # 884 elements
    "02 tweede verdieping": { code: L2, product_category: L2, role: UPPER_FLOOR, seq: 1040 }  # 670 elements
    "03 derde verdieping": { code: L3, product_category: L3, role: UPPER_FLOOR, seq: 1050 }  # 474 elements
    "04 dak": { code: ROOF, product_category: ROOF, role: ROOF, seq: 1060 }  # 191 elements

  # BOM = ARC/STR only (for modelling). Other disciplines (MEP/FP/ACMV…) are
  # NOT placed in the BOM — they go to the RouteWalking / IFCtoERP DISC path.
  # StructuralBomBuilder drops any element whose ifc_class is listed under MEP.
  # SC's extraction discipline field: ARC 3317, STR 206, MEP 60 (all IfcFlowSegment).
  disciplines:
    ARC: [IfcWall, IfcWallStandardCase, IfcDoor, IfcWindow, IfcCovering, IfcSlab,
          IfcStair, IfcRailing, IfcBuildingElementPart, IfcBuildingElementProxy,
          IfcDistributionElement, IfcOpeningElement]
    STR: [IfcBeam, IfcColumn, IfcMember]
    MEP: [IfcFlowSegment]

  # MEP element counts from extraction (editable — reduce for partial scope)
  discipline_counts:
    MEP: 60

