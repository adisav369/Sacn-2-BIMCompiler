# ── YAML = ONLY HUMAN-CRAFTED ARTIFACT ──────────────────────────────
# Infrastructure classification: IFC Infra Bridge Sample
# This is the first infrastructure YAML — uses `segments:` instead of `storeys:`.
# See docs/InfrastructureAnalysis.md for the pipeline mapping.
# ────────────────────────────────────────────────────────────────────
schema_version: 2

building:
  building_type: Infra_Bridge                # matches *_extracted.db name
  prefix: BR
  building_bom_id: BUILDING_BR_STD
  doc_sub_type: BR
  product_category: IN                          # IN = Infrastructure
  name: IFC Infra Bridge Sample

  # segments: removed — auto-discovered from IFC spatial structure (§10.4.13)
  # IfcBridgePart entries read from extraction DB, Z-ordered.

  static_children: []
  # MEP disciplines: defaults to none for IN (§10.4.11 T3.4)

  # Infrastructure discipline mapping
  disciplines:
    STR:  [IfcColumn, IfcBeam, IfcMember, IfcFooting, IfcSlab, IfcRailing]
    ARC:  [IfcWall, IfcBuildingElementProxy]
    GEO:  [IfcEarthworksFill]
    SIGN: [IfcSign]
