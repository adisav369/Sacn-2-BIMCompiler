# ── YAML = ONLY HUMAN-CRAFTED ARTIFACT ──────────────────────────────
# FK: FZK-Haus — German 2-storey residential with pitched timber roof.
# IFC4, ArchiCAD export, KIT ifcwiki. 82 elements, 2 storeys, 7 spaces.
# See docs/FZKHausAnalysis.md for full analysis.
# See docs/WorkOrderGuide.md for the markup rules and field dictionary.
# ────────────────────────────────────────────────────────────────────
schema_version: 1

building:
  building_type: Ifc4_FZKHaus          # matches {name}_extracted.db
  prefix: FK
  building_bom_id: BUILDING_FK_STD
  doc_sub_type: FK
  doc_base_type: RE                    # Residential
  name: FZK-Haus
  jurisdiction: MY
  dsl_file: dsl_fk.bim                # BIM COBOL script for DAGCompiler

  storeys:
    Erdgeschoss:  { code: EG, bom_category: EG, role: GROUND_FLOOR, seq: 1010 }
    Dachgeschoss: { code: DG, bom_category: DG, role: UPPER_FLOOR,  seq: 1020 }

  floor_rooms:
    Erdgeschoss:
      bom_id: FLOOR_FK_EG_STD
      bom_category: EG
      spaces:
        # Origins and AABBs from IfcSpace geometry (extract.py + ifcopenshell)
        - { name: FLUR,         template_bom: FK_CORRIDOR_SET,  role: CORRIDOR, seq: 10,
            aabb_mm: [7110, 1740, 2500], origin_m: [3.855, 4.880, 1.250] }
        - { name: BUERO,        template_bom: FK_OFFICE_SET,    role: OFFICE,   seq: 20,
            aabb_mm: [3500, 3710, 2500], origin_m: [2.050, 7.845, 1.250] }
        - { name: BAD,          template_bom: FK_BATHROOM_SET,  role: BATHROOM, seq: 30,
            aabb_mm: [3370, 3710, 2500], origin_m: [5.725, 7.845, 1.250] }
        - { name: SCHLAFZIMMER, template_bom: FK_BEDROOM_SET,   role: BEDROOM,  seq: 40,
            aabb_mm: [4050, 5450, 2500], origin_m: [9.675, 6.975, 1.250] }
        - { name: WOHNEN,       template_bom: FK_LIVING_SET,    role: LIVING,   seq: 50,
            aabb_mm: [7005, 3710, 2500], origin_m: [8.197, 2.155, 1.250] }
        - { name: KUECHE,       template_bom: FK_KITCHEN_SET,   role: KITCHEN,  seq: 60,
            aabb_mm: [4395, 3710, 2500], origin_m: [2.498, 2.155, 1.250] }
    Dachgeschoss:
      bom_id: FLOOR_FK_DG_STD
      bom_category: DG
      spaces:
        - { name: GALERIE,      template_bom: FK_GALLERY_SET,   role: GALLERY,  seq: 10,
            aabb_mm: [11400, 9400, 3387], origin_m: [6.000, 5.000, 4.393] }

  # No static_children — Bodenplatte already extracted as IfcSlab on FK_EG_STR.
  # Adding it here would double-count.

  # composition: null  — simple building, no paired units
