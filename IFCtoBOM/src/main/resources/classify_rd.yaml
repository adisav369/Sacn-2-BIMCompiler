# ── YAML = ONLY HUMAN-CRAFTED ARTIFACT ──────────────────────────────
# Infrastructure classification: IFC Infra Road Sample
# Road pavement layers + line markings across 4 carriageway segments + parking.
# See docs/InfrastructureAnalysis.md for the pipeline mapping.
# ────────────────────────────────────────────────────────────────────
schema_version: 2

building:
  building_type: Infra_Road                  # matches *_extracted.db name
  prefix: RD
  building_bom_id: BUILDING_RD_STD
  doc_sub_type: RD
  product_category: IN                          # IN = Infrastructure
  name: IFC Infra Road Sample
  dsl_file: dsl_rd.bim                       # EN-BLOC only — extracted, not generative

  # segments: removed — auto-discovered from IFC spatial structure (§10.4.13)
  # IfcRoadPart entries read from extraction DB, Z-ordered.

  static_children: []
  # MEP disciplines: defaults to none for IN (§10.4.11 T3.4)

  # Infrastructure discipline mapping
  disciplines:
    GEO:  [IfcEarthworksFill]
    PAV:  [IfcCourse]
    MARK: [IfcSurfaceFeature]
    ARC:  [IfcBuildingElementProxy]
