# ── YAML = ONLY HUMAN-CRAFTED ARTIFACT ──────────────────────────────
# Infrastructure classification: IFC Infra Road Sample
# Road pavement layers + line markings across 4 carriageway segments + parking.
# See docs/InfrastructureAnalysis.md for the pipeline mapping.
# ────────────────────────────────────────────────────────────────────
schema_version: 2

building:
  building_type: Infra_Road                  # matches *_extracted.db name
  prefix: RD
  building_bom_id: BUILDING_RD_STD
  doc_sub_type: RD
  doc_base_type: IN                          # IN = Infrastructure
  name: IFC Infra Road Sample
  dsl_file: dsl_rd.bim                       # EN-BLOC only — extracted, not generative

  # Infrastructure uses `segments:` — alias for `storeys:`.
  # Each segment is an IfcRoadPart (carriageway, parking, bridge connection)
  segments:
    road  - carriageway:           { code: CW1,  bom_category: CW,  role: CARRIAGEWAY,  seq: 1010 }
    road carriageway:              { code: CW2,  bom_category: CW,  role: CARRIAGEWAY,  seq: 1020 }
    road carriageway - bridge road: { code: CWBR, bom_category: CW,  role: CARRIAGEWAY,  seq: 1030 }
    road - parking:                { code: PKG,  bom_category: PKG, role: PARKING,       seq: 1040 }
    Unknown:                       { code: MISC, bom_category: MS,  role: MISC,          seq: 9000 }

  static_children: []
  # MEP disciplines: defaults to none for IN (§10.4.11 T3.4)

  # Infrastructure discipline mapping
  disciplines:
    GEO:  [IfcEarthworksFill]
    PAV:  [IfcCourse]
    MARK: [IfcSurfaceFeature]
    ARC:  [IfcBuildingElementProxy]
