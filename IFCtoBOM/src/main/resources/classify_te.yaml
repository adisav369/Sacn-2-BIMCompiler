  prefix: TE
  building_bom_id: BUILDING_TE_STD
  doc_sub_type: TE
  product_category: CO
  name: Airport Terminal
  geometry_fail_threshold: 2                 # 2 extracted meshes slightly exceed AABB

  storeys:
    # ── Foundation (FN) ───────────────────────────────────────
    Foundation:       { code: FDN,  product_category: FN, role: FOUNDATION,          seq: 1000 }
    00 Aras Asas:     { code: AA,   product_category: FN, role: ARAS_ASAS,           seq: 1001 }

    # ── Ground Floor (GF) ────────────────────────────────────
    Ground Floor:     { code: GF,   product_category: GF, role: GROUND_FLOOR,        seq: 1010 }
