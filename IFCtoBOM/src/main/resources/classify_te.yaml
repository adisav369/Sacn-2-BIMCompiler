    Aras Jalan:       { code: AJ,   product_category: GF, role: ARAS_JALAN,          seq: 1014 }
    Aras Kedai:       { code: AK,   product_category: GF, role: ARAS_KEDAI,          seq: 1015 }

    # ── Level 1 (L1) ─────────────────────────────────────────
    Level 1:          { code: L01,  product_category: L1, role: LEVEL_1,             seq: 1020 }
