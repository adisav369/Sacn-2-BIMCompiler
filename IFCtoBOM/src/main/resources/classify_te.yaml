schema_version: 2

building:
  building_type: Terminal              # matches I_Element_Extraction.building_type
  prefix: TE
  building_bom_id: BUILDING_TE_STD
  doc_sub_type: TE
  product_category: CO
  name: Airport Terminal
  geometry_fail_threshold: 2                 # 2 extracted meshes slightly exceed AABB

  storeys:
    Foundation:   { code: FDN, product_category: FN, role: FOUNDATION,   seq: 1000 }
    Ground Floor: { code: GF,  product_category: GF, role: GROUND_FLOOR, seq: 1010 }
    Level 1:      { code: L01, product_category: L1, role: LEVEL_1,      seq: 1020 }
    Level 2:      { code: L02, product_category: L2, role: LEVEL_2,      seq: 1030 }
    Level 3:      { code: L03, product_category: L3, role: LEVEL_3,      seq: 1040 }
    Level 4:      { code: L04, product_category: L4, role: LEVEL_4,      seq: 1050 }
    Roof:         { code: RF,  product_category: RF, role: ROOF,         seq: 2000 }

  # No floor_rooms — institutional building, not residential units
  # No composition — single building, not paired

  static_children: []

  # MEP disciplines: defaults to all 6 for CO (§10.4.11 T3.4)
  # Override with mep_disciplines: [FP, ELEC] to narrow

  # Discipline classification (REB deferred — IfcOpenShell Python)
  disciplines:
    ARC:  [IfcPlate, IfcWall, IfcWindow, IfcDoor, IfcFurniture,
           IfcCovering, IfcRailing, IfcStairFlight, IfcRoof]
    STR:  [IfcColumn, IfcBeam, IfcMember, IfcSlab]
    FP:   [IfcFireSuppressionTerminal, IfcAlarm, IfcPipeSegment,
           IfcPipeFitting]
    ACMV: [IfcAirTerminal, IfcDuctSegment, IfcDuctFitting]
    ELEC: [IfcLightFixture, IfcBuildingElementProxy, IfcElectricAppliance]
    CW:   [IfcPipeSegment, IfcPipeFitting, IfcFlowTerminal, IfcValve]
    SP:   [IfcPipeSegment, IfcPipeFitting, IfcFlowTerminal, IfcValve]
    LPG:  [IfcPipeFitting, IfcPipeSegment, IfcValve]
    # REB: DEFERRED — IfcReinforcingBar handled by IfcOpenShell Python

  # MEP element counts from extraction (editable — reduce for partial scope)
  discipline_counts:
    ACMV: 1621
    CW: 1431
    ELEC: 1172
    FP: 6863
    LPG: 209
    SP: 979
