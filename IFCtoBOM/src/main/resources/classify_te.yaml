    STR:  [IfcColumn, IfcBeam, IfcMember, IfcSlab]
    FP:   [IfcFireSuppressionTerminal, IfcAlarm, IfcPipeSegment,
           IfcPipeFitting]
    ACMV: [IfcAirTerminal, IfcDuctSegment, IfcDuctFitting]
    ELEC: [IfcLightFixture, IfcBuildingElementProxy, IfcElectricAppliance]
    CW:   [IfcPipeSegment, IfcPipeFitting, IfcFlowTerminal, IfcValve]
    SP:   [IfcPipeSegment, IfcPipeFitting, IfcFlowTerminal, IfcValve]
    LPG:  [IfcPipeFitting, IfcPipeSegment, IfcValve]
