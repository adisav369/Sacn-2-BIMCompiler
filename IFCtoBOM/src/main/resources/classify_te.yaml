    Level 2:          { code: L02,  product_category: L2, role: LEVEL_2,             seq: 1030 }
    Aras 02:          { code: A02,  product_category: L2, role: ARAS_02,             seq: 1031 }
    03 SECOND FLOOR LEVEL: { code: SFL, product_category: L2, role: SECOND_FLOOR_LEVEL, seq: 1032 }
    Ceiling Level 02: { code: CL02, product_category: L2, role: CEILING_LEVEL_02,    seq: 1033 }

    # ── Level 3 (L3) ─────────────────────────────────────────
    Level 3:          { code: L03,  product_category: L3, role: LEVEL_3,             seq: 1040 }
