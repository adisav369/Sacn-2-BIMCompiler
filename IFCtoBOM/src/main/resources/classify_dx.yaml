# ── YAML = ONLY HUMAN-CRAFTED ARTIFACT ──────────────────────────────
# This classification YAML is the single point of invention in the pipeline.
# Everything else (extraction, BOM, compilation) is deterministic code.
# See docs/WorkOrderGuide.md for the markup rules and field dictionary.
# ────────────────────────────────────────────────────────────────────
schema_version: 2

building:
  building_type: Duplex             # matches I_Element_Extraction.building_type
  prefix: DX
  building_bom_id: BUILDING_DX_STD
  doc_sub_type: DX
  product_category: RE
  name: Duplex

  # storeys: removed — auto-discovered from IFC spatial structure (§10.4.13)

  # floor_rooms: removed — IFC spatial containment is the sole source (§10.4.13)
  # 11 IfcSpaces auto-discovered: A102-A205, B102-B205 (61 furniture elements)

  static_children:
    - { child_product_id: FLOOR_SLAB_GF,         role: GROUND_SLAB, seq: 5,   dz: 0.0 }
    - { child_product_id: FLOOR_SLAB_L2,         role: UPPER_SLAB,  seq: 15,  dz: 3.0 }
    - { child_product_id: DUPLEX_MEP_TRUNK_STD,  role: MEP_TRUNK,   seq: 22,  dz: 0.0 }
    - { child_product_id: ROOF_ASSEMBLY,         role: ROOF,        seq: 25,  dz: 6.0 }
    - { child_product_id: DUPLEX_SET_STD,        role: PAIR,        seq: 100, dz: 0.0 }

  composition:
    type: MIRRORED_PAIR
    pair_bom_id: DUPLEX_SET_STD
    half_unit_bom_id: DUPLEX_SINGLE_UNIT_STD
    mirror:
      axis: X                    # partition axis: X, Y, or Z
      position: 4.4              # world-coord party wall center on that axis
      rotation: 3.141592653589793  # B-side rotation (pi = 180°)

  # ── Discipline classification (schema_version 2) ──────────────────
  # Fallback: IFC class → discipline. Authoritative discipline comes from
  # the federated source file (Architecture.ifc → ARC, Mechanical.ifc → MEP).
  # Must match reference DB. ARC and STR are parallel orgs — not merged.
  # DX: architect modelled slabs/stairs/railings, so they are ARC per source.
  disciplines:
    ARC: [IfcWall, IfcDoor, IfcWindow, IfcFurnishingElement, IfcCovering, IfcSlab, IfcStairFlight, IfcRailing]
    STR: [IfcBeam, IfcMember, IfcPlate]
    MEP: [IfcFlowController, IfcFlowFitting, IfcFlowSegment, IfcFlowTerminal]

  # MEP element counts from extraction (editable — reduce for partial scope)
  discipline_counts:
    MEP: 904

  # MEP coverage level: 99=standard, 0=max, N=budget cap (§6.12.4 §8)
  mep_order_qty: 99
