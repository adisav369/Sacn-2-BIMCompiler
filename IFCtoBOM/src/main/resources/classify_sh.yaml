# ── YAML = ONLY HUMAN-CRAFTED ARTIFACT ──────────────────────────────
# This classification YAML is the single point of invention in the pipeline.
# Everything else (extraction, BOM, compilation) is deterministic code.
# See docs/WorkOrderGuide.md for the markup rules and field dictionary.
# ────────────────────────────────────────────────────────────────────
schema_version: 1

building:
  building_type: Ifc4_SampleHouse       # matches I_Element_Extraction.building_type
  prefix: SH
  building_bom_id: BUILDING_SH_STD
  doc_sub_type: SH
  product_category: RE
  name: Sample House
  jurisdiction: MY
  dsl_file: dsl_sh.bim                  # BIM COBOL script for DAGCompiler

  storeys:
    Ground Floor: { code: GF, product_category: GF, role: GROUND_FLOOR, seq: 1010 }
    Roof:         { code: ROOF, product_category: RF, role: ROOF, seq: 1020 }
    Unknown:      { code: CW, product_category: CW, role: CURTAIN_WALL, seq: 1030 }

  # floor_rooms: removed — IFC spatial containment is the sole source (§10.4.13)
  # IfcSpaces auto-discovered from extraction DB: "1 - Living room", "2 - Bedroom"

  static_children:
    - { child_product_id: FLOOR_SLAB_GF, role: GROUND_SLAB, seq: 5, dz: 0.0 }
    - { child_product_id: ROOF_ASSEMBLY, role: ROOF, seq: 15, dz: 3.0 }

  # MEP disciplines: RE default [ELEC, SP] from Callout (§10.4.11 T3.4)
  # Override with remove_disciplines: [SP] to narrow, add_disciplines: [FP] to widen

  # composition: null  — simple building, no paired units
