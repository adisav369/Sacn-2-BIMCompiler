# ── YAML = ONLY HUMAN-CRAFTED ARTIFACT ──────────────────────────────
# This classification YAML is the single point of invention in the pipeline.
# Everything else (extraction, BOM, compilation) is deterministic code.
# See docs/WorkOrderGuide.md for the markup rules and field dictionary.
# ────────────────────────────────────────────────────────────────────
schema_version: 1

building:
  building_type: Ifc4_SampleHouse       # matches I_Element_Extraction.building_type
  prefix: SH
  building_bom_id: BUILDING_SH_STD
  doc_sub_type: SH
  doc_base_type: RE
  name: Sample House
  jurisdiction: MY
  dsl_file: dsl_sh.bim                  # BIM COBOL script for DAGCompiler

  storeys:
    Ground Floor: { code: GF, bom_category: GF, role: GROUND_FLOOR, seq: 1010 }
    Roof:         { code: ROOF, bom_category: RF, role: ROOF, seq: 1020 }
    Unknown:      { code: CW, bom_category: CW, role: CURTAIN_WALL, seq: 1030 }

  floor_rooms:
    Ground Floor:
      bom_id: FLOOR_SH_GF_STD
      bom_category: GF
      spaces:
        - { name: LIVING,   template_bom: SH_LIVING_SET,        role: LIVING,   seq: 10,
            aabb_mm: [8000, 2000, 1200], origin_m: [-7.0, 2.5, 0.0] }
        - { name: DINING,   template_bom: SH_DINING_SET,        role: DINING,   seq: 20,
            aabb_mm: [2500, 1500, 1300], origin_m: [-6.5, -0.3, 0.0] }
        - { name: MASTER,   template_bom: SH_BED_SET,           role: MASTER,   seq: 30,
            aabb_mm: [2200, 3500, 800],  origin_m: [4.0, 1.5, 0.0] }
        - { name: BATHROOM, template_bom: TOILET_BLOCK_FIXTURES, role: BATHROOM, seq: 40,
            aabb_mm: [0, 0, 0] }

  static_children:
    - { child_product_id: FLOOR_SLAB_GF, role: GROUND_SLAB, seq: 5, dz: 0.0 }
    - { child_product_id: ROOF_ASSEMBLY, role: ROOF, seq: 15, dz: 3.0 }

  # MEP disciplines: RE default [ELEC, SP] from Callout (§10.4.11 T3.4)
  # Override with remove_disciplines: [SP] to narrow, add_disciplines: [FP] to widen

  # composition: null  — simple building, no paired units
