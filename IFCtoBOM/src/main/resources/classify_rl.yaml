# ── YAML = ONLY HUMAN-CRAFTED ARTIFACT ──────────────────────────────
# Infrastructure classification: IFC Infra Rail Sample
# Railway track: 66 sleepers at 606mm spacing, 4 rails, 2 ballast beds.
# See docs/InfrastructureAnalysis.md for the pipeline mapping.
# ────────────────────────────────────────────────────────────────────
schema_version: 2

building:
  building_type: Infra_Rail                  # matches *_extracted.db name
  prefix: RL
  building_bom_id: BUILDING_RL_STD
  doc_sub_type: RL
  product_category: IN                          # IN = Infrastructure
  name: IFC Infra Rail Sample
  dsl_file: dsl_rl.bim                       # EN-BLOC only — extracted, not generative

  # Infrastructure uses `segments:` — alias for `storeys:`.
  # All track elements are in a single "Rail track" segment.
  segments:
    Rail track:                    { code: TRK,  product_category: TRK, role: TRACK,         seq: 1010 }
    Unknown:                       { code: MISC, product_category: MS,  role: MISC,          seq: 9000 }

  static_children: []
  # MEP disciplines: defaults to none for IN (§10.4.11 T3.4)

  # Infrastructure discipline mapping
  disciplines:
    TRK:  [IfcTrackElement, IfcRail]
    GEO:  [IfcCourse]
    ARC:  [IfcBuildingElementProxy]
