schema_version: 2

building:
  building_type: Infra_Rail                  # matches *_extracted.db name
  prefix: RL
  building_bom_id: BUILDING_RL_STD
  doc_sub_type: RL
  product_category: IN                          # IN = Infrastructure
  name: IFC Infra Rail Sample

  # segments: removed — auto-discovered from IFC spatial structure (§10.4.13)
  # IfcRailwayPart entries read from extraction DB, Z-ordered.

  static_children: []
  # MEP disciplines: defaults to none for IN (§10.4.11 T3.4)

  # Infrastructure discipline mapping
  disciplines:
    TRK:  [IfcTrackElement, IfcRail]
    GEO:  [IfcCourse]
    ARC:  [IfcBuildingElementProxy]
